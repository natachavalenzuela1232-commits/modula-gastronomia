function PanelResultados({items,menu,recetas,insumos,gastos,compras,config,mesas,cierres}){
  const UMBRAL_MARGEN_BAJO=config?.umbral_margen_bajo??25;
  const UMBRAL_AUMENTO_COSTO=config?.umbral_aumento_costo??15;
  const[analisis,setAnalisis]=useState(null);
  const[analisisLoading,setAnalisisLoading]=useState(false);
  const costoItem=item=>costoProducto(item,recetas,insumos);
  const precioAnteriorInsumo=insumoId=>{
    const hist=compras.filter(c=>c.insumo_id===insumoId).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    return hist.length>=2?Number(hist[1].precio_unitario):null;
  };
  const insumosPrecioAnterior=insumos.map(ins=>{const pa=precioAnteriorInsumo(ins.id);return pa!=null?{...ins,precio_compra:pa}:ins;});
  const productosCostoSubio=menu.filter(m=>!m.archivado).map(m=>{
    const costoActual=costoProducto(m,recetas,insumos);
    const costoAnterior=costoProducto(m,recetas,insumosPrecioAnterior);
    if(costoActual==null||costoAnterior==null||costoAnterior<=0)return{...m,costoActual,costoAnterior,pct:null};
    const pct=Math.round(((costoActual-costoAnterior)/costoAnterior)*100);
    return{...m,costoActual,costoAnterior,pct};
  }).filter(m=>m.pct!=null&&m.pct>=UMBRAL_AUMENTO_COSTO).sort((a,b)=>b.pct-a.pct);
  const itemsHoy=items.filter(i=>i.created_at&&i.created_at.slice(0,10)===hoy());
  const ventasHoy=itemsHoy.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
  const costoMercaderiaHoy=itemsHoy.reduce((s,i)=>{const mi=menu.find(m=>m.id===i.menu_item_id);return s+(mi?costoItem(mi)*i.cantidad:0);},0);
  const gastosHoy=gastos.filter(g=>g.fecha===hoy()).reduce((s,g)=>s+Number(g.monto),0);
  const gananciaHoy=ventasHoy-costoMercaderiaHoy-gastosHoy;
  const margenPctHoy=ventasHoy>0?Math.round((gananciaHoy/ventasHoy)*100):0;
  const tabla=menu.filter(m=>!m.archivado).map(m=>{
    const costo=costoItem(m);
    const margen=costo==null?null:m.precio-costo;
    const pct=costo==null||m.precio<=0?null:Math.round((margen/m.precio)*100);
    return{...m,costo,margen,pct};
  }).sort((a,b)=>(b.margen??-Infinity)-(a.margen??-Infinity));
  const conVentaHoy=new Set(itemsHoy.map(i=>i.menu_item_id));
  const masRentables=tabla.filter(m=>m.precio>0&&m.margen!=null).slice(0,5);
  const menosRentables=[...tabla].filter(m=>m.precio>0&&m.margen!=null).sort((a,b)=>a.margen-b.margen).slice(0,5);
  const margenBajo=tabla.filter(m=>m.precio>0&&m.pct!=null&&m.pct<UMBRAL_MARGEN_BAJO);
  const sinPrecio=tabla.filter(m=>m.precio>0&&m.costo==null);
  const stockBajo=insumos.filter(i=>Number(i.stock_actual)<=Number(i.stock_minimo));
  const generarAnalisis=async()=>{
    setAnalisisLoading(true);setAnalisis(null);
    const cierreHoy=cierres.find(c=>c.fecha===hoy());
    const mesasAtendidasReal=cierreHoy?cierreHoy.cantidad_mesas:mesas.filter(m=>m.estado==="ocupada").length;
    const productosVendidos=tabla.filter(m=>conVentaHoy.has(m.id)).map(m=>{
      const cant=itemsHoy.filter(i=>i.menu_item_id===m.id).reduce((s,i)=>s+i.cantidad,0);
      return{nombre:m.nombre,cantidad:cant,venta:cant*Number(m.precio),costo:Math.round(cant*m.costo)};
    }).sort((a,b)=>b.venta-a.venta);
    const comprasNecesarias=stockBajo.map(i=>({nombre:i.nombre,faltante:Math.max(i.stock_minimo-i.stock_actual,0),unidad:i.unidad}));
    try{
      const res=await fetch(`${SUPABASE_URL}/functions/v1/resumen-diario`,{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`,"apikey":SUPABASE_KEY},
        body:JSON.stringify({
          totalHoy:ventasHoy,mesasAtendidas:mesasAtendidasReal,productosVendidos,
          costoTotal:Math.round(costoMercaderiaHoy),margen:Math.round(gananciaHoy),comprasNecesarias,
          productosMargenBajo:margenBajo.map(m=>({nombre:m.nombre,margenPct:m.pct})),
          productosCostoSubio:productosCostoSubio.map(m=>({nombre:m.nombre,subioPct:m.pct})),
        }),
      });
      const d=await res.json();
      setAnalisis(d.resumen||"No se pudo generar el análisis.");
    }catch(e){setAnalisis("Error de conexión al generar el análisis.");}
    finally{setAnalisisLoading(false);}
  };
  return(
    <div>
      <div className="card" style={{padding:"12px 16px",marginBottom:16,background:"var(--surface-2)",border:"none",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap"}}>
        <span style={{fontSize:14.5,color:"var(--ink-soft)"}}>📊 Acá ves cómo le está yendo al negocio: cuánto vendiste, cuánto te costó lo que vendiste, cuánto gastaste, y qué productos conviene empujar o revisar.</span>
        <button className="bp" style={{whiteSpace:"nowrap"}} onClick={generarAnalisis} disabled={analisisLoading}>{analisisLoading?"Analizando…":"✨ Análisis con IA"}</button>
      </div>
      {analisis&&<div className="card" style={{padding:18,marginBottom:16,background:"var(--accent-tint)",border:"1px solid var(--accent)",whiteSpace:"pre-wrap",fontSize:14.5,lineHeight:1.55}}>{analisis}</div>}
      <div className="card" style={{padding:18,marginBottom:22}}>
        <div style={{fontSize:21,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>HOY</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:16}}>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>VENTAS</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700,color:"var(--primary-dark)"}}>{money(ventasHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>COSTO MERCADERÍA</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700}}>{money(costoMercaderiaHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>GASTOS</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700}}>{money(gastosHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>GANANCIA ESTIMADA</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700,color:gananciaHoy<0?"var(--warn)":"var(--accent)"}}>{money(gananciaHoy)}{ventasHoy>0&&<span style={{fontSize:14,fontWeight:600,color:"var(--ink-soft)"}}> ({margenPctHoy}%)</span>}</div></div>
        </div>
      </div>
      {sinPrecio.length>0&&<div className="card" style={{padding:16,marginBottom:22,background:"var(--warn-tint)",border:"1px solid var(--warn)"}}>
        <div style={{fontWeight:800,color:"var(--warn)",marginBottom:8}}>⚠ Productos sin precio todavía</div>
        <div style={{fontSize:13.5,color:"var(--warn)",marginBottom:6}}>Todavía no se puede calcular el margen — falta comprar algún ingrediente de la receta.</div>
        {sinPrecio.map(m=><div key={m.id} style={{fontSize:14.5,padding:"3px 0"}}>• {m.nombre}</div>)}
      </div>}
      {margenBajo.length>0&&<div className="card" style={{padding:16,marginBottom:22,background:"var(--warn-tint)",border:"1px solid var(--warn)"}}>
        <div style={{fontWeight:800,color:"var(--warn)",marginBottom:8}}>⚠ Productos con margen menor a {UMBRAL_MARGEN_BAJO}%</div>
        {margenBajo.map(m=><div key={m.id} style={{fontSize:14.5,padding:"3px 0"}}>• {m.nombre} — margen {m.pct}% ({money(m.margen)})</div>)}
      </div>}
      {productosCostoSubio.length>0&&<div className="card" style={{padding:16,marginBottom:22,background:"var(--warn-tint)",border:"1px solid var(--warn)"}}>
        <div style={{fontWeight:800,color:"var(--warn)",marginBottom:8}}>📈 Productos cuyo costo subió</div>
        {productosCostoSubio.map(m=><div key={m.id} style={{fontSize:14.5,padding:"3px 0"}}>• {m.nombre} — costo {money(m.costoAnterior)} → {money(m.costoActual)} <span style={{fontWeight:700}}>(+{m.pct}%)</span></div>)}
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:16,marginBottom:22}}>
        <div className="card" style={{padding:18}}>
          <div style={{fontSize:18,fontWeight:800,color:"var(--accent)",marginBottom:10}}>🏆 MÁS RENTABLES</div>
          {!masRentables.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Todavía no hay productos con precio cargado.</div>}
          {masRentables.map((m,idx)=>(
            <div key={m.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderTop:idx>0?"1px solid var(--line)":"none",fontSize:14.5}}>
              <span>{m.nombre}</span>
              <span style={{fontWeight:700,color:"var(--accent)"}}>{money(m.margen)} ({m.pct}%)</span>
            </div>
          ))}
        </div>
        <div className="card" style={{padding:18}}>
          <div style={{fontSize:18,fontWeight:800,color:"var(--primary)",marginBottom:10}}>📉 MENOS RENTABLES</div>
          {!menosRentables.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Todavía no hay productos con precio cargado.</div>}
          {menosRentables.map((m,idx)=>(
            <div key={m.id} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderTop:idx>0?"1px solid var(--line)":"none",fontSize:14.5}}>
              <span>{m.nombre}</span>
              <span style={{fontWeight:700,color:m.margen<0?"var(--warn)":"var(--primary)"}}>{money(m.margen)} ({m.pct}%)</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{fontSize:21,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>RENTABILIDAD POR PRODUCTO</div>
      {!tabla.length&&<div className="card" style={{padding:20,color:"var(--ink-soft)",fontSize:15}}>Todavía no cargaste productos en el Menú.</div>}
      {tabla.length>0&&<div className="card" style={{padding:0,overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:14}}>
          <thead>
            <tr style={{borderBottom:"2px solid var(--line)"}}>
              <th style={{textAlign:"left",padding:"10px 14px",color:"var(--ink-soft)",fontSize:13}}>Producto</th>
              <th style={{textAlign:"right",padding:"10px 14px",color:"var(--ink-soft)",fontSize:13}}>Costo</th>
              <th style={{textAlign:"right",padding:"10px 14px",color:"var(--ink-soft)",fontSize:13}}>Precio</th>
              <th style={{textAlign:"right",padding:"10px 14px",color:"var(--ink-soft)",fontSize:13}}>Margen</th>
              <th style={{textAlign:"right",padding:"10px 14px",color:"var(--ink-soft)",fontSize:13}}>Margen %</th>
              <th style={{textAlign:"center",padding:"10px 14px",color:"var(--ink-soft)",fontSize:13}}>Vendido hoy</th>
            </tr>
          </thead>
          <tbody>
            {tabla.map(m=>(
              <tr key={m.id} style={{borderBottom:"1px solid var(--line)"}}>
                <td style={{padding:"9px 14px",fontWeight:700,whiteSpace:"nowrap"}}>{m.nombre}</td>
                <td style={{padding:"9px 14px",textAlign:"right",color:m.costo==null?"var(--warn)":"var(--ink-soft)"}}>{m.costo==null?"Sin precio":money(m.costo)}</td>
                <td style={{padding:"9px 14px",textAlign:"right"}}>{money(m.precio)}</td>
                <td style={{padding:"9px 14px",textAlign:"right",fontWeight:700,color:m.margen==null?"var(--warn)":m.margen<0?"var(--warn)":"var(--accent)"}}>{m.margen==null?"—":money(m.margen)}</td>
                <td style={{padding:"9px 14px",textAlign:"right",fontWeight:700,color:m.pct==null?"var(--warn)":m.pct<UMBRAL_MARGEN_BAJO?"var(--warn)":"var(--ink)"}}>{m.pct==null?"—":`${m.pct}%`}</td>
                <td style={{padding:"9px 14px",textAlign:"center"}}>{conVentaHoy.has(m.id)?"✅":"—"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>}
    </div>
  );
}

function PanelConfiguracion({userId,config,reload}){
  const[form,setForm]=useState({umbral_aumento_costo:String(config?.umbral_aumento_costo??15),umbral_margen_bajo:String(config?.umbral_margen_bajo??25),pin_dueno:config?.pin_dueno||""});
  const[guardado,setGuardado]=useState(false);
  const num=v=>v.replace(",",".").replace(/[^0-9.]/g,"");
  const guardar=async()=>{
    await sb.from("configuracion").upsert({user_id:userId,umbral_aumento_costo:Number(form.umbral_aumento_costo)||15,umbral_margen_bajo:Number(form.umbral_margen_bajo)||25,pin_dueno:form.pin_dueno.trim()||null,updated_at:new Date().toISOString()});
    setGuardado(true);setTimeout(()=>setGuardado(false),2500);reload();
  };
  return(
    <div>
      <div className="card" style={{padding:"12px 16px",marginBottom:16,background:"var(--surface-2)",border:"none"}}>
        <span style={{fontSize:14.5,color:"var(--ink-soft)"}}>⚙️ Acá ajustás los números que la app usa para avisarte de cosas automáticamente.</span>
      </div>
      <div className="card" style={{padding:18,maxWidth:420}}>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>PIN para entrar como dueño/a</label>
          <div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:6}}>Si lo dejás vacío, cualquiera puede tocar "Soy el dueño/a" sin PIN. Con un PIN puesto, se va a pedir antes de dejar entrar a ver costos, márgenes y caja.</div>
          <input className="field" inputMode="numeric" style={{width:120,textAlign:"center",letterSpacing:3}} value={form.pin_dueno} onChange={e=>setForm({...form,pin_dueno:e.target.value.replace(/\D/g,"")})} placeholder="ej: 1234"/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>Aviso de aumento de costo</label>
          <div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:6}}>Se usa en Compras (al pagar más caro un insumo) y en Resultados (productos cuyo costo subió).</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}><input className="field" style={{width:90}} value={form.umbral_aumento_costo} onChange={e=>setForm({...form,umbral_aumento_costo:num(e.target.value)})}/><span style={{fontSize:15}}>% o más</span></div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>Aviso de margen bajo</label>
          <div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:6}}>Se usa en Resultados, para marcar productos cuyo margen de ganancia es chico.</div>
          <div style={{display:"flex",alignItems:"center",gap:8}}><input className="field" style={{width:90}} value={form.umbral_margen_bajo} onChange={e=>setForm({...form,umbral_margen_bajo:num(e.target.value)})}/><span style={{fontSize:15}}>% o menos</span></div>
        </div>
        <button className="bp" onClick={guardar}>Guardar</button>
        {guardado&&<span style={{marginLeft:12,color:"var(--accent)",fontWeight:700,fontSize:14.5}}>✓ Guardado</span>}
      </div>
    </div>
  );
}

function PanelInicio({identidad,mesas,items,menu,recetas,insumos,gastos,config,cierres,irA}){
  const UMBRAL_MARGEN_BAJO=config?.umbral_margen_bajo??25;
  const itemsHoy=items.filter(i=>i.created_at&&i.created_at.slice(0,10)===hoy());
  const ventasHoy=itemsHoy.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
  const costoMercaderiaHoy=itemsHoy.reduce((s,i)=>{const mi=menu.find(m=>m.id===i.menu_item_id);return s+(mi?costoProducto(mi,recetas,insumos)*i.cantidad:0);},0);
  const gastosHoy=gastos.filter(g=>g.fecha===hoy()).reduce((s,g)=>s+Number(g.monto),0);
  const gananciaHoy=ventasHoy-costoMercaderiaHoy-gastosHoy;
  const mesasOcupadas=mesas.filter(m=>m.estado==="ocupada").length;
  const cierreHoy=cierres.find(c=>c.fecha===hoy());
   const stockBajo=insumos.filter(i=>Number(i.stock_actual)<=Number(i.stock_minimo));
  const margenBajo=menu.filter(m=>!m.archivado&&m.precio>0).map(m=>{
    const costo=costoProducto(m,recetas,insumos);
    if(costo==null)return{...m,pct:null};
    const pct=Math.round(((m.precio-costo)/m.precio)*100);
    return{...m,pct};
  }).filter(m=>m.pct!=null&&m.pct<UMBRAL_MARGEN_BAJO);
  const saludo=identidad?.nombre?`Hola, ${identidad.nombre}`:"Hola";
  const fechaLarga=new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});
  return(
    <div>
      <div style={{marginBottom:20}}>
        <div style={{fontFamily:"'Fraunces',serif",fontSize:28,fontWeight:700}}>{saludo} 👋</div>
        <div style={{fontSize:15,color:"var(--ink-soft)",textTransform:"capitalize"}}>{fechaLarga}</div>
      </div>
      <div className="card" style={{padding:18,marginBottom:20}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:16}}>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>VENTAS HOY</div><div style={{fontFamily:"'Fraunces',serif",fontSize:24,fontWeight:700,color:"var(--primary-dark)"}}>{money(ventasHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>GANANCIA ESTIMADA</div><div style={{fontFamily:"'Fraunces',serif",fontSize:24,fontWeight:700,color:gananciaHoy<0?"var(--warn)":"var(--accent)"}}>{money(gananciaHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>MESAS OCUPADAS</div><div style={{fontFamily:"'Fraunces',serif",fontSize:24,fontWeight:700}}>{mesasOcupadas}</div></div>
        </div>
        {!cierreHoy&&<div style={{fontSize:13,color:"var(--ink-soft)",marginTop:10}}>Todavía no cerraste la caja de hoy.</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:16,marginBottom:20}}>
        <div className="card" style={{padding:18,cursor:"pointer"}} onClick={()=>irA("stock")}>
          <div style={{fontSize:16,fontWeight:800,color:stockBajo.length?"var(--warn)":"var(--ink-soft)",marginBottom:8}}>📦 Stock bajo mínimo{stockBajo.length>0?` (${stockBajo.length})`:""}</div>
          {!stockBajo.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Todo el stock está en orden.</div>}
          {stockBajo.slice(0,4).map(i=><div key={i.id} style={{fontSize:14,padding:"2px 0"}}>• {i.nombre}</div>)}
          {stockBajo.length>4&&<div style={{fontSize:13,color:"var(--ink-soft)"}}>+{stockBajo.length-4} más — ver Stock</div>}
        </div>
        <div className="card" style={{padding:18,cursor:"pointer"}} onClick={()=>irA("resultados")}>
          <div style={{fontSize:16,fontWeight:800,color:margenBajo.length?"var(--warn)":"var(--ink-soft)",marginBottom:8}}>📊 Márgenes bajos{margenBajo.length>0?` (${margenBajo.length})`:""}</div>
          {!margenBajo.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Ningún producto tiene margen bajo.</div>}
          {margenBajo.slice(0,4).map(m=><div key={m.id} style={{fontSize:14,padding:"2px 0"}}>• {m.nombre} ({m.pct}%)</div>)}
          {margenBajo.length>4&&<div style={{fontSize:13,color:"var(--ink-soft)"}}>+{margenBajo.length-4} más — ver Resultados</div>}
        </div>
      </div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button className="bg" onClick={()=>irA("mesas")}>🍽️ Ir a Mesas</button>
        <button className="bg" onClick={()=>irA("caja")}>💰 Ir a Caja</button>
        <button className="bg" onClick={()=>irA("resultados")}>📊 Ver Resultados</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
