<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MODULA Gastronomía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg: #FAF6F1; --surface: #FFFFFF; --surface-2: #FBF3EC;
  --ink: #2B211B; --ink-soft: #75655A;
  --primary: #C1440E; --primary-dark: #8C2F08; --primary-tint: #FBE7DA;
  --accent: #2F7E68; --accent-tint: #E1F0EA;
  --warn: #C79A2E; --warn-tint: #FBF0D8;
  --line: #E9DED2; --shadow: 0 1px 2px rgba(43,33,27,0.05), 0 4px 16px rgba(43,33,27,0.07);
}
* { box-sizing: border-box; }
html, body, #root { margin:0; padding:0; min-height:100%; background:var(--bg); }
body { font-family:'Manrope',sans-serif; color:var(--ink); }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
.field { width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); font-size:14px; color:var(--ink); }
.field:focus { outline:2px solid var(--primary); outline-offset:1px; }
.btn-primary { background:var(--primary); color:white; border:none; padding:10px 18px; border-radius:10px; font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; justify-content:center; }
.btn-primary:hover { background:var(--primary-dark); }
.btn-primary:disabled { opacity:0.55; }
.btn-ghost { background:transparent; border:1px solid var(--line); color:var(--ink-soft); padding:8px 12px; border-radius:9px; font-weight:600; font-size:13px; }
.btn-ghost:hover { background: var(--surface-2); }
.tag { font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; letter-spacing:.02em; }
.mesabtn { border-radius:14px; padding:18px 10px; border:2px solid var(--line); background:var(--surface); font-weight:800; font-size:15px; display:flex; flex-direction:column; align-items:center; gap:6px; }
@media (max-width: 760px) {
  .app-shell { flex-direction: column; }
  .sidebar { width:100% !important; flex-direction:row !important; overflow-x:auto; border-right:none !important; border-bottom:1px solid var(--line); padding:10px !important; }
  .sidebar nav { flex-direction:row !important; }
  .sidebar .tip { display:none; }
  main { padding:16px !important; }
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

// ====== CONFIGURÁ ACÁ TUS DATOS DE SUPABASE (proyecto NUEVO, distinto al de Vocare) ======
const SUPABASE_URL = "https://zibuxcbidjymrlvdsgse.supabase.co";
const SUPABASE_KEY = "sb_publishable_9Wcf3GqvO8WQYQqAm5oGIQ_troL-Oav";
// ==========================================================================================

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const money = (n) => `$${Number(n||0).toLocaleString("es-AR")}`;
const hora = (iso) => new Date(iso).toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });

// ---------------- LOGIN (cuenta del negocio, la crea el dueño) ----------------
function Login() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [loading, setLoading] = useState(false);
  const [msg, setMsg] = useState("");

  const submit = async () => {
    setMsg(""); setLoading(true);
    try {
      if (mode === "signin") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setMsg("¡Cuenta del negocio creada! Si te pide confirmación, revisá tu email. Si no, ya podés iniciar sesión.");
        setMode("signin");
      }
    } catch (e) {
      setMsg(e.message || "Ocurrió un error, probá de nuevo.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)", padding:20 }}>
      <div className="card" style={{ width:"100%", maxWidth:380, padding:32 }}>
        <div style={{ textAlign:"center", marginBottom:26 }}>
          <div style={{ fontFamily:"'Fraunces',serif", fontWeight:700, fontSize:24, color:"var(--primary-dark)" }}>MODULA <span style={{ color:"var(--primary)" }}>Gastronomía</span></div>
          <div style={{ fontSize:12.5, color:"var(--ink-soft)", marginTop:4 }}>{mode==="signin" ? "Iniciá sesión con la cuenta de tu negocio" : "Creá la cuenta de tu negocio"}</div>
        </div>
        <div style={{ marginBottom:12 }}>
          <label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Email</label>
          <input className="field" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tunegocio@email.com" />
        </div>
        <div style={{ marginBottom:18 }}>
          <label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Contraseña</label>
          <input className="field" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==="Enter" && submit()} />
        </div>
        {msg && <div style={{ fontSize:12.5, color:"var(--primary)", marginBottom:14, lineHeight:1.4 }}>{msg}</div>}
        <button className="btn-primary" style={{ width:"100%", padding:12 }} onClick={submit} disabled={loading || !email || !password}>
          {loading ? "Un momento…" : mode==="signin" ? "Iniciar sesión" : "Crear cuenta del negocio"}
        </button>
        <div style={{ textAlign:"center", marginTop:16, fontSize:13 }}>
          {mode==="signin" ? (
            <span style={{ color:"var(--ink-soft)" }}>¿Primera vez? <a href="#" onClick={e=>{e.preventDefault(); setMode("signup"); setMsg("");}} style={{ color:"var(--primary)", fontWeight:700 }}>Creá la cuenta de tu negocio</a></span>
          ) : (
            <span style={{ color:"var(--ink-soft)" }}>¿Ya tenés cuenta? <a href="#" onClick={e=>{e.preventDefault(); setMode("signin"); setMsg("");}} style={{ color:"var(--primary)", fontWeight:700 }}>Iniciá sesión</a></span>
          )}
        </div>
      </div>
    </div>
  );
}

// ---------------- Selector de identidad: "¿Quién sos?" ----------------
function SelectorIdentidad({ empleados, onElegir }) {
  const [eligiendo, setEligiendo] = useState(null);
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const confirmarPin = () => {
    if (eligiendo.pin !== pin.trim()) { setError("PIN incorrecto."); return; }
    onElegir({ rol: eligiendo.rol, id: eligiendo.id, nombre: eligiendo.nombre });
  };

  return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)", padding:20 }}>
      <div className="card" style={{ width:"100%", maxWidth:420, padding:32 }}>
        {!eligiendo ? (
          <React.Fragment>
            <div style={{ fontFamily:"'Fraunces',serif", fontWeight:700, fontSize:20, color:"var(--primary-dark)", textAlign:"center", marginBottom:22 }}>¿Quién sos?</div>
            <button className="btn-primary" style={{ width:"100%", padding:14, marginBottom:10, fontSize:15 }} onClick={()=>onElegir({ rol:"dueño", id:null, nombre:"Dueño/a" })}>👑 Soy el dueño/a</button>
            {empleados.filter(e=>e.activo).map(e => (
              <button key={e.id} className="btn-ghost" style={{ width:"100%", padding:14, marginBottom:8, fontSize:14.5, textAlign:"left", display:"flex", alignItems:"center", gap:10 }} onClick={()=>{setEligiendo(e); setPin(""); setError("");}}>
                {e.rol==="mozo" ? "🧑‍🍳" : "👨‍🍳"} {e.nombre} <span style={{ marginLeft:"auto", color:"var(--ink-soft)", fontSize:11.5, fontWeight:700 }}>{e.rol==="mozo"?"MOZO":"COCINA"}</span>
              </button>
            ))}
            {empleados.filter(e=>e.activo).length===0 && <div style={{ fontSize:12.5, color:"var(--ink-soft)", textAlign:"center", marginTop:8 }}>Todavía no hay empleados cargados. El dueño puede agregarlos desde su panel.</div>}
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ fontFamily:"'Fraunces',serif", fontWeight:700, fontSize:18, color:"var(--primary-dark)", textAlign:"center", marginBottom:16 }}>Hola, {eligiendo.nombre} — ingresá tu PIN</div>
            <input className="field" type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN" style={{ textAlign:"center", fontSize:20, letterSpacing:4, marginBottom:12 }} onKeyDown={e=>e.key==="Enter" && confirmarPin()} autoFocus />
            {error && <div style={{ color:"var(--primary)", fontSize:12.5, textAlign:"center", marginBottom:10 }}>{error}</div>}
            <button className="btn-primary" style={{ width:"100%", padding:12, marginBottom:8 }} onClick={confirmarPin}>Entrar</button>
            <button className="btn-ghost" style={{ width:"100%" }} onClick={()=>setEligiendo(null)}>Volver</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// ---------------- APP PRINCIPAL ----------------
function App() {
  const [session, setSession] = useState(undefined);
  const [identidad, setIdentidad] = useState(null);
  const [empleados, setEmpleados] = useState([]);
  const [mesas, setMesas] = useState([]);
  const [menu, setMenu] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [items, setItems] = useState([]);
  const [loadingData, setLoadingData] = useState(true);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  const loadAll = async () => {
    setLoadingData(true);
    const [e, m, mn, p, it] = await Promise.all([
      supabase.from("empleados").select("*").order("created_at"),
      supabase.from("mesas").select("*").order("numero"),
      supabase.from("menu_items").select("*").order("categoria"),
      supabase.from("pedidos").select("*").eq("estado","abierta"),
      supabase.from("pedido_items").select("*").order("created_at"),
    ]);
    setEmpleados(e.data || []);
    setMesas(m.data || []);
    setMenu(mn.data || []);
    setPedidos(p.data || []);
    setItems(it.data || []);
    setLoadingData(false);
  };

  useEffect(() => {
    if (!session) return;
    loadAll();
    const savedId = localStorage.getItem("modula_identidad");
    if (savedId) { try { setIdentidad(JSON.parse(savedId)); } catch {} }

    const canal = supabase.channel("realtime-gastro")
      .on("postgres_changes", { event:"*", schema:"public", table:"pedido_items" }, () => loadAll())
      .on("postgres_changes", { event:"*", schema:"public", table:"pedidos" }, () => loadAll())
      .on("postgres_changes", { event:"*", schema:"public", table:"mesas" }, () => loadAll())
      .subscribe();
    return () => supabase.removeChannel(canal);
  }, [session]);

  const elegirIdentidad = (id) => {
    setIdentidad(id);
    localStorage.setItem("modula_identidad", JSON.stringify(id));
  };
  const cambiarIdentidad = () => {
    localStorage.removeItem("modula_identidad");
    setIdentidad(null);
  };
  const logout = async () => { localStorage.removeItem("modula_identidad"); await supabase.auth.signOut(); };

  if (session === undefined) return <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--ink-soft)" }}>Cargando…</div>;
  if (!session) return <Login />;
  if (loadingData) return <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", color:"var(--ink-soft)" }}>Cargando el negocio…</div>;
  if (!identidad) return <SelectorIdentidad empleados={empleados} onElegir={elegirIdentidad} />;

  const props = { userId: session.user.id, identidad, empleados, mesas, menu, pedidos, items, reload: loadAll, cambiarIdentidad, logout };
  if (identidad.rol === "dueño") return <VistaDueño {...props} />;
  if (identidad.rol === "mozo") return <VistaMozo {...props} />;
  if (identidad.rol === "cocina") return <VistaCocina {...props} />;
  return null;
}

function TopBar({ titulo, identidad, cambiarIdentidad, logout }) {
  return (
    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", padding:"14px 20px", background:"var(--surface)", borderBottom:"1px solid var(--line)" }}>
      <div style={{ fontFamily:"'Fraunces',serif", fontWeight:700, fontSize:17, color:"var(--primary-dark)" }}>{titulo}</div>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <span style={{ fontSize:12.5, color:"var(--ink-soft)", fontWeight:600 }}>{identidad.nombre}</span>
        <button className="btn-ghost" style={{ padding:"6px 10px", fontSize:12 }} onClick={cambiarIdentidad}>Cambiar usuario</button>
        <button className="btn-ghost" style={{ padding:"6px 10px", fontSize:12 }} onClick={logout}>Salir</button>
      </div>
    </div>
  );
}

// ---------------- VISTA MOZO ----------------
function VistaMozo({ userId, identidad, mesas, menu, pedidos, items, reload, cambiarIdentidad, logout }) {
  const [mesaAbierta, setMesaAbierta] = useState(null);
  const [aclaracion, setAclaracion] = useState("");

  const misMesas = mesas.filter(m => m.estado==="libre" || m.mozo_id===identidad.id);
  const mesaSel = mesaAbierta ? mesas.find(m=>m.id===mesaAbierta) : null;
  const pedidoSel = mesaSel ? pedidos.find(p=>p.mesa_id===mesaSel.id) : null;
  const itemsMesa = pedidoSel ? items.filter(i=>i.pedido_id===pedidoSel.id) : [];

  const abrirMesa = async (m) => {
    if (m.estado==="libre") {
      await supabase.from("mesas").update({ estado:"ocupada", mozo_id:identidad.id, mozo_nombre:identidad.nombre }).eq("id", m.id);
      await supabase.from("pedidos").insert({ user_id:userId, mesa_id:m.id, mesa_numero:m.numero, mozo_id:identidad.id, mozo_nombre:identidad.nombre, estado:"abierta" });
      await reload();
    }
    setMesaAbierta(m.id);
  };

  const agregarItem = async (menuItem) => {
    if (!pedidoSel) return;
    await supabase.from("pedido_items").insert({
      user_id:userId, pedido_id:pedidoSel.id, mesa_numero:mesaSel.numero,
      menu_item_id:menuItem.id, nombre:menuItem.nombre, precio:menuItem.precio,
      aclaracion: aclaracion.trim() || null, estado:"pendiente",
    });
    setAclaracion("");
    reload();
  };

  const borrarItem = async (item) => { if (item.estado==="pendiente") { await supabase.from("pedido_items").delete().eq("id", item.id); reload(); } };
  const marcarEntregado = async (item) => { await supabase.from("pedido_items").update({ estado:"entregado" }).eq("id", item.id); reload(); };

  const cerrarMesa = async () => {
    if (!confirm("¿Cerrar la mesa? (para después pedir la cuenta)")) return;
    const total = itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad, 0);
    await supabase.from("pedidos").update({ estado:"cerrada", total, cerrado_at:new Date().toISOString() }).eq("id", pedidoSel.id);
    await supabase.from("mesas").update({ estado:"libre", mozo_id:null, mozo_nombre:null }).eq("id", mesaSel.id);
    setMesaAbierta(null);
    reload();
  };

  const categorias = [...new Set(menu.filter(m=>m.activo).map(m=>m.categoria))];

  if (mesaSel) {
    const totalMesa = itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad, 0);
    return (
      <div>
        <TopBar titulo={`Mesa ${mesaSel.numero}`} identidad={identidad} cambiarIdentidad={cambiarIdentidad} logout={logout} />
        <div style={{ padding:18, maxWidth:640, margin:"0 auto" }}>
          <button className="btn-ghost" style={{ marginBottom:14 }} onClick={()=>setMesaAbierta(null)}>← Volver a mesas</button>

          <div className="card" style={{ padding:16, marginBottom:16 }}>
            <div style={{ fontSize:12, fontWeight:800, color:"var(--ink-soft)", marginBottom:10, letterSpacing:".03em" }}>PEDIDO ACTUAL</div>
            {itemsMesa.length===0 && <div style={{ fontSize:13.5, color:"var(--ink-soft)" }}>Todavía no agregaste nada.</div>}
            {itemsMesa.map(i => (
              <div key={i.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderTop:"1px solid var(--line)" }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontWeight:700, fontSize:13.5 }}>{i.nombre}{i.aclaracion && <span style={{ fontWeight:500, color:"var(--ink-soft)" }}> — {i.aclaracion}</span>}</div>
                  <div style={{ fontSize:11, color:"var(--ink-soft)" }}>{money(i.precio)} · {hora(i.created_at)}</div>
                </div>
                <span className="tag" style={{
                  background: i.estado==="pendiente" ? "var(--warn-tint)" : i.estado==="listo" ? "var(--accent-tint)" : "var(--surface-2)",
                  color: i.estado==="pendiente" ? "var(--warn)" : i.estado==="listo" ? "var(--accent)" : "var(--ink-soft)"
                }}>{i.estado==="pendiente" ? "En cocina" : i.estado==="listo" ? "¡Listo!" : "Entregado"}</span>
                {i.estado==="listo" && <button className="btn-primary" style={{ padding:"6px 10px", fontSize:11.5 }} onClick={()=>marcarEntregado(i)}>Entregar</button>}
                {i.estado==="pendiente" && <button className="btn-ghost" style={{ padding:"6px 8px", fontSize:11.5 }} onClick={()=>borrarItem(i)}>✕</button>}
              </div>
            ))}
            {itemsMesa.length>0 && <div style={{ textAlign:"right", fontWeight:800, marginTop:10, fontFamily:"'Fraunces',serif", fontSize:17, color:"var(--primary-dark)" }}>Total: {money(totalMesa)}</div>}
          </div>

          <div className="card" style={{ padding:16, marginBottom:16 }}>
            <input className="field" placeholder="Aclaración (opcional): sin sal, para llevar…" value={aclaracion} onChange={e=>setAclaracion(e.target.value)} style={{ marginBottom:14 }} />
            {categorias.map(cat => (
              <div key={cat} style={{ marginBottom:14 }}>
                <div style={{ fontSize:11.5, fontWeight:800, color:"var(--primary)", marginBottom:8, letterSpacing:".03em" }}>{cat.toUpperCase()}</div>
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(130px,1fr))", gap:8 }}>
                  {menu.filter(m=>m.categoria===cat && m.activo).map(m => (
                    <button key={m.id} className="btn-ghost" style={{ padding:"12px 8px", textAlign:"center", fontWeight:700 }} onClick={()=>agregarItem(m)}>
                      {m.nombre}<div style={{ fontWeight:600, fontSize:11.5, color:"var(--ink-soft)", marginTop:3 }}>{money(m.precio)}</div>
                    </button>
                  ))}
                </div>
              </div>
            ))}
            {menu.length===0 && <div style={{ fontSize:13, color:"var(--ink-soft)" }}>El dueño todavía no cargó el menú.</div>}
          </div>

          <button className="btn-primary" style={{ width:"100%", padding:14 }} onClick={cerrarMesa} disabled={itemsMesa.length===0}>Cerrar mesa y pedir la cuenta</button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <TopBar titulo="Mis mesas" identidad={identidad} cambiarIdentidad={cambiarIdentidad} logout={logout} />
      <div style={{ padding:18, maxWidth:640, margin:"0 auto" }}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(100px,1fr))", gap:12 }}>
          {misMesas.map(m => (
            <button key={m.id} className="mesabtn" style={{ borderColor: m.estado==="ocupada" ? "var(--primary)" : "var(--line)", background: m.estado==="ocupada" ? "var(--primary-tint)" : "var(--surface)", color: m.estado==="ocupada" ? "var(--primary-dark)" : "var(--ink)" }} onClick={()=>abrirMesa(m)}>
              Mesa {m.numero}
              <span className="tag" style={{ background: m.estado==="ocupada"?"var(--primary)":"var(--accent-tint)", color: m.estado==="ocupada"?"white":"var(--accent)" }}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
            </button>
          ))}
        </div>
        {mesas.length===0 && <div style={{ color:"var(--ink-soft)", fontSize:14, marginTop:20 }}>El dueño todavía no cargó las mesas del local.</div>}
      </div>
    </div>
  );
}

// ---------------- VISTA COCINA ----------------
function VistaCocina({ identidad, items, cambiarIdentidad, logout, reload }) {
  const pendientesYListos = items.filter(i => i.estado==="pendiente" || i.estado==="listo").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const porMesa = {};
  pendientesYListos.forEach(i => { (porMesa[i.mesa_numero] = porMesa[i.mesa_numero] || []).push(i); });

  const marcarListo = async (item) => { await supabase.from("pedido_items").update({ estado:"listo" }).eq("id", item.id); reload(); };

  return (
    <div>
      <TopBar titulo="👨‍🍳 Cocina" identidad={identidad} cambiarIdentidad={cambiarIdentidad} logout={logout} />
      <div style={{ padding:18 }}>
        {Object.keys(porMesa).length===0 && <div style={{ color:"var(--ink-soft)", fontSize:15, textAlign:"center", marginTop:60 }}>No hay pedidos pendientes. 🎉</div>}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(260px,1fr))", gap:16 }}>
          {Object.entries(porMesa).map(([mesa, its]) => (
            <div key={mesa} className="card" style={{ padding:16 }}>
              <div style={{ fontFamily:"'Fraunces',serif", fontWeight:700, fontSize:17, color:"var(--primary-dark)", marginBottom:10 }}>Mesa {mesa}</div>
              {its.map(i => (
                <div key={i.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 0", borderTop:"1px solid var(--line)" }}>
                  <div style={{ flex:1 }}>
                    <div style={{ fontWeight:700, fontSize:14.5 }}>{i.nombre}</div>
                    {i.aclaracion && <div style={{ fontSize:12, color:"var(--primary)", fontWeight:700 }}>⚠ {i.aclaracion}</div>}
                    <div style={{ fontSize:11, color:"var(--ink-soft)" }}>{hora(i.created_at)}</div>
                  </div>
                  {i.estado==="pendiente" ? (
                    <button className="btn-primary" style={{ fontSize:12, padding:"7px 12px" }} onClick={()=>marcarListo(i)}>Marcar listo</button>
                  ) : (
                    <span className="tag" style={{ background:"var(--accent-tint)", color:"var(--accent)" }}>Listo, esperando mozo</span>
                  )}
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---------------- VISTA DUEÑO ----------------
function VistaDueño({ userId, identidad, empleados, mesas, menu, pedidos, items, reload, cambiarIdentidad, logout }) {
  const [tab, setTab] = useState("mesas");
  const NAV = [
    { id:"mesas", label:"Mesas", icon:"🍽️" },
    { id:"empleados", label:"Empleados", icon:"👥" },
    { id:"menu", label:"Menú", icon:"📋" },
  ];

  const totalHoy = pedidos.reduce((s,p) => {
    const its = items.filter(i=>i.pedido_id===p.id);
    return s + its.reduce((s2,i)=>s2+Number(i.precio)*i.cantidad, 0);
  }, 0);

  return (
    <div className="app-shell" style={{ display:"flex", minHeight:"100vh" }}>
      <aside className="sidebar" style={{ width:220, flexShrink:0, borderRight:"1px solid var(--line)", padding:"22px 14px", display:"flex", flexDirection:"column", gap:18, background:"var(--surface)" }}>
        <div style={{ fontFamily:"'Fraunces',serif", fontWeight:700, fontSize:17, color:"var(--primary-dark)", padding:"0 8px 14px", borderBottom:"1px solid var(--line)" }}>MODULA <span style={{color:"var(--primary)"}}>Gastro</span></div>
        <nav style={{ display:"flex", flexDirection:"column", gap:4 }}>
          {NAV.map(n => (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{ display:"flex", alignItems:"center", gap:10, width:"100%", padding:"11px 14px", borderRadius:10, border:"none", background: tab===n.id?"var(--primary)":"transparent", color: tab===n.id?"white":"var(--ink-soft)", fontSize:14, fontWeight:700, textAlign:"left" }}>
              {n.icon} {n.label}
            </button>
          ))}
        </nav>
        <div style={{ marginTop:"auto", display:"flex", flexDirection:"column", gap:8 }}>
          <div style={{ fontSize:12, color:"var(--ink-soft)" }}>{identidad.nombre}</div>
          <button className="btn-ghost" onClick={cambiarIdentidad}>Cambiar usuario</button>
          <button className="btn-ghost" onClick={logout}>Cerrar sesión</button>
        </div>
      </aside>
      <main style={{ flex:1, padding:"26px 32px", maxWidth:1000 }}>
        <div className="card" style={{ padding:"16px 20px", marginBottom:22, background:"var(--primary-tint)", border:"none" }}>
          <div style={{ fontSize:11.5, fontWeight:800, color:"var(--primary-dark)" }}>VENTA ACUMULADA HOY (mesas abiertas + cerradas)</div>
          <div style={{ fontFamily:"'Fraunces',serif", fontSize:26, fontWeight:700, color:"var(--primary-dark)" }}>{money(totalHoy)}</div>
        </div>
        {tab==="mesas" && <PanelMesas userId={userId} mesas={mesas} pedidos={pedidos} items={items} reload={reload} />}
        {tab==="empleados" && <PanelEmpleados userId={userId} empleados={empleados} reload={reload} />}
        {tab==="menu" && <PanelMenu userId={userId} menu={menu} reload={reload} />}
      </main>
    </div>
  );
}

function PanelMesas({ userId, mesas, pedidos, items, reload }) {
  const [cantidad, setCantidad] = useState("");
  const crearMesas = async () => {
    const n = parseInt(cantidad); if (!n || n<1) return;
    const existentes = mesas.length;
    const nuevas = Array.from({length:n}, (_,i) => ({ user_id:userId, numero: existentes+i+1 }));
    await supabase.from("mesas").insert(nuevas);
    setCantidad(""); reload();
  };
  return (
    <div>
      <div style={{ display:"flex", gap:8, marginBottom:18, alignItems:"flex-end" }}>
        <div><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Agregar mesas nuevas</label><input className="field" type="number" style={{ width:100 }} value={cantidad} onChange={e=>setCantidad(e.target.value)} placeholder="cant." /></div>
        <button className="btn-primary" onClick={crearMesas}>Agregar</button>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(140px,1fr))", gap:12 }}>
        {mesas.map(m => {
          const pedido = pedidos.find(p=>p.mesa_id===m.id);
          const its = pedido ? items.filter(i=>i.pedido_id===pedido.id) : [];
          const total = its.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
          return (
            <div key={m.id} className="card" style={{ padding:14, borderColor: m.estado==="ocupada" ? "var(--primary)" : "var(--line)" }}>
              <div style={{ fontWeight:800, fontSize:15 }}>Mesa {m.numero}</div>
              <span className="tag" style={{ background: m.estado==="ocupada"?"var(--primary-tint)":"var(--accent-tint)", color: m.estado==="ocupada"?"var(--primary-dark)":"var(--accent)" }}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
              {m.estado==="ocupada" && <div style={{ fontSize:12, color:"var(--ink-soft)", marginTop:8 }}>Mozo: {m.mozo_nombre}<br/>Total: {money(total)}</div>}
            </div>
          );
        })}
        {mesas.length===0 && <div style={{ color:"var(--ink-soft)", fontSize:14 }}>Todavía no cargaste mesas.</div>}
      </div>
    </div>
  );
}

function PanelEmpleados({ userId, empleados, reload }) {
  const [form, setForm] = useState({ nombre:"", rol:"mozo", pin:"" });
  const [open, setOpen] = useState(false);
  const add = async () => {
    if (!form.nombre || !form.pin) return;
    await supabase.from("empleados").insert({ ...form, user_id:userId });
    setForm({ nombre:"", rol:"mozo", pin:"" }); setOpen(false); reload();
  };
  const toggle = async (e) => { await supabase.from("empleados").update({ activo: !e.activo }).eq("id", e.id); reload(); };
  const del = async (id) => { if(confirm("¿Eliminar este empleado?")) { await supabase.from("empleados").delete().eq("id", id); reload(); } };

  return (
    <div>
      <button className="btn-primary" style={{ marginBottom:16 }} onClick={()=>setOpen(!open)}>➕ Nuevo empleado</button>
      {open && (
        <div className="card" style={{ padding:16, marginBottom:16, display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end" }}>
          <div style={{ flex:"1 1 160px" }}><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Nombre</label><input className="field" value={form.nombre} onChange={e=>setForm({...form, nombre:e.target.value})} /></div>
          <div><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Rol</label><select className="field" value={form.rol} onChange={e=>setForm({...form, rol:e.target.value})}><option value="mozo">Mozo</option><option value="cocina">Cocina</option></select></div>
          <div><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>PIN</label><input className="field" style={{ width:100 }} value={form.pin} onChange={e=>setForm({...form, pin:e.target.value.replace(/\D/g,"")})} placeholder="1234" /></div>
          <button className="btn-primary" onClick={add}>Guardar</button>
        </div>
      )}
      <div className="card" style={{ overflow:"hidden" }}>
        {empleados.map((e,i) => (
          <div key={e.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 16px", borderTop: i?"1px solid var(--line)":"none" }}>
            <div style={{ flex:1 }}><div style={{ fontWeight:700 }}>{e.nombre}</div><div style={{ fontSize:11.5, color:"var(--ink-soft)" }}>{e.rol==="mozo"?"Mozo":"Cocina"} · PIN {e.pin}</div></div>
            <span className="tag" style={{ background: e.activo?"var(--accent-tint)":"var(--surface-2)", color: e.activo?"var(--accent)":"var(--ink-soft)" }}>{e.activo?"Activo":"Inactivo"}</span>
            <button className="btn-ghost" style={{ fontSize:11.5, padding:"5px 10px" }} onClick={()=>toggle(e)}>{e.activo?"Desactivar":"Activar"}</button>
            <button className="btn-ghost" style={{ fontSize:11.5, padding:"5px 8px" }} onClick={()=>del(e.id)}>🗑</button>
          </div>
        ))}
        {empleados.length===0 && <div style={{ padding:20, color:"var(--ink-soft)", fontSize:14 }}>Todavía no cargaste empleados.</div>}
      </div>
    </div>
  );
}

function PanelMenu({ userId, menu, reload }) {
  const [form, setForm] = useState({ nombre:"", categoria:"", precio:"" });
  const [open, setOpen] = useState(false);
  const add = async () => {
    if (!form.nombre || !form.categoria) return;
    await supabase.from("menu_items").insert({ ...form, precio: Number(form.precio)||0, user_id:userId });
    setForm({ nombre:"", categoria:"", precio:"" }); setOpen(false); reload();
  };
  const toggle = async (m) => { await supabase.from("menu_items").update({ activo: !m.activo }).eq("id", m.id); reload(); };
  const del = async (id) => { if(confirm("¿Eliminar este ítem del menú?")) { await supabase.from("menu_items").delete().eq("id", id); reload(); } };
  const categorias = [...new Set(menu.map(m=>m.categoria))];

  return (
    <div>
      <button className="btn-primary" style={{ marginBottom:16 }} onClick={()=>setOpen(!open)}>➕ Nuevo ítem del menú</button>
      {open && (
        <div className="card" style={{ padding:16, marginBottom:16, display:"flex", gap:10, flexWrap:"wrap", alignItems:"flex-end" }}>
          <div style={{ flex:"1 1 160px" }}><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Nombre</label><input className="field" value={form.nombre} onChange={e=>setForm({...form, nombre:e.target.value})} placeholder="Milanesa napolitana" /></div>
          <div><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Categoría</label><input className="field" value={form.categoria} onChange={e=>setForm({...form, categoria:e.target.value})} placeholder="Principales" /></div>
          <div><label style={{ fontSize:12, fontWeight:700, color:"var(--ink-soft)" }}>Precio</label><input className="field" style={{ width:110 }} value={form.precio} onChange={e=>setForm({...form, precio:e.target.value.replace(/\D/g,"")})} placeholder="8500" /></div>
          <button className="btn-primary" onClick={add}>Guardar</button>
        </div>
      )}
      {categorias.map(cat => (
        <div key={cat} style={{ marginBottom:18 }}>
          <div style={{ fontSize:12, fontWeight:800, color:"var(--primary)", marginBottom:8 }}>{cat.toUpperCase()}</div>
          <div className="card" style={{ overflow:"hidden" }}>
            {menu.filter(m=>m.categoria===cat).map((m,i) => (
              <div key={m.id} style={{ display:"flex", alignItems:"center", gap:12, padding:"11px 16px", borderTop: i?"1px solid var(--line)":"none" }}>
                <div style={{ flex:1, fontWeight:700 }}>{m.nombre}</div>
                <div style={{ fontWeight:700, color:"var(--primary-dark)" }}>{money(m.precio)}</div>
                <span className="tag" style={{ background: m.activo?"var(--accent-tint)":"var(--surface-2)", color: m.activo?"var(--accent)":"var(--ink-soft)" }}>{m.activo?"Activo":"Pausado"}</span>
                <button className="btn-ghost" style={{ fontSize:11.5, padding:"5px 10px" }} onClick={()=>toggle(m)}>{m.activo?"Pausar":"Activar"}</button>
                <button className="btn-ghost" style={{ fontSize:11.5, padding:"5px 8px" }} onClick={()=>del(m.id)}>🗑</button>
              </div>
            ))}
          </div>
        </div>
      ))}
      {menu.length===0 && <div style={{ color:"var(--ink-soft)", fontSize:14 }}>Todavía no cargaste el menú.</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
