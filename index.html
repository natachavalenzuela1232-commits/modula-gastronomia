<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MODULA Gastronomía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg:#FAF6F1;--surface:#FFF;--surface-2:#FBF3EC;
  --ink:#2B211B;--ink-soft:#75655A;
  --primary:#C1440E;--primary-dark:#8C2F08;--primary-tint:#FBE7DA;
  --accent:#2F7E68;--accent-tint:#E1F0EA;
  --warn:#C79A2E;--warn-tint:#FBF0D8;
  --line:#E2D2BF;--shadow:0 1px 2px rgba(43,33,27,.05),0 4px 16px rgba(43,33,27,.07);
}
*{box-sizing:border-box}
html,body,#root{margin:0;padding:0;min-height:100%;background:var(--bg)}
body{font-family:'Manrope',sans-serif;color:var(--ink);line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.field{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;color:var(--ink)}
.field:focus{outline:2px solid var(--primary);outline-offset:1px}
.bp{background:var(--primary);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;justify-content:center}
.bp:hover{background:var(--primary-dark)}
.bp:disabled{opacity:.55}
.bg{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:8px 12px;border-radius:9px;font-weight:600;font-size:14.5px}
.bg:hover{background:var(--surface-2)}
.tag{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.02em}
.mesabtn{border-radius:14px;padding:18px 10px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
@media(max-width:760px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%!important;flex-direction:row!important;overflow-x:auto;border-right:none!important;border-bottom:1px solid var(--line);padding:10px!important}
  .sidebar nav{flex-direction:row!important}
  .sidebar .tip{display:none}
  main{padding:16px!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
window.addEventListener("error", function(e){
  document.getElementById("root").innerHTML =
    '<div style="padding:24px;font-family:monospace;font-size:13px;color:#900;white-space:pre-wrap;background:#fff0f0;min-height:100vh;">'
    + '⚠️ ERROR EN EL PROGRAMA\n\n'
    + 'Mensaje: ' + e.message + '\n'
    + 'Línea: ' + e.lineno + '\n'
    + 'Columna: ' + e.colno
    + '</div>';
});
</script>
<script type="text/babel">
const{useState,useEffect,useRef}=React;
const SUPABASE_URL="https://zibuxcbidjymrlvdsgse.supabase.co";
const SUPABASE_KEY="sb_publishable_9Wcf3GqvO8WQYQqAm5oGIQ_troL-Oav";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const money=n=>`$${Number(n||0).toLocaleString("es-AR")}`;
const hora=iso=>new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const hoy=()=>new Date().toISOString().slice(0,10);

function Login(){
  const[mode,setMode]=useState("signin");
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState("");
  const submit=async()=>{
    setMsg("");setLoading(true);
    try{
      if(mode==="signin"){const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;}
      else{const{error}=await sb.auth.signUp({email,password:pw});if(error)throw error;setMsg("¡Cuenta creada! Ya podés iniciar sesión.");setMode("signin");}
    }catch(e){setMsg(e.message||"Error, probá de nuevo.");}
    finally{setLoading(false);}
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div className="card" style={{width:"100%",maxWidth:380,padding:32}}>
        <div style={{textAlign:"center",marginBottom:26}}>
          <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:24,color:"var(--primary-dark)"}}>MODULA <span style={{color:"var(--primary)"}}>Gastronomía</span></div>
          <div style={{fontSize:15,color:"var(--ink-soft)",marginTop:4}}>{mode==="signin"?"Iniciá sesión con la cuenta de tu negocio":"Creá la cuenta de tu negocio"}</div>
        </div>
        <div style={{marginBottom:12}}><label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>Email</label><input className="field" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tunegocio@email.com"/></div>
        <div style={{marginBottom:18}}><label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>Contraseña</label><input className="field" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {msg&&<div style={{fontSize:15,color:"var(--primary)",marginBottom:14,lineHeight:1.4}}>{msg}</div>}
        <button className="bp" style={{width:"100%",padding:12}} onClick={submit} disabled={loading||!email||!pw}>{loading?"Un momento…":mode==="signin"?"Iniciar sesión":"Crear cuenta"}</button>
        <div style={{textAlign:"center",marginTop:16,fontSize:14}}>
          {mode==="signin"?<span style={{color:"var(--ink-soft)"}}>¿Primera vez? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");setMsg("")}} style={{color:"var(--primary)",fontWeight:700}}>Creá la cuenta</a></span>:<span style={{color:"var(--ink-soft)"}}>¿Ya tenés? <a href="#" onClick={e=>{e.preventDefault();setMode("signin");setMsg("")}} style={{color:"var(--primary)",fontWeight:700}}>Iniciá sesión</a></span>}
        </div>
      </div>
    </div>
  );
}

function SelectorIdentidad({empleados,onElegir}){
  const[eli,setEli]=useState(null);
  const[pin,setPin]=useState("");
  const[err,setErr]=useState("");
  const confirmar=()=>{if(eli.pin!==pin.trim()){setErr("PIN incorrecto.");return;}onElegir({rol:eli.rol,id:eli.id,nombre:eli.nombre});};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div className="card" style={{width:"100%",maxWidth:420,padding:32}}>
        {!eli?(
          <React.Fragment>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:20,color:"var(--primary-dark)",textAlign:"center",marginBottom:22}}>¿Quién sos?</div>
            <button className="bp" style={{width:"100%",padding:14,marginBottom:10,fontSize:15}} onClick={()=>onElegir({rol:"dueño",id:null,nombre:"Dueño/a"})}>👑 Soy el dueño/a</button>
            {empleados.filter(e=>e.activo).map(e=>(
              <button key={e.id} className="bg" style={{width:"100%",padding:14,marginBottom:8,fontSize:14.5,textAlign:"left",display:"flex",alignItems:"center",gap:10}} onClick={()=>{setEli(e);setPin("");setErr("");}}>
                {e.rol==="mozo"?"🧑‍🍳":"👨‍🍳"} {e.nombre}<span style={{marginLeft:"auto",color:"var(--ink-soft)",fontSize:14,fontWeight:700}}>{e.rol==="mozo"?"MOZO":"COCINA"}</span>
              </button>
            ))}
            {!empleados.filter(e=>e.activo).length&&<div style={{fontSize:15,color:"var(--ink-soft)",textAlign:"center",marginTop:8}}>El dueño puede agregar empleados desde su panel.</div>}
          </React.Fragment>
        ):(
          <React.Fragment>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:18,color:"var(--primary-dark)",textAlign:"center",marginBottom:16}}>Hola, {eli.nombre} — ingresá tu PIN</div>
            <input className="field" type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN" style={{textAlign:"center",fontSize:20,letterSpacing:4,marginBottom:12}} onKeyDown={e=>e.key==="Enter"&&confirmar()} autoFocus/>
            {err&&<div style={{color:"var(--primary)",fontSize:15,textAlign:"center",marginBottom:10}}>{err}</div>}
            <button className="bp" style={{width:"100%",padding:12,marginBottom:8}} onClick={confirmar}>Entrar</button>
            <button className="bg" style={{width:"100%"}} onClick={()=>setEli(null)}>Volver</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function App(){
  const[session,setSession]=useState(undefined);
  const[identidad,setIdentidad]=useState(null);
  const[data,setData]=useState({empleados:[],mesas:[],menu:[],pedidos:[],items:[],insumos:[],recetas:[],cierres:[],compras:[]});
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:l}=sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>l.subscription.unsubscribe();
  },[]);

  const loadAll=async()=>{
    const[e,m,mn,p,it,ins,rec,ci,cp]=await Promise.all([
      sb.from("empleados").select("*").order("created_at"),
      sb.from("mesas").select("*").order("numero"),
      sb.from("menu_items").select("*").order("categoria"),
      sb.from("pedidos").select("*").eq("estado","abierta"),
      sb.from("pedido_items").select("*").order("created_at"),
      sb.from("insumos").select("*").order("nombre"),
      sb.from("recetas").select("*"),
      sb.from("cierres_caja").select("*").order("fecha",{ascending:false}).limit(30),
      sb.from("compras").select("*").order("created_at",{ascending:false}).limit(100),
    ]);
    setData({
      empleados:e.data||[],mesas:m.data||[],menu:mn.data||[],
      pedidos:p.data||[],items:it.data||[],insumos:ins.data||[],
      recetas:rec.data||[],cierres:ci.data||[],compras:cp.data||[],
    });
    setLoading(false);
  };

  useEffect(()=>{
    if(!session)return;
    loadAll();
    const saved=localStorage.getItem("modula_id");
    if(saved)try{setIdentidad(JSON.parse(saved));}catch{}
    const canal=sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"pedido_items"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"mesas"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"insumos"},()=>loadAll()).subscribe();
    return()=>sb.removeChannel(canal);
  },[session]);

  const elegir=id=>{setIdentidad(id);localStorage.setItem("modula_id",JSON.stringify(id));};
  const cambiar=()=>{localStorage.removeItem("modula_id");setIdentidad(null);};
  const logout=async()=>{localStorage.removeItem("modula_id");await sb.auth.signOut();};

  if(session===undefined)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-soft)"}}>Cargando…</div>;
  if(!session)return<Login/>;
  if(loading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-soft)"}}>Cargando el negocio…</div>;
  if(!identidad)return<SelectorIdentidad empleados={data.empleados} onElegir={elegir}/>;

  const props={userId:session.user.id,identidad,...data,reload:loadAll,cambiar,logout};
  if(identidad.rol==="dueño")return<VistaDueño {...props}/>;
  if(identidad.rol==="mozo")return<VistaMozo {...props}/>;
  if(identidad.rol==="cocina")return<VistaCocina {...props}/>;
  return null;
}

function TopBar({titulo,identidad,cambiar,logout}){
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px",background:"var(--surface)",borderBottom:"1px solid var(--line)"}}>
      <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)"}}>{titulo}</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:15,color:"var(--ink-soft)",fontWeight:600}}>{identidad.nombre}</span>
        <button className="bg" style={{padding:"6px 10px",fontSize:14.5}} onClick={cambiar}>Cambiar</button>
        <button className="bg" style={{padding:"6px 10px",fontSize:14.5}} onClick={logout}>Salir</button>
      </div>
    </div>
  );
}

// ---- VISTA MOZO ----
function VistaMozo({userId,identidad,mesas,menu,pedidos,items,reload,cambiar,logout}){
  const[mesaId,setMesaId]=useState(()=>localStorage.getItem("modula_mesa")||null);
  const[acl,setAcl]=useState("");
  const[pidiendoPago,setPidiendoPago]=useState(false);
  const[cobrosHoy,setCobrosHoy]=useState([]);
  const[cobroAbierto,setCobroAbierto]=useState(null);
  const cargarCobrosHoy=async()=>{
    const{data}=await sb.from("pedidos").select("*").eq("mozo_id",identidad.id).eq("estado","cerrada").order("cerrado_at",{ascending:false}).limit(100);
    const hoyStr=hoy();
    setCobrosHoy((data||[]).filter(p=>p.cerrado_at&&p.cerrado_at.slice(0,10)===hoyStr));
  };
  useEffect(()=>{cargarCobrosHoy();},[]);
  useEffect(()=>{
    if(mesaId)localStorage.setItem("modula_mesa",mesaId);
    else localStorage.removeItem("modula_mesa");
  },[mesaId]);
  useEffect(()=>{
    if(mesaId&&mesas.length){
      const m=mesas.find(mm=>mm.id===mesaId);
      if(!m||m.estado!=="ocupada"||m.mozo_id!==identidad.id)setMesaId(null);
    }
  },[mesas]);
  const misMesas=mesas.filter(m=>m.estado==="libre"||m.mozo_id===identidad.id);
  const mesaSel=mesaId?mesas.find(m=>m.id===mesaId):null;
  const pedSel=mesaSel?pedidos.find(p=>p.mesa_id===mesaSel.id):null;
  const itemsMesa=pedSel?items.filter(i=>i.pedido_id===pedSel.id):[];
  const abrirMesa=async m=>{
    if(m.estado==="libre"){
      await sb.from("mesas").update({estado:"ocupada",mozo_id:identidad.id,mozo_nombre:identidad.nombre}).eq("id",m.id);
      await sb.from("pedidos").insert({user_id:userId,mesa_id:m.id,mesa_numero:m.numero,mozo_id:identidad.id,mozo_nombre:identidad.nombre,estado:"abierta"});
      await reload();
    }
    setMesaId(m.id);
  };
  const agregarItem=async mi=>{
    if(!pedSel)return;
    await sb.from("pedido_items").insert({user_id:userId,pedido_id:pedSel.id,mesa_numero:mesaSel.numero,menu_item_id:mi.id,nombre:mi.nombre,precio:mi.precio,aclaracion:acl.trim()||null,estado:mi.va_a_cocina?"pendiente":"entregado"});
    setAcl("");reload();
  };
  const borrarItem=async i=>{if(i.estado==="pendiente"){await sb.from("pedido_items").delete().eq("id",i.id);reload();}};
  const marcarEntregado=async i=>{await sb.from("pedido_items").update({estado:"entregado"}).eq("id",i.id);reload();};
  const cerrarMesa=async metodo=>{
    const total=itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
    await sb.from("pedidos").update({estado:"cerrada",total,metodo_pago:metodo,cerrado_at:new Date().toISOString()}).eq("id",pedSel.id);
    await sb.from("mesas").update({estado:"libre",mozo_id:null,mozo_nombre:null}).eq("id",mesaSel.id);
    setPidiendoPago(false);setMesaId(null);reload();cargarCobrosHoy();
  };
  const cats=[...new Set(menu.filter(m=>m.activo).map(m=>m.categoria))];
  if(mesaSel){
    const total=itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
    return(
      <div>
        <TopBar titulo={`Mesa ${mesaSel.numero}`} identidad={identidad} cambiar={cambiar} logout={logout}/>
        <div style={{padding:18,maxWidth:640,margin:"0 auto"}}>
          <button className="bg" style={{marginBottom:14}} onClick={()=>setMesaId(null)}>← Volver</button>
          <div className="card" style={{padding:16,marginBottom:16}}>
            <div style={{fontSize:29,fontWeight:800,color:"var(--ink-soft)",marginBottom:10}}>PEDIDO ACTUAL</div>
            {!itemsMesa.length&&<div style={{fontSize:14.5,color:"var(--ink-soft)"}}>Todavía no agregaste nada.</div>}
            {itemsMesa.map(i=>(
              <div key={i.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderTop:"1px solid var(--line)"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14.5}}>{i.nombre}{i.aclaracion&&<span style={{fontWeight:500,color:"var(--ink-soft)"}}> — {i.aclaracion}</span>}</div>
                  <div style={{fontSize:13.5,color:"var(--ink-soft)"}}>{money(i.precio)} · {hora(i.created_at)}</div>
                </div>
                <span className="tag" style={{background:i.estado==="pendiente"?"var(--warn-tint)":i.estado==="listo"?"var(--accent-tint)":"var(--surface-2)",color:i.estado==="pendiente"?"var(--warn)":i.estado==="listo"?"var(--accent)":"var(--ink-soft)"}}>{i.estado==="pendiente"?"En cocina":i.estado==="listo"?"¡Listo!":"Entregado"}</span>
                {i.estado==="listo"&&<button className="bp" style={{padding:"6px 10px",fontSize:14}} onClick={()=>marcarEntregado(i)}>Entregar</button>}
                {i.estado==="pendiente"&&<button className="bg" style={{padding:"6px 8px",fontSize:14}} onClick={()=>borrarItem(i)}>✕</button>}
              </div>
            ))}
            {itemsMesa.length>0&&<div style={{textAlign:"right",fontWeight:800,marginTop:10,fontFamily:"'Fraunces',serif",fontSize:17,color:"var(--primary-dark)"}}>Total: {money(total)}</div>}
          </div>
          <div className="card" style={{padding:16,marginBottom:16}}>
            <input className="field" placeholder="Aclaración opcional: sin sal, para llevar…" value={acl} onChange={e=>setAcl(e.target.value)} style={{marginBottom:14}}/>
            {cats.map(cat=>(
              <div key={cat} style={{marginBottom:14}}>
                <div style={{fontSize:28,fontWeight:800,color:"var(--primary)",marginBottom:8}}>{cat.toUpperCase()}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
                  {menu.filter(m=>m.categoria===cat&&m.activo).map(m=>(
                    <button key={m.id} className="bg" style={{padding:"12px 8px",textAlign:"center",fontWeight:700}} onClick={()=>agregarItem(m)}>
                      {m.nombre}<div style={{fontWeight:600,fontSize:14,color:"var(--ink-soft)",marginTop:3}}>{money(m.precio)}</div>
                    </button>
                  ))}
                </div>
              </div>
            ))}
            {!menu.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>El dueño todavía no cargó el menú.</div>}
          </div>
          {!pidiendoPago?(
            <button className="bp" style={{width:"100%",padding:14}} onClick={()=>setPidiendoPago(true)} disabled={!itemsMesa.length}>Cerrar mesa y pedir la cuenta</button>
          ):(
            <div className="card" style={{padding:16}}>
              <div style={{fontWeight:700,marginBottom:12,textAlign:"center"}}>¿Cómo pagó el cliente?</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button className="bp" style={{flex:"1 1 100px"}} onClick={()=>cerrarMesa("efectivo")}>💵 Efectivo</button>
                <button className="bp" style={{flex:"1 1 100px"}} onClick={()=>cerrarMesa("tarjeta")}>💳 Tarjeta</button>
                <button className="bp" style={{flex:"1 1 100px"}} onClick={()=>cerrarMesa("transferencia")}>🏦 Transf.</button>                  
      </div>
              <button className="bg" style={{width:"100%",marginTop:10}} onClick={()=>setPidiendoPago(false)}>Cancelar</button>
            </div>
          )}
        </div>
      </div>
    );
  }
  return(
    <div>
      <TopBar titulo="Mis mesas" identidad={identidad} cambiar={cambiar} logout={logout}/>
      <div style={{padding:18,maxWidth:640,margin:"0 auto"}}>
        {cobrosHoy.length>0&&(()=>{
          const ef=cobrosHoy.filter(p=>p.metodo_pago==="efectivo").reduce((s,p)=>s+Number(p.total),0);
          const tar=cobrosHoy.filter(p=>p.metodo_pago==="tarjeta").reduce((s,p)=>s+Number(p.total),0);
          const tr=cobrosHoy.filter(p=>p.metodo_pago==="transferencia").reduce((s,p)=>s+Number(p.total),0);
          return(
            <div className="card" style={{padding:16,marginBottom:16,background:"var(--primary-tint)",border:"none"}}>
              <div style={{fontSize:14,fontWeight:800,color:"var(--primary-dark)",marginBottom:6}}>COBRADO HOY ({cobrosHoy.length} mesa{cobrosHoy.length!==1?"s":""})</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:24,fontWeight:700,color:"var(--primary-dark)",marginBottom:8}}>{money(ef+tar+tr)}</div>
              <div style={{fontSize:15,color:"var(--primary-dark)",display:"flex",gap:14,flexWrap:"wrap"}}>
                <span>💵 Efectivo: {money(ef)}</span>
                <span>💳 Tarjeta: {money(tar)}</span>
                <span>🏦 Transf.: {money(tr)}</span>
              </div>
              <div style={{marginTop:12,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
                {[...cobrosHoy].sort((a,b)=>new Date(b.cerrado_at)-new Date(a.cerrado_at)).map(p=>{
                  const itemsP=items.filter(i=>i.pedido_id===p.id);
                  const abierto=cobroAbierto===p.id;
                  return(
                    <div key={p.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px"}}>
                      <div onClick={()=>setCobroAbierto(abierto?null:p.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:15,color:"var(--primary-dark)",cursor:"pointer"}}>
                        <span>{abierto?"▾":"▸"} Mesa {p.mesa_numero} · {p.metodo_pago==="efectivo"?"💵":p.metodo_pago==="tarjeta"?"💳":"🏦"} {hora(p.cerrado_at)}</span>
                        <span style={{fontWeight:700}}>{money(p.total)}</span>
                      </div>
                      {abierto&&<div style={{background:"rgba(255,255,255,0.5)",borderRadius:8,padding:"6px 10px",marginTop:6}}>
                        {itemsP.map(i=>(
                          <div key={i.id} style={{display:"flex",justifyContent:"space-between",fontSize:14.5,padding:"3px 0",color:"var(--ink)"}}>
                            <span>{i.nombre}{i.aclaracion&&<span style={{color:"var(--ink-soft)"}}> — {i.aclaracion}</span>}</span>
                            <span>{money(i.precio)}</span>
                          </div>
                        ))}
                        {!itemsP.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Sin detalle de items.</div>}
                      </div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:12}}>
          {misMesas.map(m=>{
            const pedM=pedidos.find(p=>p.mesa_id===m.id);
            const tieneListo=pedM?items.some(i=>i.pedido_id===pedM.id&&i.estado==="listo"):false;
            return(
            <button key={m.id} className="mesabtn" style={{borderColor:tieneListo?"var(--accent)":m.estado==="ocupada"?"var(--primary)":"var(--line)",background:tieneListo?"var(--accent-tint)":m.estado==="ocupada"?"var(--primary-tint)":"var(--surface)",color:m.estado==="ocupada"?"var(--primary-dark)":"var(--ink)"}} onClick={()=>abrirMesa(m)}>
              Mesa {m.numero}
              <span className="tag" style={{background:m.estado==="ocupada"?"var(--primary)":"var(--accent-tint)",color:m.estado==="ocupada"?"white":"var(--accent)"}}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
              {tieneListo&&<span className="tag" style={{background:"var(--accent)",color:"white"}}>🔔 Listo para retirar</span>}
            </button>
          );})}
        </div>
        {!mesas.length&&<div style={{color:"var(--ink-soft)",fontSize:15,marginTop:20}}>El dueño todavía no cargó las mesas.</div>}
      </div>
    </div>
  );
}

function VistaCocina({identidad,items,cambiar,logout,reload}){

  const porMesa={};pend.forEach(i=>{(porMesa[i.mesa_numero]=porMesa[i.mesa_numero]||[]).push(i);});

                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14.5}}>{i.nombre}</div>
                    {i.aclaracion&&<div style={{fontSize:14.5,color:"var(--primary)",fontWeight:700}}>⚠ {i.aclaracion}</div>}
                    <div style={{fontSize:13.5,color:"var(--ink-soft)"}}>{hora(i.created_at)}</div>

// ---- VISTA DUEÑO ----
function VistaDueño({userId,identidad,empleados,mesas,menu,pedidos,items,insumos,recetas,cierres,compras,reload,cambiar,logout}){
  const[tab,setTabRaw]=useState(()=>localStorage.getItem("modula_tab")||"mesas");
  const setTab=t=>{setTabRaw(t);localStorage.setItem("modula_tab",t);};
  const NAV=[{id:"mesas",label:"Mesas",icon:"🍽️"},{id:"empleados",label:"Empleados",icon:"👥"},{id:"menu",label:"Menú",icon:"📋"},{id:"stock",label:"Stock",icon:"📦"},{id:"caja",label:"Caja",icon:"💰"}];
  const totalHoy=pedidos.reduce((s,p)=>{const its=items.filter(i=>i.pedido_id===p.id);return s+its.reduce((s2,i)=>s2+Number(i.precio)*i.cantidad,0);},0);
  const stockBajo=insumos.filter(i=>i.stock_actual<=i.stock_minimo);
  const[resumen,setResumen]=useState(null);
  const[resumenLoading,setResumenLoading]=useState(false);
  const costoItemVD=item=>{const recs=recetas.filter(r=>r.menu_item_id===item.id);return recs.reduce((s,r)=>{const ins=insumos.find(i=>i.id===r.insumo_id);return s+(ins?Number(ins.precio_compra)*Number(r.cantidad):0);},0);};
  const generarResumen=async()=>{
    setResumenLoading(true);setResumen(null);
    const cierreHoy=cierres.find(c=>c.fecha===hoy());
    const totalHoyReal=cierreHoy?cierreHoy.total_general:totalHoy;
    const mesasAtendidasReal=cierreHoy?cierreHoy.cantidad_mesas:mesas.filter(m=>m.estado==="ocupada").length;
    const itemsHoy=items.filter(i=>i.created_at&&i.created_at.slice(0,10)===hoy());
    const conteo={};
    itemsHoy.forEach(i=>{
      if(!conteo[i.nombre])conteo[i.nombre]={cantidad:0,venta:0,menu_item_id:i.menu_item_id};
      conteo[i.nombre].cantidad+=i.cantidad;
      conteo[i.nombre].venta+=Number(i.precio)*i.cantidad;
    });
    let costoTotal=0;
    const productosVendidos=Object.entries(conteo).map(([nombre,d])=>{
      const mi=menu.find(m=>m.id===d.menu_item_id);
      const costoUnit=mi?costoItemVD(mi):0;
      const costoLinea=costoUnit*d.cantidad;
      costoTotal+=costoLinea;
      return{nombre,cantidad:d.cantidad,venta:d.venta,costo:Math.round(costoLinea)};
    }).sort((a,b)=>b.venta-a.venta);
    const margen=totalHoyReal-costoTotal;
    const comprasNecesarias=stockBajo.map(i=>({nombre:i.nombre,faltante:Math.max(i.stock_minimo-i.stock_actual,0),unidad:i.unidad}));
    try{
      const res=await fetch(`${SUPABASE_URL}/functions/v1/resumen-diario`,{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`,"apikey":SUPABASE_KEY},
        body:JSON.stringify({totalHoy:totalHoyReal,mesasAtendidas:mesasAtendidasReal,productosVendidos,costoTotal:Math.round(costoTotal),margen:Math.round(margen),comprasNecesarias}),
      });
      const data=await res.json();
      setResumen(data.resumen||"No se pudo generar el resumen.");
    }catch(e){setResumen("Error de conexión al generar el resumen.");}
    finally{setResumenLoading(false);}
  };
  return(
    <div className="app-shell" style={{display:"flex",minHeight:"100vh"}}>
      <aside className="sidebar" style={{width:220,flexShrink:0,borderRight:"1px solid var(--line)",padding:"22px 14px",display:"flex",flexDirection:"column",gap:18,background:"var(--surface)"}}>
        <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)",padding:"0 8px 14px",borderBottom:"1px solid var(--line)"}}>MODULA <span style={{color:"var(--primary)"}}>Gastro</span></div>
        <nav style={{display:"flex",flexDirection:"column",gap:4}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 14px",borderRadius:10,border:"none",background:tab===n.id?"var(--primary)":"transparent",color:tab===n.id?"white":"var(--ink-soft)",fontSize:15,fontWeight:700,textAlign:"left",position:"relative"}}>
              {n.icon} {n.label}
              {n.id==="stock"&&stockBajo.length>0&&<span style={{marginLeft:"auto",background:"var(--warn)",color:"white",borderRadius:"999px",fontSize:13.5,padding:"1px 7px",fontWeight:800}}>{stockBajo.length}</span>}
            </button>
          ))}
        </nav>
        <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:8}}>
          <button className="bg" onClick={cambiar}>Cambiar usuario</button>
          <button className="bg" onClick={logout}>Cerrar sesión</button>
        </div>
      </aside>
      <main style={{flex:1,padding:"26px 32px",maxWidth:1000}}>
        <div className="card" style={{padding:"16px 20px",marginBottom:22,background:"var(--primary-tint)",border:"none",display:"flex",flexWrap:"wrap",gap:24}}>
          <div><div style={{fontSize:14,fontWeight:800,color:"var(--primary-dark)"}}>VENTA DE HOY</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--primary-dark)"}}>{money(totalHoy)}</div></div>
          <div><div style={{fontSize:14,fontWeight:800,color:"var(--primary-dark)"}}>MESAS OCUPADAS</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--primary-dark)"}}>{mesas.filter(m=>m.estado==="ocupada").length} / {mesas.length}</div></div>
          {stockBajo.length>0&&<div><div style={{fontSize:14,fontWeight:800,color:"var(--warn)"}}>⚠ STOCK BAJO</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--warn)"}}>{stockBajo.length} insumo{stockBajo.length!==1?"s":""}</div></div>}
          <div style={{marginLeft:"auto",alignSelf:"center"}}><button className="bp" onClick={generarResumen} disabled={resumenLoading}>{resumenLoading?"Generando…":"✨ Resumen del día"}</button></div>
        </div>
        {resumen&&<div className="card" style={{padding:18,marginBottom:22,lineHeight:1.6,fontSize:14.5}}>{resumen}</div>}
        {tab==="mesas"&&<PanelMesas userId={userId} mesas={mesas} pedidos={pedidos} items={items} reload={reload}/>}
        {tab==="empleados"&&<PanelEmpleados userId={userId} empleados={empleados} reload={reload}/>}
        {tab==="menu"&&<PanelMenu userId={userId} menu={menu} insumos={insumos} recetas={recetas} reload={reload}/>}
        {tab==="stock"&&<PanelStock userId={userId} insumos={insumos} compras={compras} reload={reload}/>}
        {tab==="caja"&&<PanelCaja userId={userId} pedidos={pedidos} items={items} cierres={cierres} reload={reload}/>}
      </main>
    </div>
  );
}

            <div style={{fontWeight:800,fontSize:15}}>Mesa {m.numero}</div>
            <span className="tag" style={{background:m.estado==="ocupada"?"var(--primary-tint)":"var(--accent-tint)",color:m.estado==="ocupada"?"var(--primary-dark)":"var(--accent)"}}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
            {m.estado==="ocupada"&&<div style={{fontSize:14.5,color:"var(--ink-soft)",marginTop:8}}>Mozo: {m.mozo_nombre}<br/>Total: {money(tot)}</div>}

        {!mesas.length&&<div style={{color:"var(--ink-soft)",fontSize:15}}>Todavía no cargaste mesas.</div>}
      </div>
    </div>
  );
}

            <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>PIN</label><input className="field" value={editForm.pin} onChange={ev=>setEditForm({...editForm,pin:ev.target.value.replace(/\D/g,"")})}/></div>

          </div>
        ))}
        {!empleados.length&&<div className="card" style={{padding:20,color:"var(--ink-soft)",fontSize:15}}>Todavía no cargaste empleados.</div>}
      </div>
    </div>
  );
}

function opcionesUnidad(unidadBase){
  const u=(unidadBase||"").toLowerCase();
  if(u.startsWith("kilogramo")||u==="kg")return[{label:"Kilogramos",factor:1},{label:"Gramos",factor:0.001}];
  if(u.startsWith("litro")||u==="l")return[{label:"Litros",factor:1},{label:"Mililitros",factor:0.001}];
  return[{label:unidadBase||"unidad",factor:1}];
}

      {!insumos.length&&<div style={{fontSize:14.5,color:"var(--ink-soft)",marginTop:8}}>Primero cargá insumos en la sección "Stock".</div>}

        <button className="bp" onClick={add}>Guardar</button>
      </div>}
      <input className="field" placeholder="🔎 Buscar plato o bebida…" value={busqueda} onChange={e=>setBusqueda(e.target.value)} style={{marginBottom:18}}/>
      {cats.map(cat=>(

            {menuFiltrado.filter(m=>m.categoria===cat).map(m=>{const costo=costoItem(m);const margen=m.precio-costo;const pct=m.precio>0?Math.round(margen/m.precio*100):0;return(
              <div key={m.id} className="card" style={{padding:16,display:"flex",flexDirection:"column",gap:10}}>
                {editId===m.id?(
                  <>
                    <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Nombre</label><input className="field" value={editForm.nombre} onChange={e=>setEditForm({...editForm,nombre:e.target.value})}/></div>
                    <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Categoría</label><input className="field" value={editForm.categoria} onChange={e=>setEditForm({...editForm,categoria:e.target.value})}/></div>
                    <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Precio</label><input className="field" value={editForm.precio} onChange={e=>setEditForm({...editForm,precio:e.target.value.replace(/\D/g,"")})} placeholder="8500"/><div style={{fontSize:12.5,color:"var(--ink-soft)"}}>solo números, sin puntos ni comas</div></div>
                    <div style={{display:"flex",gap:8}}><button className="bp" style={{flex:1}} onClick={guardarEdicion}>Guardar</button><button className="bg" onClick={()=>setEditId(null)}>Cancelar</button></div>
                  </>

                    <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>abrirEdicion(m)}>✏️ Editar</button>
                    <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>toggle(m)}>{m.activo?"Pausar":"Activar"}</button>
                    <button className="bg" style={{fontSize:13.5,padding:"6px 10px",background:m.va_a_cocina?"transparent":"var(--warn-tint)",borderColor:m.va_a_cocina?"var(--line)":"var(--warn)",color:m.va_a_cocina?"var(--ink-soft)":"var(--warn)"}} onClick={()=>toggleCocina(m)}>{m.va_a_cocina?"🍳 Va a cocina":"🥤 Directo"}</button>
                    <button className="bg" style={{fontSize:13.5,padding:"6px 8px"}} onClick={()=>del(m.id)}>🗑</button>
                  </div>
                  {selItem?.id===m.id&&<RecetaEditor item={m} recetas={recetas} insumos={insumos} recForm={recForm} setRecForm={setRecForm} recFactor={recFactor} setRecFactor={setRecFactor} addRec={addRec} delRec={delRec}/>}
                </>
                )}

            );})}
          </div>

      ))}

      {menu.length>0&&!cats.length&&<div style={{color:"var(--ink-soft)",fontSize:15}}>No se encontró ningún plato o bebida con ese nombre.</div>}
    </div>
  );
}

    await sb.from("compras").insert({user_id:userId,insumo_id:compra.insumo_id,cantidad:cant,precio_unitario:precio});
    setCompra({insumo_id:"",cantidad:"",precio_total:""});setOpenC(false);reload();

          <button className="bp" style={{background:"var(--accent)"}} onClick={registrarCompra} disabled={!compra.insumo_id||!cantCompra}>Registrar</button>

      </div>}

          </div>
        );})}
      </div>
    </div>
  );
}

function PanelCaja({userId,pedidos,items,cierres,reload}){

    setDetalleCierre(prev=>({...prev,[c.id]:conItems}));
  };

      if(met==="efectivo")ef+=tot;else if(met==="tarjeta")tar+=tot;else tr+=tot;
      mesasCant++;
      aCerrarAhora.push({id:p.id,mesa_id:p.mesa_id,tot,met});
    }
    (sueltos||[]).forEach(p=>{
      const tot=Number(p.total)||0;
      if(p.metodo_pago==="efectivo")ef+=tot;else if(p.metodo_pago==="tarjeta")tar+=tot;else tr+=tot;
      mesasCant++;
    });
    const total=ef+tar+tr;
    const{data:cierreNuevo}=await sb.from("cierres_caja").insert({user_id:userId,fecha:hoyStr,total_efectivo:ef,total_tarjeta:tar,total_transferencia:tr,total_general:total,cantidad_mesas:mesasCant}).select().single();
    for(const p of aCerrarAhora){
      await sb.from("pedidos").update({estado:"cerrada",total:p.tot,metodo_pago:p.met,cerrado_at:ahora,cierre_id:cierreNuevo.id}).eq("id",p.id);

    }

      await sb.from("pedidos").update({cierre_id:cierreNuevo.id}).in("id",sueltos.map(p=>p.id));
    }
    reload();
    alert(`Caja cerrada. Total: ${money(total)}\nEfectivo: ${money(ef)}\nTarjeta: ${money(tar)}\nTransferencia: ${money(tr)}`);
  };
  const totalGeneral=pedidos.reduce((s,p)=>s+items.filter(i=>i.pedido_id===p.id).reduce((s2,i)=>s2+Number(i.precio)*i.cantidad,0),0);
  return(
    <div>
      <div style={{fontSize:29,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>MESAS ABIERTAS AHORA</div>
      {!pedidos.length&&<div className="card" style={{padding:20,color:"var(--ink-soft)",fontSize:15,marginBottom:18}}>No hay mesas abiertas en este momento.</div>}
      {pedidos.length>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:12,marginBottom:16}}>
        {pedidos.map(p=>{const itemsP=items.filter(i2=>i2.pedido_id===p.id);const tot=itemsP.reduce((s,i2)=>s+Number(i2.precio)*i2.cantidad,0);const abiertoAqui=abierto===p.id;return(
          <div key={p.id} className="card" style={{padding:16,display:"flex",flexDirection:"column",gap:10}}>
            <div style={{cursor:"pointer"}} onClick={()=>setAbierto(abiertoAqui?null:p.id)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                <div style={{fontWeight:700,fontSize:16}}>{abiertoAqui?"▾":"▸"} Mesa {p.mesa_numero}</div>
                <div style={{fontWeight:800,fontFamily:"'Fraunces',serif",fontSize:18,color:"var(--primary-dark)"}}>{money(tot)}</div>
              </div>
              <div style={{fontSize:14,color:"var(--ink-soft)"}}>Mozo: {p.mozo_nombre||"—"}</div>
            </div>
            <select className="field" value={metodo[p.id]||"efectivo"} onChange={e=>setMetodo({...metodo,[p.id]:e.target.value})}>
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
            </select>
            {abiertoAqui&&<div style={{background:"var(--surface-2)",borderRadius:8,padding:"8px 12px"}}>
              {itemsP.map(i2=>(
                <div key={i2.id} style={{display:"flex",justifyContent:"space-between",fontSize:15,padding:"3px 0"}}>
                  <span>{i2.nombre}{i2.aclaracion&&<span style={{color:"var(--ink-soft)"}}> — {i2.aclaracion}</span>}</span>
                  <span>{money(i2.precio)}</span>
                </div>
              ))}
              {!itemsP.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Sin items cargados.</div>}
            </div>}
          </div>
        );})}
      </div>}
      {pedidos.length>0&&(
        <div className="card" style={{padding:18,marginBottom:22,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:700,color:"var(--primary-dark)"}}>Total acumulado: {money(totalGeneral)}</div>
          <button className="bp" style={{padding:"12px 20px"}} onClick={cerrarCaja}>💰 Cerrar caja del día</button>
        </div>
      )}
      <div style={{fontSize:29,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>HISTORIAL DE CIERRES</div>
      {!cierres.length&&<div className="card" style={{padding:20,color:"var(--ink-soft)",fontSize:15}}>Todavía no realizaste ningún cierre de caja.</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
        {cierres.map(c=>{const cAbierto=cierreAbierto===c.id;return(
          <div key={c.id} className="card" style={{padding:16,display:"flex",flexDirection:"column",gap:10}}>
            <div style={{cursor:"pointer"}} onClick={()=>verDetalleCierre(c)}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{fontWeight:700,fontSize:16}}>{cAbierto?"▾":"▸"} Caja del {c.fecha}</div>
                <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700,color:"var(--primary-dark)"}}>{money(c.total_general)}</div>
              </div>
              <div style={{fontSize:14,color:"var(--ink-soft)"}}>{c.cantidad_mesas} mesa{c.cantidad_mesas!==1?"s":""} atendidas</div>
              <div style={{fontSize:14.5,color:"var(--ink-soft)",marginTop:6,display:"flex",gap:14,flexWrap:"wrap"}}>
                <span>💵 {money(c.total_efectivo)}</span>
                <span>💳 {money(c.total_tarjeta)}</span>
                <span>🏦 {money(c.total_transferencia)}</span>
              </div>
            </div>
            {cAbierto&&<div style={{borderTop:"1px solid var(--line)",paddingTop:10}}>
              {!detalleCierre[c.id]&&<div style={{fontSize:14.5,color:"var(--ink-soft)"}}>Cargando detalle…</div>}
              {detalleCierre[c.id]&&!detalleCierre[c.id].length&&<div style={{fontSize:14.5,color:"var(--ink-soft)"}}>No se encontró el detalle de mesas para este día.</div>}
              {detalleCierre[c.id]&&detalleCierre[c.id].map(p=>(
                <div key={p.id} style={{background:"var(--surface-2)",borderRadius:8,padding:"8px 12px",marginBottom:8}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:14}}>
                    <span>Mesa {p.mesa_numero} · {p.metodo_pago==="efectivo"?"💵":p.metodo_pago==="tarjeta"?"💳":"🏦"} {p.mozo_nombre?`· ${p.mozo_nombre}`:""}</span>
                    <span>{money(p.total)}</span>
                  </div>
                  {p.itemsP.map(i2=>(
                    <div key={i2.id} style={{display:"flex",justifyContent:"space-between",fontSize:14.5,padding:"2px 0",color:"var(--ink-soft)"}}>
                      <span>{i2.nombre}{i2.aclaracion&&<span> — {i2.aclaracion}</span>}</span>
                      <span>{money(i2.precio)}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>}
          </div>
        );})}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
