const money=n=>`$${Number(n||0).toLocaleString("es-AR")}`;
const hora=iso=>new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const hoy=()=>new Date().toISOString().slice(0,10);
const costoProducto=(item,recetas,insumos)=>{
  if(item.usa_receta===false){const cm=Number(item.costo_manual);return cm>0?cm:null;}
  const recs=recetas.filter(r=>r.menu_item_id===item.id);
  if(!recs.length)return null;
  let total=0;
  for(const r of recs){
    const ins=insumos.find(i=>i.id===r.insumo_id);
    if(!ins||!(Number(ins.precio_compra)>0))return null;
    total+=Number(ins.precio_compra)*Number(r.cantidad);
  }
  return total;
};
const formatCantidad=(valor,unidad)=>{
  const v=Number(valor)||0;
  if(unidad==="gramos"&&Math.abs(v)>=1000)return`${(v/1000).toLocaleString("es-AR",{maximumFractionDigits:1})} kg`;
  if(unidad==="mililitros"&&Math.abs(v)>=1000)return`${(v/1000).toLocaleString("es-AR",{maximumFractionDigits:1})} L`;
  const etiqueta=unidad==="gramos"?"g":unidad==="mililitros"?"ml":(unidad||"unidad");
  return`${v.toLocaleString("es-AR",{maximumFractionDigits:1})} ${etiqueta}`;
};
function CampoMonto({value,onChange,placeholder,style,autoFocus}){
  const formatearVisible=v=>{
    if(v===""||v==null)return"";
    const n=Number(v);
    if(isNaN(n))return"";
    const[,dec]=String(v).split(".");
    return n.toLocaleString("es-AR",{minimumFractionDigits:dec?Math.min(dec.length,2):0,maximumFractionDigits:2});
  };
  const manejarCambio=e=>{
    let raw=e.target.value.replace(/\./g,"").replace(",",".").replace(/[^0-9.]/g,"");
    const primerPunto=raw.indexOf(".");
    if(primerPunto!==-1)raw=raw.slice(0,primerPunto+1)+raw.slice(primerPunto+1).replace(/\./g,"");
    onChange(raw);
  };
  return<input className="field" inputMode="decimal" style={style} autoFocus={autoFocus} value={formatearVisible(value)} onChange={manejarCambio} placeholder={placeholder}/>;
}

  const[pin,setPin]=useState("");
  const[err,setErr]=useState("");

  const elegirDueno=()=>{
    if(!pinDueno){onElegir({rol:"dueño",id:null,nombre:"Dueño/a"});return;}
    setEli({esDueno:true,pin:pinDueno,rol:"dueño",id:null,nombre:"Dueño/a"});setPin("");setErr("");
  };
  const confirmar=()=>{if(eli.pin!==pin.trim()){setErr("PIN incorrecto.");return;}onElegir({rol:eli.rol,id:eli.id,nombre:eli.nombre});};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div className="card" style={{width:"100%",maxWidth:420,padding:32}}>

              <button key={e.id} className="bg" style={{width:"100%",padding:14,marginBottom:8,fontSize:14.5,textAlign:"left",display:"flex",alignItems:"center",gap:10}} onClick={()=>{setEli(e);setPin("");setErr("");}}>
                {e.rol==="mozo"?"🧑‍🍳":"👨‍🍳"} {e.nombre}<span style={{marginLeft:"auto",color:"var(--ink-soft)",fontSize:14,fontWeight:700}}>{e.rol==="mozo"?"MOZO":"COCINA"}</span>
              </button>
            ))}

            {!pinDueno&&<div style={{fontSize:13,color:"var(--warn)",textAlign:"center",marginTop:14}}>⚠ Todavía no configuraste un PIN para "Soy el dueño/a" — cualquiera puede entrar ahí. Podés ponerle uno desde Configuración una vez adentro.</div>}

function App(){
  const[session,setSession]=useState(undefined);
  const[identidad,setIdentidad]=useState(null);
  const[data,setData]=useState({empleados:[],mesas:[],menu:[],pedidos:[],items:[],insumos:[],recetas:[],cierres:[],compras:[],mensajes:[],gastos:[],ingresosExtra:[],config:{umbral_aumento_costo:15,umbral_margen_bajo:25}});
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:l}=sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>l.subscription.unsubscribe();
  },[]);

  const loadAll=async()=>{
    const corte=new Date(Date.now()-60*24*60*60*1000).toISOString();
    const[e,m,mn,p,it,ins,rec,ci,cp,msg,ga,cfg,ie]=await Promise.all([
      sb.from("empleados").select("*").order("created_at"),
      sb.from("mesas").select("*").order("numero"),
      sb.from("menu_items").select("*").order("categoria"),
      sb.from("pedidos").select("*").eq("estado","abierta"),
      sb.from("pedido_items").select("*").gte("created_at",corte).order("created_at"),
      sb.from("insumos").select("*").order("nombre"),
      sb.from("recetas").select("*"),
      sb.from("cierres_caja").select("*").order("fecha",{ascending:false}).limit(400),
      sb.from("compras").select("*").gte("created_at",corte).order("created_at",{ascending:false}),
      sb.from("mensajes_pedido").select("*").gte("created_at",corte).order("created_at"),
      sb.from("gastos").select("*").order("fecha",{ascending:false}).limit(400),
      sb.from("configuracion").select("*").eq("user_id",session.user.id),
      sb.from("ingresos_extra").select("*").order("fecha",{ascending:false}).limit(400),
    ]);
    const cfgRow=cfg.data?.[0];
    setData({
      empleados:e.data||[],mesas:m.data||[],menu:mn.data||[],
      pedidos:p.data||[],items:it.data||[],insumos:ins.data||[],
      recetas:rec.data||[],cierres:ci.data||[],compras:cp.data||[],
      mensajes:msg.data||[],gastos:ga.data||[],ingresosExtra:ie.data||[],
      config:{umbral_aumento_costo:cfgRow?.umbral_aumento_costo??15,umbral_margen_bajo:cfgRow?.umbral_margen_bajo??25,pin_dueno:cfgRow?.pin_dueno||""},
    });
    setLoading(false);
  };

  useEffect(()=>{
    if(!session)return;
    loadAll();
    const saved=localStorage.getItem("modula_id");
    if(saved)try{setIdentidad(JSON.parse(saved));}catch{}
    const canal=sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"pedido_items"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"mesas"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"insumos"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"mensajes_pedido"},()=>loadAll()).subscribe();
    return()=>sb.removeChannel(canal);
  },[session]);

  const elegir=id=>{setIdentidad(id);localStorage.setItem("modula_id",JSON.stringify(id));};
  const cambiar=()=>{localStorage.removeItem("modula_id");setIdentidad(null);};
  const logout=async()=>{localStorage.removeItem("modula_id");await sb.auth.signOut();};

  if(session===undefined)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-soft)"}}>Cargando…</div>;
  if(!session)return<Login/>;
  if(loading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-soft)"}}>Cargando el negocio…</div>;
  if(!identidad)return<SelectorIdentidad empleados={data.empleados} config={data.config} onElegir={elegir}/>;

  const props={userId:session.user.id,identidad,...data,reload:loadAll,cambiar,logout};
  if(identidad.rol==="dueño")return<VistaDueño {...props}/>;
  if(identidad.rol==="mozo")return<VistaMozo {...props}/>;
  if(identidad.rol==="cocina")return<VistaCocina {...props}/>;
  return null;
}

function ChatHilo({itemId,mensajes,autor,userId,reload}){
  const[abierto,setAbierto]=useState(false);
  const[texto,setTexto]=useState("");
  const msgs=mensajes.filter(m=>m.pedido_item_id===itemId);
  const enviar=async()=>{
    if(!texto.trim())return;
    const t=texto.trim();setTexto("");
    await sb.from("mensajes_pedido").insert({pedido_item_id:itemId,autor,texto:t,user_id:userId});
    reload();
  };
  return(
    <div style={{marginTop:6}}>
      <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>setAbierto(!abierto)}>💬 {msgs.length?`Chat (${msgs.length})`:"Chat"}</button>
      {abierto&&<div style={{background:"var(--surface-2)",borderRadius:8,padding:10,marginTop:6}}>
        {!msgs.length&&<div style={{fontSize:13.5,color:"var(--ink-soft)"}}>Sin mensajes todavía.</div>}
        {msgs.map(m=>(
          <div key={m.id} style={{display:"flex",justifyContent:m.autor===autor?"flex-end":"flex-start",marginBottom:6}}>
            <div style={{maxWidth:"85%",background:m.autor===autor?"var(--primary)":"var(--surface)",color:m.autor===autor?"#fff":"var(--ink)",borderRadius:10,padding:"6px 10px",fontSize:14}}>
              <div style={{fontSize:11.5,opacity:.75,marginBottom:2}}>{m.autor==="mozo"?"Mozo":"Cocina"} · {hora(m.created_at)}</div>
              {m.texto}
            </div>
          </div>
        ))}
        <div style={{display:"flex",gap:6,marginTop:8}}>
          <input className="field" placeholder="Escribí un mensaje…" value={texto} onChange={e=>setTexto(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")enviar();}}/>
          <button className="bp" style={{padding:"8px 12px",fontSize:14}} onClick={enviar}>Enviar</button>
        </div>
      </div>}
    </div>
  );
}
function VistaMozo({userId,identidad,mesas,menu,pedidos,items,mensajes,recetas,insumos,reload,cambiar,logout}){

  const[pidiendoPago,setPidiendoPago]=useState(false);

  const[cobroAbierto,setCobroAbierto]=useState(null);
  const cargarCobrosHoy=async()=>{
    const{data}=await sb.from("pedidos").select("*").eq("mozo_id",identidad.id).eq("estado","cerrada").order("cerrado_at",{ascending:false}).limit(100);
    const hoyStr=hoy();
    setCobrosHoy((data||[]).filter(p=>p.cerrado_at&&p.cerrado_at.slice(0,10)===hoyStr));
  };
  useEffect(()=>{cargarCobrosHoy();},[]);
  useEffect(()=>{
    if(mesaId)localStorage.setItem("modula_mesa",mesaId);
    else localStorage.removeItem("modula_mesa");
  },[mesaId]);
  useEffect(()=>{
    if(mesaId&&mesas.length){
      const m=mesas.find(mm=>mm.id===mesaId);
      if(!m||m.estado!=="ocupada"||m.mozo_id!==identidad.id)setMesaId(null);
    }
  },[mesas]);
  const misMesas=mesas.filter(m=>m.estado==="libre"||m.mozo_id===identidad.id);

  const descontarStock=async menuItemId=>{

    if(!confirm(`¿Borrar "${i.nombre}" del pedido?`))return;
    await sb.from("pedido_items").delete().eq("id",i.id);
    if(i.menu_item_id)await restaurarStock(i.menu_item_id);
    reload();
  };
  const marcarEntregado=async i=>{await sb.from("pedido_items").update({estado:"entregado"}).eq("id",i.id);reload();};
  const cerrarMesa=async metodo=>{
    const total=itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
    await sb.from("pedidos").update({estado:"cerrada",total,metodo_pago:metodo,cerrado_at:new Date().toISOString()}).eq("id",pedSel.id);
    await sb.from("mesas").update({estado:"libre",mozo_id:null,mozo_nombre:null}).eq("id",mesaSel.id);
    setPidiendoPago(false);setMesaId(null);reload();cargarCobrosHoy();
  };
  const cats=[...new Set(menu.filter(m=>m.activo).map(m=>m.categoria))];
  if(mesaSel){
    const total=itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
    return(
      <div>
        <TopBar titulo={`Mesa ${mesaSel.numero}`} identidad={identidad} cambiar={cambiar} logout={logout}/>
        <div style={{padding:18,maxWidth:640,margin:"0 auto"}}>
          <button className="bg" style={{marginBottom:14}} onClick={()=>setMesaId(null)}>← Volver</button>
          {ultimoAgregado&&<div className="card" style={{padding:"10px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",background:"var(--accent-tint)",borderColor:"var(--accent)"}}>
            <span style={{fontSize:14.5,color:"var(--accent)",fontWeight:700}}>✅ Se agregó: {ultimoAgregado.nombre}</span>
            <button className="bg" style={{padding:"6px 12px",fontSize:14}} onClick={deshacerUltimo}>Deshacer</button>
          </div>}
          <div className="card" style={{padding:16,marginBottom:16}}>
            <div style={{fontSize:21,fontWeight:800,color:"var(--ink-soft)",marginBottom:10}}>PEDIDO ACTUAL</div>
            {!itemsMesa.length&&<div style={{fontSize:14.5,color:"var(--ink-soft)"}}>Todavía no agregaste nada.</div>}
            {itemsMesa.map(i=>(
              <div key={i.id} style={{padding:"8px 0",borderTop:"1px solid var(--line)"}}>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14.5}}>{i.nombre}{i.aclaracion&&<span style={{fontWeight:500,color:"var(--ink-soft)"}}> — {i.aclaracion}</span>}</div>
                    <div style={{fontSize:13.5,color:"var(--ink-soft)"}}>{money(i.precio)} · {hora(i.created_at)}</div>
                  </div>
                  <span className="tag" style={{background:i.estado==="pendiente"?"var(--warn-tint)":i.estado==="listo"?"var(--accent-tint)":"var(--surface-2)",color:i.estado==="pendiente"?"var(--warn)":i.estado==="listo"?"var(--accent)":"var(--ink-soft)"}}>{i.estado==="pendiente"?"En cocina":i.estado==="listo"?"¡Listo!":"Entregado"}</span>
                  {i.estado==="listo"&&<button className="bp" style={{padding:"6px 10px",fontSize:14}} onClick={()=>marcarEntregado(i)}>Entregar</button>}
                  <button className="bg" style={{padding:"6px 8px",fontSize:14}} onClick={()=>borrarItem(i)}>✕</button>
                </div>
                <ChatHilo itemId={i.id} mensajes={mensajes} autor="mozo" userId={userId} reload={reload}/>
              </div>
            ))}
            {itemsMesa.length>0&&<div style={{textAlign:"right",fontWeight:800,marginTop:10,fontFamily:"'Fraunces',serif",fontSize:17,color:"var(--primary-dark)"}}>Total: {money(total)}</div>}
          </div>
          <div className="card" style={{padding:16,marginBottom:16}}>
            <input className="field" placeholder="Aclaración opcional: sin sal, para llevar…" value={acl} onChange={e=>setAcl(e.target.value)} style={{marginBottom:14}}/>
            {cats.map(cat=>(
              <div key={cat} style={{marginBottom:14}}>
                <div style={{fontSize:21,fontWeight:800,color:"var(--primary)",marginBottom:8}}>{cat.toUpperCase()}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
                  {menu.filter(m=>m.categoria===cat&&m.activo).map(m=>(
                    <button key={m.id} className="bg" style={{padding:"12px 8px",textAlign:"center",fontWeight:700}} onClick={()=>agregarItem(m)}>
                      {m.nombre}<div style={{fontWeight:600,fontSize:14,color:"var(--ink-soft)",marginTop:3}}>{money(m.precio)}</div>
                    </button>
                  ))}
                </div>
              </div>
            ))}
            {!menu.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>El dueño todavía no cargó el menú.</div>}
          </div>
          {!pidiendoPago?(
            <button className="bp" style={{width:"100%",padding:14}} onClick={()=>setPidiendoPago(true)} disabled={!itemsMesa.length}>Cerrar mesa y pedir la cuenta</button>
          ):(
            <div className="card" style={{padding:16}}>
              <div style={{fontWeight:700,marginBottom:12,textAlign:"center"}}>¿Cómo pagó el cliente?</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                <button className="bp" style={{flex:"1 1 100px"}} onClick={()=>cerrarMesa("efectivo")}>💵 Efectivo</button>
                <button className="bp" style={{flex:"1 1 100px"}} onClick={()=>cerrarMesa("tarjeta")}>💳 Tarjeta</button>
                <button className="bp" style={{flex:"1 1 100px"}} onClick={()=>cerrarMesa("transferencia")}>🏦 Transf.</button>
              </div>
              <button className="bg" style={{width:"100%",marginTop:10}} onClick={()=>setPidiendoPago(false)}>Cancelar</button>
            </div>
          )}
        </div>
      </div>
    );
  }
  return(
    <div>
      <TopBar titulo="Mis mesas" identidad={identidad} cambiar={cambiar} logout={logout}/>
      <div style={{padding:18,maxWidth:640,margin:"0 auto"}}>
        {cobrosHoy.length>0&&(()=>{
          const ef=cobrosHoy.filter(p=>p.metodo_pago==="efectivo").reduce((s,p)=>s+Number(p.total),0);
          const tar=cobrosHoy.filter(p=>p.metodo_pago==="tarjeta").reduce((s,p)=>s+Number(p.total),0);
          const tr=cobrosHoy.filter(p=>p.metodo_pago==="transferencia").reduce((s,p)=>s+Number(p.total),0);
          return(
            <div className="card" style={{padding:16,marginBottom:16,background:"var(--primary-tint)",border:"none"}}>
              <div style={{fontSize:14,fontWeight:800,color:"var(--primary-dark)",marginBottom:6}}>COBRADO HOY ({cobrosHoy.length} mesa{cobrosHoy.length!==1?"s":""})</div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:24,fontWeight:700,color:"var(--primary-dark)",marginBottom:8}}>{money(ef+tar+tr)}</div>
              <div style={{fontSize:15,color:"var(--primary-dark)",display:"flex",gap:14,flexWrap:"wrap"}}>
                <span>💵 Efectivo: {money(ef)}</span>
                <span>💳 Tarjeta: {money(tar)}</span>
                <span>🏦 Transf.: {money(tr)}</span>
              </div>
              <div style={{marginTop:12,display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
                {[...cobrosHoy].sort((a,b)=>new Date(b.cerrado_at)-new Date(a.cerrado_at)).map(p=>{
                  const itemsP=items.filter(i=>i.pedido_id===p.id);
                  const abierto=cobroAbierto===p.id;
                  return(
                    <div key={p.id} style={{background:"var(--surface)",borderRadius:10,padding:"10px 12px"}}>
                      <div onClick={()=>setCobroAbierto(abierto?null:p.id)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:15,color:"var(--primary-dark)",cursor:"pointer"}}>
                        <span>{abierto?"▾":"▸"} Mesa {p.mesa_numero} · {p.metodo_pago==="efectivo"?"💵":p.metodo_pago==="tarjeta"?"💳":"🏦"} {hora(p.cerrado_at)}</span>
                        <span style={{fontWeight:700}}>{money(p.total)}</span>
                      </div>
                      {abierto&&<div style={{background:"rgba(255,255,255,0.5)",borderRadius:8,padding:"6px 10px",marginTop:6}}>
                        {itemsP.map(i=>(
                          <div key={i.id} style={{display:"flex",justifyContent:"space-between",fontSize:14.5,padding:"3px 0",color:"var(--ink)"}}>
                            <span>{i.nombre}{i.aclaracion&&<span style={{color:"var(--ink-soft)"}}> — {i.aclaracion}</span>}</span>
                            <span>{money(i.precio)}</span>
                          </div>
                        ))}
                        {!itemsP.length&&<div style={{fontSize:14,color:"var(--ink-soft)"}}>Sin detalle de items.</div>}
                      </div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:12}}>
          {misMesas.map(m=>{
            const pedM=pedidos.find(p=>p.mesa_id===m.id);
            const itemsM=pedM?items.filter(i=>i.pedido_id===pedM.id):[];
            const tieneListo=itemsM.some(i=>i.estado==="listo");
            const itemIdsM=itemsM.map(i=>i.id);
            const tieneMensajeNuevo=mensajes.some(msg=>{
              if(msg.autor!=="cocina"||!itemIdsM.includes(msg.pedido_item_id))return false;
              return!mensajes.some(m2=>m2.pedido_item_id===msg.pedido_item_id&&m2.autor==="mozo"&&new Date(m2.created_at)>new Date(msg.created_at));
            });
            return(
            <button key={m.id} className="mesabtn" style={{borderColor:tieneListo||tieneMensajeNuevo?"var(--accent)":m.estado==="ocupada"?"var(--primary)":"var(--line)",background:tieneListo||tieneMensajeNuevo?"var(--accent-tint)":m.estado==="ocupada"?"var(--primary-tint)":"var(--surface)",color:m.estado==="ocupada"?"var(--primary-dark)":"var(--ink)"}} onClick={()=>abrirMesa(m)}>
              Mesa {m.numero}
              <span className="tag" style={{background:m.estado==="ocupada"?"var(--primary)":"var(--accent-tint)",color:m.estado==="ocupada"?"white":"var(--accent)"}}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
              {tieneListo&&<span className="tag" style={{background:"var(--accent)",color:"white"}}>🔔 Listo para retirar</span>}
              {tieneMensajeNuevo&&<span className="tag" style={{background:"var(--warn)",color:"white"}}>💬 Mensaje nuevo</span>}
            </button>
          );})}
        </div>
        {!mesas.length&&<div style={{color:"var(--ink-soft)",fontSize:15,marginTop:20}}>El dueño todavía no cargó las mesas.</div>}
      </div>
    </div>
  );
}

// ---- VISTA COCINA ----
function VistaCocina({userId,identidad,items,mensajes,cambiar,logout,reload}){
  const pend=items.filter(i=>i.estado==="pendiente"||i.estado==="listo").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const porMesa={};pend.forEach(i=>{(porMesa[i.mesa_numero]=porMesa[i.mesa_numero]||[]).push(i);});
  const marcarListo=async i=>{await sb.from("pedido_items").update({estado:"listo"}).eq("id",i.id);reload();};
  return(
    <div>
      <TopBar titulo="👨‍🍳 Cocina" identidad={identidad} cambiar={cambiar} logout={logout}/>    
           <div style={{padding:18}}>
        {!Object.keys(porMesa).length&&<div style={{color:"var(--ink-soft)",fontSize:15,textAlign:"center",marginTop:60}}>No hay pedidos pendientes. 🎉</div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
          {Object.entries(porMesa).map(([mesa,its])=>(
            <div key={mesa} className="card" style={{padding:16}}>
              <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)",marginBottom:10}}>Mesa {mesa}</div>
              {its.map(i=>(
                <div key={i.id} style={{padding:"10px 0",borderTop:"1px solid var(--line)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700,fontSize:14.5}}>{i.nombre}</div>
                      {i.aclaracion&&<div style={{fontSize:14.5,color:"var(--primary)",fontWeight:700}}>⚠ {i.aclaracion}</div>}
                      <div style={{fontSize:13.5,color:"var(--ink-soft)"}}>{hora(i.created_at)}</div>
                    </div>
                    {i.estado==="pendiente"?<button className="bp" style={{fontSize:14.5,padding:"7px 12px"}} onClick={()=>marcarListo(i)}>Marcar listo</button>:<span className="tag" style={{background:"var(--accent-tint)",color:"var(--accent)"}}>Listo, esperando mozo</span>}
                  </div>
                  <ChatHilo itemId={i.id} mensajes={mensajes} autor="cocina" userId={userId} reload={reload}/>
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---- VISTA DUEÑO ----
function VistaDueño({userId,identidad,empleados,mesas,menu,pedidos,items,insumos,recetas,cierres,compras,gastos,ingresosExtra,config,reload,cambiar,logout}){
  const[tab,setTabRaw]=useState(()=>localStorage.getItem("modula_tab")||"inicio");
  const setTab=t=>{setTabRaw(t);localStorage.setItem("modula_tab",t);};
  const NAV=[{id:"inicio",label:"Inicio",icon:"🏠"},{id:"mesas",label:"Mesas",icon:"🍽️"},{id:"empleados",label:"Empleados",icon:"👥"},{id:"menu",label:"Menú",icon:"📋"},{id:"compras",label:"Compras",icon:"🛒"},{id:"stock",label:"Stock",icon:"📦"},{id:"caja",label:"Caja",icon:"💰"},{id:"resultados",label:"Resultados",icon:"📊"},{id:"config",label:"Configuración",icon:"⚙️"}];
  const totalHoy=pedidos.reduce((s,p)=>{const its=items.filter(i=>i.pedido_id===p.id);return s+its.reduce((s2,i)=>s2+Number(i.precio)*i.cantidad,0);},0);
  const stockBajo=insumos.filter(i=>i.stock_actual<=i.stock_minimo);
  const[resumen,setResumen]=useState(null);
  const[resumenLoading,setResumenLoading]=useState(false);
  const costoItemVD=item=>costoProducto(item,recetas,insumos);
  const generarResumen=async()=>{
    setResumenLoading(true);setResumen(null);
    const cierreHoy=cierres.find(c=>c.fecha===hoy());
    const totalHoyReal=cierreHoy?cierreHoy.total_general:totalHoy;
    const mesasAtendidasReal=cierreHoy?cierreHoy.cantidad_mesas:mesas.filter(m=>m.estado==="ocupada").length;
    const itemsHoy=items.filter(i=>i.created_at&&i.created_at.slice(0,10)===hoy());
    const conteo={};
    itemsHoy.forEach(i=>{
      if(!conteo[i.nombre])conteo[i.nombre]={cantidad:0,venta:0,menu_item_id:i.menu_item_id};
      conteo[i.nombre].cantidad+=i.cantidad;
      conteo[i.nombre].venta+=Number(i.precio)*i.cantidad;
    });
    let costoTotal=0;
    const productosVendidos=Object.entries(conteo).map(([nombre,d])=>{
      const mi=menu.find(m=>m.id===d.menu_item_id);
      const costoUnit=mi?costoItemVD(mi):0;
      const costoLinea=costoUnit*d.cantidad;
      costoTotal+=costoLinea;
      return{nombre,cantidad:d.cantidad,venta:d.venta,costo:Math.round(costoLinea)};
    }).sort((a,b)=>b.venta-a.venta);
    const margen=totalHoyReal-costoTotal;
    const comprasNecesarias=stockBajo.map(i=>({nombre:i.nombre,faltante:Math.max(i.stock_minimo-i.stock_actual,0),unidad:i.unidad}));
    try{
      const res=await fetch(`${SUPABASE_URL}/functions/v1/resumen-diario`,{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${SUPABASE_KEY}`,"apikey":SUPABASE_KEY},
        body:JSON.stringify({totalHoy:totalHoyReal,mesasAtendidas:mesasAtendidasReal,productosVendidos,costoTotal:Math.round(costoTotal),margen:Math.round(margen),comprasNecesarias}),
      });
      const data=await res.json();
      setResumen(data.resumen||"No se pudo generar el resumen.");
    }catch(e){setResumen("Error de conexión al generar el resumen.");}
    finally{setResumenLoading(false);}
  };
  return(
    <div className="app-shell" style={{display:"flex",minHeight:"100vh"}}>
      <aside className="sidebar" style={{width:220,flexShrink:0,borderRight:"1px solid var(--line)",padding:"22px 14px",display:"flex",flexDirection:"column",gap:18,background:"var(--surface)"}}>
        <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)",padding:"0 8px 14px",borderBottom:"1px solid var(--line)"}}>MODULA <span style={{color:"var(--primary)"}}>Gastro</span></div>
        <nav style={{display:"flex",flexDirection:"column",gap:4}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 14px",borderRadius:10,border:"none",background:tab===n.id?"var(--primary)":"transparent",color:tab===n.id?"white":"var(--ink-soft)",fontSize:15,fontWeight:700,textAlign:"left",position:"relative"}}>
              {n.icon} {n.label}
              {n.id==="stock"&&stockBajo.length>0&&<span style={{marginLeft:"auto",background:"var(--warn)",color:"white",borderRadius:"999px",fontSize:13.5,padding:"1px 7px",fontWeight:800}}>{stockBajo.length}</span>}
            </button>
          ))}
        </nav>
        <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:8}}>
          <button className="bg" onClick={cambiar}>Cambiar usuario</button>
          <button className="bg" onClick={logout}>Cerrar sesión</button>
        </div>
      </aside>
      <main style={{flex:1,padding:"26px 32px",maxWidth:1000}}>
        <div className="card" style={{padding:"16px 20px",marginBottom:22,background:"var(--primary-tint)",border:"none",display:"flex",flexWrap:"wrap",gap:24}}>
          <div><div style={{fontSize:14,fontWeight:800,color:"var(--primary-dark)"}}>VENTA DE HOY</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--primary-dark)"}}>{money(totalHoy)}</div></div>
          <div><div style={{fontSize:14,fontWeight:800,color:"var(--primary-dark)"}}>MESAS OCUPADAS</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--primary-dark)"}}>{mesas.filter(m=>m.estado==="ocupada").length} / {mesas.length}</div></div>
          {stockBajo.length>0&&<div><div style={{fontSize:14,fontWeight:800,color:"var(--warn)"}}>⚠ STOCK BAJO</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--warn)"}}>{stockBajo.length} insumo{stockBajo.length!==1?"s":""}</div></div>}
          <div style={{marginLeft:"auto",alignSelf:"center"}}><button className="bp" onClick={generarResumen} disabled={resumenLoading}>{resumenLoading?"Generando…":"✨ Resumen del día"}</button></div>
        </div>
        {resumen&&<div className="card" style={{padding:18,marginBottom:22,lineHeight:1.6,fontSize:14.5}}>{resumen}</div>}
        {tab==="inicio"&&<PanelInicio identidad={identidad} mesas={mesas} items={items} menu={menu} recetas={recetas} insumos={insumos} gastos={gastos} config={config} cierres={cierres} irA={setTab}/>}
        {tab==="mesas"&&<PanelMesas userId={userId} mesas={mesas} pedidos={pedidos} items={items} reload={reload}/>}
        {tab==="empleados"&&<PanelEmpleados userId={userId} empleados={empleados} reload={reload}/>}
        {tab==="menu"&&<PanelMenu userId={userId} menu={menu} insumos={insumos} recetas={recetas} reload={reload}/>}
        {tab==="compras"&&<PanelCompras userId={userId} insumos={insumos} compras={compras} recetas={recetas} menu={menu} config={config} reload={reload}/>}
        {tab==="stock"&&<PanelStock userId={userId} insumos={insumos} reload={reload}/>}
        {tab==="caja"&&<PanelCaja userId={userId} pedidos={pedidos} items={items} cierres={cierres} menu={menu} recetas={recetas} insumos={insumos} compras={compras} gastos={gastos} ingresosExtra={ingresosExtra} reload={reload}/>}
        {tab==="resultados"&&<PanelResultados items={items} menu={menu} recetas={recetas} insumos={insumos} gastos={gastos} compras={compras} config={config} mesas={mesas} cierres={cierres}/>}
        {tab==="config"&&<PanelConfiguracion userId={userId} config={config} reload={reload}/>}
      </main>
    </div>
  );
}

function PanelMesas({userId,mesas,pedidos,items,reload}){
  const[cant,setCant]=useState("");
  const crear=async()=>{const n=parseInt(cant);if(!n||n<1)return;const ex=mesas.length;const nv=Array.from({length:n},(_,i)=>({user_id:userId,numero:ex+i+1}));await sb.from("mesas").insert(nv);setCant("");reload();};
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:18,alignItems:"flex-end"}}>
        <div><label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>Agregar mesas</label><input className="field" type="number" style={{width:100}} value={cant} onChange={e=>setCant(e.target.value)} placeholder="cant."/></div>
        <button className="bp" onClick={crear}>Agregar</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12}}>
        {mesas.map(m=>{const ped=pedidos.find(p=>p.mesa_id===m.id);const its=ped?items.filter(i=>i.pedido_id===ped.id):[];const tot=its.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);return(
          <div key={m.id} className="card" style={{padding:14,borderColor:m.estado==="ocupada"?"var(--primary)":"var(--line)"}}>
            <div style={{fontWeight:800,fontSize:15}}>Mesa {m.numero}</div>
            <span className="tag" style={{background:m.estado==="ocupada"?"var(--primary-tint)":"var(--accent-tint)",color:m.estado==="ocupada"?"var(--primary-dark)":"var(--accent)"}}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
            {m.estado==="ocupada"&&<div style={{fontSize:14.5,color:"var(--ink-soft)",marginTop:8}}>Mozo: {m.mozo_nombre}<br/>Total: {money(tot)}</div>}
          </div>
        );})}
        {!mesas.length&&<div style={{color:"var(--ink-soft)",fontSize:15}}>Todavía no cargaste mesas.</div>}
      </div>
    </div>

              <div><div style={{fontWeight:700,fontSize:16}}>{e.nombre}</div><div style={{fontSize:14,color:"var(--ink-soft)"}}>{e.rol==="mozo"?"Mozo":"Cocina"} · PIN {e.pin}</div></div>

            </div>

              <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>abrirEdicion(e)}>✏️ Editar</button>

function opcionesUnidad(unidadBase){
  const u=(unidadBase||"").toLowerCase();
  if(u==="gramos")return[{label:"Gramos",factor:1},{label:"Kilogramos",factor:1000}];
  if(u==="mililitros")return[{label:"Mililitros",factor:1},{label:"Litros",factor:1000}];
  return[{label:"unidad",factor:1}];
}
function RecetaEditor({item,recetas,insumos,recForm,setRecForm,recFactor,setRecFactor,addRec,delRec}){
  return(
    <div style={{padding:"14px 16px",background:"var(--surface-2)",borderTop:"1px solid var(--line)"}}>
      <div style={{fontWeight:700,color:"var(--accent)",marginBottom:10,fontSize:14.5}}>📦 Receta: {item.nombre}</div>
      {recetas.filter(r=>r.menu_item_id===item.id).map(r=>{const ins=insumos.find(i=>i.id===r.insumo_id);return(
        <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderTop:"1px solid var(--line)"}}>
          <div style={{flex:1,fontSize:14.5}}>{ins?.nombre||"?"} — {r.cantidad} {ins?.unidad||""}</div>
          <button className="bg" style={{padding:"4px 8px",fontSize:13.5}} onClick={()=>delRec(r.id)}>✕</button>
        </div>
      );})}
      <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{flex:1}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Insumo</label>
          <select className="field" value={recForm.insumo_id} onChange={e=>{setRecForm({...recForm,insumo_id:e.target.value});setRecFactor(1);}}>
            <option value="">Elegir…</option>
            {insumos.map(i=><option key={i.id} value={i.id}>{i.nombre}</option>)}
          </select>
               </div>
        <div style={{width:100}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Cantidad</label><input className="field" inputMode="decimal" value={recForm.cantidad} onChange={e=>setRecForm({...recForm,cantidad:e.target.value.replace(",",".").replace(/[^0-9.]/g,"")})} placeholder="ej: 200"/></div>
        {recForm.insumo_id&&(()=>{const opts=opcionesUnidad(insumos.find(i=>i.id===recForm.insumo_id)?.unidad);return opts.length>1?(
          <div style={{width:120}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Unidad</label>
            <select className="field" value={recFactor} onChange={e=>setRecFactor(Number(e.target.value))}>
              {opts.map(o=><option key={o.label} value={o.factor}>{o.label}</option>)}
            </select>
          </div>
        ):<div style={{fontSize:14,color:"var(--ink-soft)",paddingBottom:10}}>{opts[0].label}</div>;})()}
        <button className="bp" onClick={addRec}>Agregar</button>
      </div>
      {!insumos.length&&<div style={{fontSize:14.5,color:"var(--ink-soft)",marginTop:8}}>Primero cargá insumos en la sección "Stock".</div>}
    </div>
  );
}

      {archivados.length>0&&<div style={{marginTop:26}}>
        <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>setVerArchivados(!verArchivados)}>🗄 {verArchivados?"Ocultar":"Ver"} archivados ({archivados.length})</button>
        {verArchivados&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:12,marginTop:12}}>
          {archivados.map(m=>(
            <div key={m.id} className="card" style={{padding:14,display:"flex",justifyContent:"space-between",alignItems:"center",opacity:.7}}>
              <div><div style={{fontWeight:700,fontSize:15}}>{m.nombre}</div><div style={{fontSize:13.5,color:"var(--ink-soft)"}}>{money(m.precio)}</div></div>
              <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>toggleArchivar(m)}>↩️ Desarchivar</button>
            </div>
          ))}
        </div>}
      </div>}
    </div>
  );
}

function PanelCompras({userId,insumos,compras,recetas,menu,config,reload}){
  const num=v=>v.replace(",",".").replace(/[^0-9.]/g,"");
  const PRESENTACIONES=["Paquete","Botella","Bolsa","Caja","Cajón","Docena","Sachet","Otro"];
  const[compra,setCompra]=useState({nombre:"",insumo_id:"",esNuevo:false,tipoMedida:"gramos",unidadEntrada:"kg",presentacion:"Paquete",presentacionOtro:"",cantidadPaquetes:"1",contenidoUnitario:"",contenidoValorNuevo:"",precio_total:"",proveedor:""});
  const[openC,setOpenC]=useState(false);
  const[pasoCompra,setPasoCompra]=useState(0);
  const factorEntradaCompra=()=>compra.tipoMedida==="gramos"?(compra.unidadEntrada==="kg"?1000:1):compra.tipoMedida==="mililitros"?(compra.unidadEntrada==="litro"?1000:1):1;
  const contenidoPorUnidad=compra.esNuevo?(Number(compra.contenidoValorNuevo)||0)*factorEntradaCompra():(Number(compra.contenidoUnitario)||0);
  const cantCompra=(Number(compra.cantidadPaquetes)||0)*contenidoPorUnidad;
  const totalCompra=Number(compra.precio_total)||0;
  const precioUnitCalc=cantCompra>0?totalCompra/cantCompra:0;
  const UMBRAL_AUMENTO=config?.umbral_aumento_costo??15;
  const productosAfectados=insumoId=>menu.filter(m=>!m.archivado&&recetas.some(r=>r.menu_item_id===m.id&&r.insumo_id===insumoId));
  const resetCompra=()=>setCompra({nombre:"",insumo_id:"",esNuevo:false,tipoMedida:"gramos",unidadEntrada:"kg",presentacion:"Paquete",presentacionOtro:"",cantidadPaquetes:"1",contenidoUnitario:"",contenidoValorNuevo:"",precio_total:"",proveedor:""});
  const confirmarProducto=()=>{
    const nombreTrim=compra.nombre.trim();
    if(!nombreTrim)return;
    const match=insumos.find(i=>i.nombre.trim().toLowerCase()===nombreTrim.toLowerCase());
    if(match){
      setCompra({...compra,nombre:match.nombre,insumo_id:match.id,esNuevo:false,cantidadPaquetes:"1",contenidoUnitario:match.contenido_presentacion!=null?String(match.contenido_presentacion):"",presentacion:match.presentacion||"Paquete"});
    }else{
      setCompra({...compra,insumo_id:"",esNuevo:true,cantidadPaquetes:"1",contenidoValorNuevo:""});
    }
    setPasoCompra(1);
  };
  const insumoExistente=insumos.find(i=>i.id===compra.insumo_id);
  const presentacionFinal=compra.presentacion==="Otro"?(compra.presentacionOtro.trim()||"Presentación"):compra.presentacion;
  const insumoSel=compra.esNuevo?{id:null,nombre:compra.nombre.trim(),unidad:compra.tipoMedida,presentacion:presentacionFinal,precio_compra:0}:insumoExistente;
  const registrarCompra=async()=>{
    if(!compra.nombre.trim()||!cantCompra||!(totalCompra>0))return;
    const cant=cantCompra;const precio=precioUnitCalc;
    let insumoId=compra.insumo_id;
    if(compra.esNuevo){
      const{data:nuevo,error}=await sb.from("insumos").insert({nombre:compra.nombre.trim(),unidad:compra.tipoMedida,presentacion:presentacionFinal,contenido_presentacion:contenidoPorUnidad||null,stock_actual:0,stock_minimo:1,precio_compra:0,user_id:userId}).select().single();
      if(error||!nuevo)return;
      insumoId=nuevo.id;
    }
    const ins=insumos.find(i=>i.id===insumoId);
    const stockPrevio=ins?Number(ins.stock_actual):0;
   await sb.from("insumos").update({stock_actual:stockPrevio+cant,precio_compra:precio||(ins?.precio_compra||0),contenido_presentacion:Number(compra.esNuevo?contenidoPorUnidad:compra.contenidoUnitario)||ins?.contenido_presentacion}).eq("id",insumoId);
    await sb.from("compras").insert({user_id:userId,insumo_id:insumoId,cantidad:cant,precio_unitario:precio,proveedor:compra.proveedor.trim()||null});
    resetCompra();setOpenC(false);reload();
  };
  const borrarCompra=async c=>{
    const nombreIns=insumos.find(i=>i.id===c.insumo_id)?.nombre||"este insumo";
    if(!confirm(`¿Borrar esta compra de ${nombreIns}? Se le va a restar del stock y se va a recalcular el precio.`))return;
    await sb.rpc("ajustar_stock",{p_insumo_id:c.insumo_id,p_delta:-Number(c.cantidad)});
    await sb.from("compras").delete().eq("id",c.id);
    const restantes=compras.filter(x=>x.id!==c.id&&x.insumo_id===c.insumo_id).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    const nuevoPrecio=restantes.length?Number(restantes[0].precio_unitario):0;
    await sb.from("insumos").update({precio_compra:nuevoPrecio}).eq("id",c.insumo_id);
    reload();
  };
  return(
    <div>
      <div className="card" style={{padding:"12px 16px",marginBottom:16,background:"var(--surface-2)",border:"none"}}>
        <span style={{fontSize:14.5,color:"var(--ink-soft)"}}>🛒 Acá registrás cada compra que hacés para el negocio. Elegís qué compraste, cuánto contenía y cuánto pagaste en total — la app calcula sola el precio por unidad y suma al Stock.</span>
      </div>
      <button className="bp" style={{background:"var(--accent)",marginBottom:16}} onClick={()=>{setOpenC(!openC);setPasoCompra(0);}}>📥 Registrar compra</button>
      {openC&&(()=>{
        return(
        <div className="card" style={{padding:20,marginBottom:16,borderColor:"var(--accent)"}}>
          <div style={{fontWeight:700,color:"var(--accent)",marginBottom:4}}>📥 Registrar nueva compra</div>
          <div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:18}}>Paso {pasoCompra+1} de 3</div>

          {pasoCompra===0&&<div>
            <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>¿Qué compraste?</div>
            <input className="field" style={{fontSize:16,padding:14}} autoFocus list="lista-insumos" value={compra.nombre} onChange={e=>setCompra({...compra,nombre:e.target.value})} placeholder="ej: Carne molida" onKeyDown={e=>e.key==="Enter"&&confirmarProducto()}/>
            <datalist id="lista-insumos">{insumos.map(i=><option key={i.id} value={i.nombre}/>)}</datalist>
            <div style={{fontSize:13,color:"var(--ink-soft)",marginTop:6}}>Si ya lo comprás siempre, empezá a escribir y elegí de la lista. Si es la primera vez, escribí el nombre y listo — la app lo agrega sola.</div>
            <button className="bp" style={{background:"var(--accent)",width:"100%",marginTop:16,padding:14}} disabled={!compra.nombre.trim()} onClick={confirmarProducto}>Siguiente →</button>
          </div>}

          {pasoCompra===1&&<div>
            <div style={{fontSize:17,fontWeight:700,marginBottom:4}}>{compra.esNuevo?`${compra.nombre.trim()} es nuevo — contanos cómo es`:`¿Cuánto compraste de ${insumoSel?.nombre}?`}</div>
            {compra.esNuevo&&<div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:14}}>Es la primera vez que lo comprás, así que necesitamos un par de datos más para poder calcular todo solo de acá en adelante.</div>}
            {compra.esNuevo&&<div style={{marginBottom:16}}>
              <label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>¿Cómo se mide para las recetas?</label>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
                <button type="button" className={compra.tipoMedida==="gramos"?"bp":"bg"} style={{fontSize:13.5,padding:"8px 12px"}} onClick={()=>setCompra({...compra,tipoMedida:"gramos",unidadEntrada:"kg"})}>⚖️ Se pesa (gramos)</button>
                <button type="button" className={compra.tipoMedida==="mililitros"?"bp":"bg"} style={{fontSize:13.5,padding:"8px 12px"}} onClick={()=>setCompra({...compra,tipoMedida:"mililitros",unidadEntrada:"litro"})}>💧 Es líquido (ml)</button>
                <button type="button" className={compra.tipoMedida==="unidad"?"bp":"bg"} style={{fontSize:13.5,padding:"8px 12px"}} onClick={()=>setCompra({...compra,tipoMedida:"unidad",unidadEntrada:"unidad"})}>🔢 Se cuenta (unidad)</button>
              </div>
            </div>}
            <div style={{marginBottom:compra.esNuevo?16:0}}>
              <label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>¿En qué venía?</label>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>
                <select className="field" style={{width:120}} value={compra.presentacion} onChange={e=>setCompra({...compra,presentacion:e.target.value})}>
                  {PRESENTACIONES.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
                {compra.presentacion==="Otro"&&<input className="field" style={{width:120}} value={compra.presentacionOtro} onChange={e=>setCompra({...compra,presentacionOtro:e.target.value})} placeholder="ej: Tambor"/>}
              </div>
            </div>
            {!compra.esNuevo&&<div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:14}}>{insumoSel?.presentacion&&insumoSel?.contenido_presentacion?`La última vez cargaste ${insumoSel.presentacion} de ${formatCantidad(insumoSel.contenido_presentacion,insumoSel.unidad)} — corregí si esta vez es distinto.`:`Decinos cuántos ${insumoSel?.presentacion||"paquetes"} compraste y cuánto trae cada uno.`}</div>}
            <div style={{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}}>
              <div style={{flex:"1 1 100px"}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Cantidad de {presentacionFinal.toLowerCase()}</label><input className="field" inputMode="decimal" style={{fontSize:18,padding:12,textAlign:"center"}} value={compra.cantidadPaquetes} onChange={e=>setCompra({...compra,cantidadPaquetes:num(e.target.value)})} placeholder="ej: 1"/></div>
              {compra.esNuevo?(
                <div style={{flex:"1 1 140px"}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Cuánto trae cada uno</label>
                  <div style={{display:"flex",gap:6}}>
                    <input className="field" inputMode="decimal" style={{fontSize:18,padding:12,textAlign:"center"}} value={compra.contenidoValorNuevo} onChange={e=>setCompra({...compra,contenidoValorNuevo:num(e.target.value)})} placeholder="ej: 8"/>
                    {compra.tipoMedida==="gramos"&&<select className="field" style={{width:90}} value={compra.unidadEntrada} onChange={e=>setCompra({...compra,unidadEntrada:e.target.value})}><option value="kg">kilos</option><option value="g">gramos</option></select>}
                    {compra.tipoMedida==="mililitros"&&<select className="field" style={{width:90}} value={compra.unidadEntrada} onChange={e=>setCompra({...compra,unidadEntrada:e.target.value})}><option value="litro">litros</option><option value="ml">ml</option></select>}
                    {compra.tipoMedida==="unidad"&&<span style={{fontSize:14.5,color:"var(--ink-soft)",alignSelf:"center"}}>unidades</span>}
                  </div>
                </div>
              ):(
                <div style={{flex:"1 1 140px"}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Cuánto trae cada uno ({insumoSel?.unidad})</label><input className="field" inputMode="decimal" style={{fontSize:18,padding:12,textAlign:"center"}} value={compra.contenidoUnitario} onChange={e=>setCompra({...compra,contenidoUnitario:num(e.target.value)})} placeholder="ej: 3000"/></div>
              )}
            </div>
            {cantCompra>0&&<div style={{textAlign:"center",fontSize:14.5,color:"var(--accent)",fontWeight:700,marginTop:10}}>= {formatCantidad(cantCompra,insumoSel?.unidad)} en total</div>}
            <div style={{display:"flex",gap:10,marginTop:16}}>
              <button className="bg" style={{padding:14}} onClick={()=>setPasoCompra(0)}>← Atrás</button>
              <button className="bp" style={{background:"var(--accent)",flex:1,padding:14}} disabled={!cantCompra} onClick={()=>setPasoCompra(2)}>Siguiente →</button>
            </div>
          </div>}

          {pasoCompra===2&&<div>
            <div style={{fontSize:17,fontWeight:700,marginBottom:4}}>¿Cuánto pagaste en total?</div>
            <div style={{fontSize:13.5,color:"var(--ink-soft)",marginBottom:14}}>El precio de todo lo que compraste junto, no de una sola unidad.</div>
            <div style={{fontSize:20,fontWeight:700,color:"var(--ink-soft)",display:"inline"}}>$ </div>
            <CampoMonto style={{fontSize:20,padding:14,textAlign:"center"}} autoFocus value={compra.precio_total} onChange={v=>setCompra({...compra,precio_total:v})} placeholder="ej: 9000"/>
            <div style={{marginTop:14}}><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Proveedor (opcional)</label><input className="field" value={compra.proveedor} onChange={e=>setCompra({...compra,proveedor:e.target.value})} placeholder="ej: Distribuidora Sur"/></div>
            <div style={{display:"flex",gap:10,marginTop:16}}>
              <button className="bg" style={{padding:14}} onClick={()=>setPasoCompra(1)}>← Atrás</button>
              <button className="bp" style={{background:"var(--accent)",flex:1,padding:14}} disabled={!totalCompra} onClick={()=>setPasoCompra(3)}>Siguiente →</button>
            </div>
          </div>}

          {pasoCompra===3&&(()=>{
            const precioAnterior=Number(insumoSel?.precio_compra)||0;
            const huboPrecioAntes=precioAnterior>0;
            const pctCambio=huboPrecioAntes?Math.round(((precioUnitCalc-precioAnterior)/precioAnterior)*100):0;
            const subioMucho=huboPrecioAntes&&pctCambio>=UMBRAL_AUMENTO;
            const afectados=subioMucho?productosAfectados(insumoSel.id):[];
            return(
            <div>
              <div style={{fontSize:17,fontWeight:700,marginBottom:14}}>Listo, confirmá:</div>
              <div className="card" style={{padding:16,background:"var(--surface-2)",marginBottom:16}}>
                <div style={{fontSize:15,marginBottom:6}}>{insumoSel?.nombre} · {formatCantidad(cantCompra,insumoSel?.unidad)} · {money(totalCompra)} en total{compra.proveedor?` · ${compra.proveedor}`:""}</div>
                <div style={{fontSize:19,fontWeight:800,color:"var(--accent)"}}>= {money(precioUnitCalc)} por {insumoSel?.unidad==="gramos"?"gramo":insumoSel?.unidad==="mililitros"?"ml":"unidad"}</div>
                {huboPrecioAntes&&<div style={{fontSize:14,color:"var(--ink-soft)",marginTop:6}}>Antes pagabas {money(precioAnterior)} por {insumoSel?.unidad==="gramos"?"gramo":insumoSel?.unidad==="mililitros"?"ml":"unidad"} {pctCambio!==0&&<span style={{fontWeight:700,color:pctCambio>0?"var(--warn)":"var(--accent)"}}>({pctCambio>0?"+":""}{pctCambio}%)</span>}</div>}
              </div>
              {subioMucho&&<div className="card" style={{padding:16,marginBottom:16,background:"var(--warn-tint)",border:"1px solid var(--warn)"}}>
                <div style={{fontWeight:800,color:"var(--warn)",marginBottom:8}}>⚠ El precio subió {pctCambio}% respecto a la última compra</div>
                {afectados.length>0?(
                  <>
                    <div style={{fontSize:14,color:"var(--warn)",marginBottom:6}}>Esto va a afectar el costo de {afectados.length} producto{afectados.length!==1?"s":""} del menú:</div>
                    {afectados.map(m=><div key={m.id} style={{fontSize:14.5,padding:"3px 0"}}>• {m.nombre}</div>)}
                  </>
                ):<div style={{fontSize:14,color:"var(--warn)"}}>Todavía no usás este insumo en ninguna receta del menú.</div>}
              </div>}
              <div style={{display:"flex",gap:10}}>
                <button className="bg" style={{padding:14}} onClick={()=>setPasoCompra(2)}>← Atrás</button>
                <button className="bp" style={{background:"var(--accent)",flex:1,padding:14}} onClick={()=>{registrarCompra();setPasoCompra(0);}}>✅ Confirmar y guardar</button>
              </div>
            </div>
            );})()}
        </div>
        );})()}
      <div style={{fontSize:21,fontWeight:800,color:"var(--ink-soft)",margin:"10px 0 12px"}}>HISTORIAL DE COMPRAS</div>
      {!compras.length&&<div style={{color:"var(--ink-soft)",fontSize:15}}>Todavía no registraste ninguna compra.</div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:12}}>
        {compras.map(c=>{const ins=insumos.find(ii=>ii.id===c.insumo_id);return(
          <div key={c.id} className="card" style={{padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <div style={{fontWeight:700,fontSize:15}}>{ins?.nombre||"Insumo eliminado"}</div>
              <div style={{fontWeight:700,color:"var(--primary-dark)",whiteSpace:"nowrap"}}>{money(c.cantidad*c.precio_unitario)}</div>
            </div>
            <div style={{fontSize:14,color:"var(--ink-soft)",marginTop:2}}>{c.fecha} · {formatCantidad(c.cantidad,ins?.unidad)}{c.proveedor?` · ${c.proveedor}`:""}</div>
            <button className="bg" style={{fontSize:13,padding:"4px 8px",marginTop:8}} onClick={()=>borrarCompra(c)}>🗑 Borrar</button>
          </div>
        );})}
      </div>
      {compras.length>0&&(()=>{
        const porDia={};
        compras.forEach(c=>{porDia[c.fecha]=(porDia[c.fecha]||0)+c.cantidad*c.precio_unitario;});
        const dias=Object.entries(porDia).sort((a,b)=>a[0]<b[0]?1:-1);
        return(
          <div style={{marginTop:22}}>
            <div style={{fontSize:18,fontWeight:800,color:"var(--ink-soft)",marginBottom:10}}>TOTAL GASTADO POR DÍA</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:10}}>
              {dias.map(([fecha,total])=>(
                <div key={fecha} className="card" style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:14.5,color:"var(--ink-soft)"}}>{fecha}</span>
                  <span style={{fontWeight:700,color:"var(--primary-dark)"}}>{money(total)}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function PanelStock({userId,insumos,reload}){
  const num=v=>v.replace(",",".").replace(/[^0-9.]/g,"");
  const PRESENTACIONES=["Paquete","Botella","Bolsa","Caja","Docena","Otro"];
  const[form,setForm]=useState({nombre:"",tipoMedida:"gramos",unidadEntrada:"kg",presentacion:"Paquete",presentacionOtro:"",contenidoValor:"",stock_minimo:"1"});
  const[open,setOpen]=useState(false);
  const[busqueda,setBusqueda]=useState("");
  const insumosFiltrados=insumos.filter(i=>i.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const factorEntrada=f=>f.tipoMedida==="gramos"?(f.unidadEntrada==="kg"?1000:1):f.tipoMedida==="mililitros"?(f.unidadEntrada==="litro"?1000:1):1;
  const elegirMedida=tipoMedida=>setForm({...form,tipoMedida,unidadEntrada:tipoMedida==="gramos"?"kg":tipoMedida==="mililitros"?"litro":"unidad"});
  const add=async()=>{
    if(!form.nombre)return;
    const contenidoBase=(Number(form.contenidoValor)||0)*factorEntrada(form);
    const presentacionFinal=form.presentacion==="Otro"?(form.presentacionOtro.trim()||"Presentación"):form.presentacion;
    await sb.from("insumos").insert({nombre:form.nombre,unidad:form.tipoMedida,presentacion:presentacionFinal,contenido_presentacion:contenidoBase||null,stock_actual:0,stock_minimo:Number(form.stock_minimo)||1,precio_compra:0,user_id:userId});
    setForm({nombre:"",tipoMedida:"gramos",unidadEntrada:"kg",presentacion:"Paquete",presentacionOtro:"",contenidoValor:"",stock_minimo:"1"});setOpen(false);reload();
  };
  const del=async id=>{
    if(!confirm("¿Eliminar este insumo?"))return;
    const{error}=await sb.from("insumos").delete().eq("id",id);
    if(error){
      if(confirm("Este insumo está usado en la receta de uno o más platos/bebidas, por eso no se puede borrar directo. ¿Querés borrarlo igual? (se va a sacar también de esas recetas)")){
        await sb.from("recetas").delete().eq("insumo_id",id);
        const{error:error2}=await sb.from("insumos").delete().eq("id",id);
        if(error2){alert("No se pudo borrar: "+error2.message);return;}
      }else return;
    }
    reload();
  };
  const[editId,setEditId]=useState(null);
  const[editForm,setEditForm]=useState({});
  const[corregirPrecio,setCorregirPrecio]=useState(false);
  const abrirEdicion=i=>{setEditId(i.id);setCorregirPrecio(false);setEditForm({nombre:i.nombre,unidad:i.unidad,presentacion:i.presentacion||"Paquete",contenidoPresentacion:i.contenido_presentacion!=null?String(i.contenido_presentacion):"",stock_actual:String(i.stock_actual),stock_minimo:String(i.stock_minimo),contenidoPaquete:"1",precioPaquete:String(i.precio_compra)});};
  const guardarEdicion=async()=>{
    const contenido=Number(editForm.contenidoPaquete)||1;
    const precioNuevo=(Number(editForm.precioPaquete)||0)/contenido;
    await sb.from("insumos").update({nombre:editForm.nombre,unidad:editForm.unidad,presentacion:editForm.presentacion,contenido_presentacion:editForm.contenidoPresentacion?Number(editForm.contenidoPresentacion):null,stock_actual:Number(editForm.stock_actual)||0,stock_minimo:Number(editForm.stock_minimo)||1,precio_compra:precioNuevo}).eq("id",editId);
    setEditId(null);reload();
  };
  const bajos=insumos.filter(i=>i.stock_actual<=i.stock_minimo);
  return(
    <div>

            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:6}}>

              <button type="button" className={form.tipoMedida==="mililitros"?"bp":"bg"} style={{fontSize:13.5,padding:"8px 12px"}} onClick={()=>elegirMedida("mililitros")}>💧 Es líquido (ml)</button>
              <button type="button" className={form.tipoMedida==="unidad"?"bp":"bg"} style={{fontSize:13.5,padding:"8px 12px"}} onClick={()=>elegirMedida("unidad")}>🔢 Se cuenta (unidad)</button>

            <div style={{display:"flex",gap:8,alignItems:"center",marginTop:6}}>

          <div><label style={{fontSize:14.5,fontWeight:700,color:"var(--ink-soft)"}}>Stock mínimo (en {etiquetaBase})</label><input className="field" type="number" style={{width:110}} value={form.stock_minimo} onChange={e=>setForm({...form,stock_minimo:e.target.value})}/><div style={{fontSize:12.5,color:"var(--ink-soft)"}}>Cuando baje de este número, la app avisa "stock bajo".</div></div>

        </div>
        );})()}
      {bajos.length>0&&<div className="card" style={{padding:14,marginBottom:16,background:"var(--warn-tint)",border:"1px solid var(--warn)"}}>
        <div style={{fontWeight:800,color:"var(--warn)",marginBottom:8}}>⚠ STOCK BAJO — Lista de recompra sugerida</div>
        {bajos.map(i=><div key={i.id} style={{fontSize:14.5,padding:"4px 0",borderTop:"1px solid rgba(199,154,46,0.2)"}}>• {i.nombre}: quedan {formatCantidad(i.stock_actual,i.unidad)} (mínimo: {formatCantidad(i.stock_minimo,i.unidad)})</div>)}
      </div>}
      <div className="card" style={{padding:"12px 16px",marginBottom:14,background:"var(--surface-2)",border:"none"}}>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))",gap:12}}>

            <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>¿Cómo se mide para las recetas?</label>

                <option value="mililitros">💧 Es líquido (mililitros)</option>

            <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Stock</label><input className="field" type="number" value={editForm.stock_actual} onChange={e=>setEditForm({...editForm,stock_actual:e.target.value})}/><div style={{fontSize:12.5,color:"var(--ink-soft)"}}>Cuánto tenés AHORA en el negocio, en {editForm.unidad}. ({formatCantidad(editForm.stock_actual,editForm.unidad)})</div></div>
            <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Mínimo</label><input className="field" type="number" value={editForm.stock_minimo} onChange={e=>setEditForm({...editForm,stock_minimo:e.target.value})}/><div style={{fontSize:12.5,color:"var(--ink-soft)"}}>Cuando el stock baje de este número, la app te avisa "stock bajo".</div></div>
            <div><label style={{fontSize:13.5,fontWeight:700,color:"var(--ink-soft)"}}>Precio de referencia</label>
              <div style={{fontSize:12.5,color:"var(--ink-soft)",marginBottom:6}}>Esto se actualiza solo cada vez que registrás una compra en 🛒 Compras.</div>
              {!corregirPrecio?(
                <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                  <div style={{fontSize:16,fontWeight:700,color:"var(--ink)"}}>{money(Number(editForm.precioPaquete)/(Number(editForm.contenidoPaquete)||1))} por {editForm.unidad==="gramos"?"gramo":editForm.unidad==="mililitros"?"ml":"unidad"}</div>
                  <button type="button" className="bg" style={{fontSize:13,padding:"6px 10px"}} onClick={()=>setCorregirPrecio(true)}>✏️ Corregir a mano</button>
                </div>
              ):(
                <div>
                  <div style={{display:"flex",gap:8,alignItems:"flex-end",flexWrap:"wrap"}}>
                    <div><label style={{fontSize:12.5,color:"var(--ink-soft)"}}>Contiene</label><input className="field" style={{width:90}} inputMode="decimal" value={editForm.contenidoPaquete} onChange={e=>setEditForm({...editForm,contenidoPaquete:num(e.target.value)})}/></div>
                    <div style={{fontSize:14,paddingBottom:9}}>{editForm.unidad||"unidad"} por</div>
                    <div><label style={{fontSize:12.5,color:"var(--ink-soft)"}}>Precio total</label><CampoMonto style={{width:110}} value={editForm.precioPaquete} onChange={v=>setEditForm({...editForm,precioPaquete:v})}/></div>
                  </div>
                  <div style={{fontSize:14,fontWeight:700,color:"var(--accent)",marginTop:6}}>= {money((Number(editForm.precioPaquete)||0)/(Number(editForm.contenidoPaquete)||1))} por {editForm.unidad||"unidad"}</div>
                  <button type="button" className="bg" style={{fontSize:13,padding:"5px 10px",marginTop:6}} onClick={()=>setCorregirPrecio(false)}>Listo</button>
                </div>
              )}
            </div>
            <div style={{display:"flex",gap:8}}><button className="bp" style={{flex:1}} onClick={guardarEdicion}>Guardar</button><button className="bg" onClick={()=>setEditId(null)}>Cancelar</button></div>
          </div>
        ):(
          <div key={i.id} className="card" style={{padding:16,display:"flex",flexDirection:"column",gap:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
              <div><div style={{fontWeight:700,fontSize:16}}>{i.nombre}</div><div style={{fontSize:14,color:"var(--ink-soft)"}}>{money(i.precio_compra)} por {i.unidad==="gramos"?"gramo":i.unidad==="mililitros"?"ml":"unidad"}{i.presentacion&&i.contenido_presentacion?` · ${i.presentacion} de ${formatCantidad(i.contenido_presentacion,i.unidad)}`:""}</div></div>
              <span className="tag" style={{background:i.stock_actual<0?"#F8D7DA":i.stock_actual<=i.stock_minimo?"var(--warn-tint)":"var(--accent-tint)",color:i.stock_actual<0?"#8B1E2B":i.stock_actual<=i.stock_minimo?"var(--warn)":"var(--accent)",whiteSpace:"nowrap"}}>{i.stock_actual<0?"⚠ Stock NEGATIVO":i.stock_actual<=i.stock_minimo?"Stock bajo":"OK"}</span>
            </div>
            <div style={{fontWeight:800,fontSize:20,fontFamily:"'Fraunces',serif",color:i.stock_actual<0?"#8B1E2B":i.stock_actual<=i.stock_minimo?"var(--warn)":"var(--ink)"}}>{formatCantidad(i.stock_actual,i.unidad)} disponibles<span style={{fontSize:13.5,fontWeight:600,color:"var(--ink-soft)",fontFamily:"'Manrope',sans-serif"}}> · mín: {formatCantidad(i.stock_minimo,i.unidad)}</span></div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",borderTop:"1px solid var(--line)",paddingTop:10}}>
              <button className="bg" style={{fontSize:13.5,padding:"6px 10px"}} onClick={()=>abrirEdicion(i)}>✏️ Editar</button>
              <button className="bg" style={{fontSize:13.5,padding:"6px 8px"}} onClick={()=>del(i.id)}>🗑</button>
            </div>
          </div>
        ))}
        {!insumos.length&&<div className="card" style={{padding:20,color:"var(--ink-soft)",fontSize:15}}>Todavía no cargaste insumos. Agregá los productos que comprás para el negocio.</div>}
        {insumos.length>0&&!insumosFiltrados.length&&<div className="card" style={{padding:20,color:"var(--ink-soft)",fontSize:15}}>No se encontró ningún insumo con ese nombre.</div>}
      </div>
    </div>
  );
}

function PanelCaja({userId,pedidos,items,cierres,menu,recetas,insumos,compras,gastos,ingresosExtra,reload}){
  const[metodo,setMetodo]=useState({});
  const[abierto,setAbierto]=useState(null);
  const[cierreAbierto,setCierreAbierto]=useState(null);
  const[detalleCierre,setDetalleCierre]=useState({});
  const CATEGORIAS_GASTO=["Alquiler","Servicios","Sueldos","Mantenimiento","Publicidad","Impuestos","Otros"];
  const[gastoForm,setGastoForm]=useState({categoria:"Alquiler",monto:"",metodo_pago:"efectivo",descripcion:""});
  const[openGasto,setOpenGasto]=useState(false);
  const agregarGasto=async()=>{
    if(!gastoForm.monto||Number(gastoForm.monto)<=0)return;
    await sb.from("gastos").insert({user_id:userId,categoria:gastoForm.categoria,monto:Number(gastoForm.monto),metodo_pago:gastoForm.metodo_pago,descripcion:gastoForm.descripcion.trim()||null});
    setGastoForm({categoria:"Alquiler",monto:"",metodo_pago:"efectivo",descripcion:""});setOpenGasto(false);reload();
  };
  const borrarGasto=async id=>{if(!confirm("¿Borrar este gasto?"))return;await sb.from("gastos").delete().eq("id",id);reload();};
  const[ingresoForm,setIngresoForm]=useState({monto:"",metodo_pago:"efectivo",descripcion:""});
  const[openIngreso,setOpenIngreso]=useState(false);
  const agregarIngreso=async()=>{
    if(!ingresoForm.monto||Number(ingresoForm.monto)<=0)return;
    await sb.from("ingresos_extra").insert({user_id:userId,monto:Number(ingresoForm.monto),metodo_pago:ingresoForm.metodo_pago,descripcion:ingresoForm.descripcion.trim()||null});
    setIngresoForm({monto:"",metodo_pago:"efectivo",descripcion:""});setOpenIngreso(false);reload();
  };
  const borrarIngreso=async id=>{if(!confirm("¿Borrar este ingreso?"))return;await sb.from("ingresos_extra").delete().eq("id",id);reload();};
  const gastosHoy=gastos.filter(g=>g.fecha===hoy());
  const ingresosExtraHoy=ingresosExtra.filter(i=>i.fecha===hoy());
  const comprasHoy=compras.filter(c=>c.fecha===hoy());
  const totalGastosHoy=gastosHoy.reduce((s,g)=>s+Number(g.monto),0);
  const totalIngresosExtraHoy=ingresosExtraHoy.reduce((s,i)=>s+Number(i.monto),0);
  const totalComprasHoy=comprasHoy.reduce((s,c)=>s+Number(c.cantidad)*Number(c.precio_unitario),0);
  const totalEgresosHoy=totalGastosHoy+totalComprasHoy;
  const cierreHoyCaja=cierres.find(c=>c.fecha===hoy());
  const ingresosVentasHoy=cierreHoyCaja?Number(cierreHoyCaja.total_general):0;
  const totalIngresosHoy=ingresosVentasHoy+totalIngresosExtraHoy;
  const porMedio=medio=>{
    const ventas=medio==="efectivo"?Number(cierreHoyCaja?.total_efectivo||0):medio==="tarjeta"?Number(cierreHoyCaja?.total_tarjeta||0):medio==="transferencia"?Number(cierreHoyCaja?.total_transferencia||0):0;
    const extra=ingresosExtraHoy.filter(i=>i.metodo_pago===medio).reduce((s,i)=>s+Number(i.monto),0);
    const egreso=gastosHoy.filter(g=>g.metodo_pago===medio).reduce((s,g)=>s+Number(g.monto),0);
    return{ingreso:ventas+extra,egreso};
  };
  const medios=["efectivo","tarjeta","transferencia","otro"];
  const costoItemVD=item=>costoProducto(item,recetas,insumos);
  const meses=[...new Set(cierres.map(c=>c.fecha.slice(0,7)))].sort((a,b)=>b<a?-1:1);
  const[mesSel,setMesSel]=useState(meses[0]||"");
  const[resumenMes,setResumenMes]=useState(null);
  const[cargandoMes,setCargandoMes]=useState(false);
  const cargarResumenMes=async(mes)=>{
    setMesSel(mes);setResumenMes(null);
    const cierresMes=cierres.filter(c=>c.fecha.slice(0,7)===mes);
    if(!cierresMes.length){setResumenMes({totalVendido:0,ef:0,tar:0,tr:0,mesas:0,costoTotal:0,margen:0,dias:0});return;}
    setCargandoMes(true);
    const totalVendido=cierresMes.reduce((s,c)=>s+Number(c.total_general),0);
    const ef=cierresMes.reduce((s,c)=>s+Number(c.total_efectivo),0);
    const tar=cierresMes.reduce((s,c)=>s+Number(c.total_tarjeta),0);
    const tr=cierresMes.reduce((s,c)=>s+Number(c.total_transferencia),0);
    const mesasCant=cierresMes.reduce((s,c)=>s+Number(c.cantidad_mesas),0);
    const cierreIds=cierresMes.map(c=>c.id);
    const{data:peds}=await sb.from("pedidos").select("*").in("cierre_id",cierreIds);
    let costoTotal=0;
    if(peds&&peds.length){
      const pedIds=peds.map(p=>p.id);
      const{data:its}=await sb.from("pedido_items").select("*").in("pedido_id",pedIds);
      (its||[]).forEach(i=>{
        const mi=menu.find(m=>m.id===i.menu_item_id);
        if(mi)costoTotal+=costoItemVD(mi)*i.cantidad;
      });
    }
    setResumenMes({totalVendido,ef,tar,tr,mesas:mesasCant,costoTotal:Math.round(costoTotal),margen:Math.round(totalVendido-costoTotal),dias:cierresMes.length});
    setCargandoMes(false);
  };
  useEffect(()=>{if(meses.length&&!resumenMes)cargarResumenMes(meses[0]);},[cierres.length]);
  const verDetalleCierre=async(c)=>{
    if(cierreAbierto===c.id){setCierreAbierto(null);return;}
    setCierreAbierto(c.id);
    if(detalleCierre[c.id])return;
    const{data:peds}=await sb.from("pedidos").select("*").eq("cierre_id",c.id);
    if(!peds||!peds.length){setDetalleCierre(prev=>({...prev,[c.id]:[]}));return;}
    const ids=peds.map(p=>p.id);
    const{data:its}=await sb.from("pedido_items").select("*").in("pedido_id",ids);
    const conItems=peds.map(p=>({...p,itemsP:(its||[]).filter(i=>i.pedido_id===p.id)}));
    setDetalleCierre(prev=>({...prev,[c.id]:conItems}));
  };
  const pedCerradosHoy=[];
  const[cerrandoCaja,setCerrandoCaja]=useState(false);
  const cerrarCaja=async()=>{
    if(cerrandoCaja)return;
    if(!confirm("¿Cerrar la caja del día?"))return;
    setCerrandoCaja(true);
    try{
      const ahora=new Date().toISOString();
      const hoyStr=hoy();
      const{data:sueltos}=await sb.from("pedidos").select("*").eq("user_id",userId).eq("estado","cerrada").is("cierre_id",null).gte("cerrado_at",hoyStr+"T00:00:00").lte("cerrado_at",hoyStr+"T23:59:59");
      let ef=0,tar=0,tr=0,mesasCant=0;
      const aCerrarAhora=[];
      for(const p of pedidos){
        const met=metodo[p.id]||"efectivo";
        const tot=items.filter(i=>i.pedido_id===p.id).reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
        if(met==="efectivo")ef+=tot;else if(met==="tarjeta")tar+=tot;else tr+=tot;
        mesasCant++;
        aCerrarAhora.push({id:p.id,mesa_id:p.mesa_id,tot,met});
      }
      (sueltos||[]).forEach(p=>{
        const tot=Number(p.total)||0;
        if(p.metodo_pago==="efectivo")ef+=tot;else if(p.metodo_pago==="tarjeta")tar+=tot;else tr+=tot;
        mesasCant++;
      });
      if(aCerrarAhora.length===0&&(!sueltos||!sueltos.length)){
         alert("No hay ninguna mesa para cerrar. La caja ya está al día.");
        return;
      }
      const total=ef+tar+tr;
      const{data:cierreNuevo}=await sb.from("cierres_caja").insert({user_id:userId,fecha:hoyStr,total_efectivo:ef,total_tarjeta:tar,total_transferencia:tr,total_general:total,cantidad_mesas:mesasCant}).select().single();
      for(const p of aCerrarAhora){
        await sb.from("pedidos").update({estado:"cerrada",total:p.tot,metodo_pago:p.met,cerrado_at:ahora,cierre_id:cierreNuevo.id}).eq("id",p.id);
        await sb.from("mesas").update({estado:"libre",mozo_id:null,mozo_nombre:null}).eq("id",p.mesa_id);
      }
      if(sueltos&&sueltos.length){
        await sb.from("pedidos").update({cierre_id:cierreNuevo.id}).in("id",sueltos.map(p=>p.id));
      }
      reload();
      alert(`Caja cerrada. Total: ${money(total)}\nEfectivo: ${money(ef)}\nTarjeta: ${money(tar)}\nTransferencia: ${money(tr)}`);
    }finally{
      setCerrandoCaja(false);
    }
  };
  const totalGeneral=pedidos.reduce((s,p)=>s+items.filter(i=>i.pedido_id===p.id).reduce((s2,i)=>s2+Number(i.precio)*i.cantidad,0),0);
  return(
    <div>
      <div className="card" style={{padding:18,marginBottom:22}}>
        <div style={{fontSize:21,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>BALANCE DE HOY</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:16,marginBottom:10}}>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>INGRESOS (ventas + otros)</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700,color:"var(--accent)"}}>{money(totalIngresosHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>EGRESOS (compras + gastos)</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700,color:"var(--primary)"}}>{money(totalEgresosHoy)}</div></div>
          <div><div style={{fontSize:13.5,color:"var(--ink-soft)",fontWeight:700}}>SALDO</div><div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:700,color:totalIngresosHoy-totalEgresosHoy<0?"var(--warn)":"var(--ink)"}}>{money(totalIngresosHoy-totalEgresosHoy)}</div></div>
        </div>
