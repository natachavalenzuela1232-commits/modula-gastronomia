<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MODULA Gastronomía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg:#FAF6F1;--surface:#FFF;--surface-2:#FBF3EC;
  --ink:#2B211B;--ink-soft:#75655A;
  --primary:#C1440E;--primary-dark:#8C2F08;--primary-tint:#FBE7DA;
  --accent:#2F7E68;--accent-tint:#E1F0EA;
  --warn:#C79A2E;--warn-tint:#FBF0D8;
  --line:#E9DED2;--shadow:0 1px 2px rgba(43,33,27,.05),0 4px 16px rgba(43,33,27,.07);
}
*{box-sizing:border-box}
html,body,#root{margin:0;padding:0;min-height:100%;background:var(--bg)}
body{font-family:'Manrope',sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.field{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;color:var(--ink)}
.field:focus{outline:2px solid var(--primary);outline-offset:1px}
.bp{background:var(--primary);color:#fff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;justify-content:center}
.bp:hover{background:var(--primary-dark)}
.bp:disabled{opacity:.55}
.bg{background:transparent;border:1px solid var(--line);color:var(--ink-soft);padding:8px 12px;border-radius:9px;font-weight:600;font-size:13px}
.bg:hover{background:var(--surface-2)}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.mesabtn{border-radius:14px;padding:18px 10px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
@media(max-width:760px){
  .app-shell{flex-direction:column}
  .sidebar{width:100%!important;flex-direction:row!important;overflow-x:auto;border-right:none!important;border-bottom:1px solid var(--line);padding:10px!important}
  .sidebar nav{flex-direction:row!important}
  .sidebar .tip{display:none}
  main{padding:16px!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef}=React;
const SUPABASE_URL="https://zibuxcbidjymrlvdsgse.supabase.co";
const SUPABASE_KEY="sb_publishable_9Wcf3GqvO8WQYQqAm5oGIQ_troL-Oav";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const money=n=>`$${Number(n||0).toLocaleString("es-AR")}`;
const hora=iso=>new Date(iso).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
const hoy=()=>new Date().toISOString().slice(0,10);

function Login(){
  const[mode,setMode]=useState("signin");
  const[email,setEmail]=useState("");
  const[pw,setPw]=useState("");
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState("");
  const submit=async()=>{
    setMsg("");setLoading(true);
    try{
      if(mode==="signin"){const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;}
      else{const{error}=await sb.auth.signUp({email,password:pw});if(error)throw error;setMsg("¡Cuenta creada! Ya podés iniciar sesión.");setMode("signin");}
    }catch(e){setMsg(e.message||"Error, probá de nuevo.");}
    finally{setLoading(false);}
  };
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div className="card" style={{width:"100%",maxWidth:380,padding:32}}>
        <div style={{textAlign:"center",marginBottom:26}}>
          <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:24,color:"var(--primary-dark)"}}>MODULA <span style={{color:"var(--primary)"}}>Gastronomía</span></div>
          <div style={{fontSize:12.5,color:"var(--ink-soft)",marginTop:4}}>{mode==="signin"?"Iniciá sesión con la cuenta de tu negocio":"Creá la cuenta de tu negocio"}</div>
        </div>
        <div style={{marginBottom:12}}><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Email</label><input className="field" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tunegocio@email.com"/></div>
        <div style={{marginBottom:18}}><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Contraseña</label><input className="field" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
        {msg&&<div style={{fontSize:12.5,color:"var(--primary)",marginBottom:14,lineHeight:1.4}}>{msg}</div>}
        <button className="bp" style={{width:"100%",padding:12}} onClick={submit} disabled={loading||!email||!pw}>{loading?"Un momento…":mode==="signin"?"Iniciar sesión":"Crear cuenta"}</button>
        <div style={{textAlign:"center",marginTop:16,fontSize:13}}>
          {mode==="signin"?<span style={{color:"var(--ink-soft)"}}>¿Primera vez? <a href="#" onClick={e=>{e.preventDefault();setMode("signup");setMsg("")}} style={{color:"var(--primary)",fontWeight:700}}>Creá la cuenta</a></span>:<span style={{color:"var(--ink-soft)"}}>¿Ya tenés? <a href="#" onClick={e=>{e.preventDefault();setMode("signin");setMsg("")}} style={{color:"var(--primary)",fontWeight:700}}>Iniciá sesión</a></span>}
        </div>
      </div>
    </div>
  );
}

function SelectorIdentidad({empleados,onElegir}){
  const[eli,setEli]=useState(null);
  const[pin,setPin]=useState("");
  const[err,setErr]=useState("");
  const confirmar=()=>{if(eli.pin!==pin.trim()){setErr("PIN incorrecto.");return;}onElegir({rol:eli.rol,id:eli.id,nombre:eli.nombre});};
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
      <div className="card" style={{width:"100%",maxWidth:420,padding:32}}>
        {!eli?(
          <React.Fragment>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:20,color:"var(--primary-dark)",textAlign:"center",marginBottom:22}}>¿Quién sos?</div>
            <button className="bp" style={{width:"100%",padding:14,marginBottom:10,fontSize:15}} onClick={()=>onElegir({rol:"dueño",id:null,nombre:"Dueño/a"})}>👑 Soy el dueño/a</button>
            {empleados.filter(e=>e.activo).map(e=>(
              <button key={e.id} className="bg" style={{width:"100%",padding:14,marginBottom:8,fontSize:14.5,textAlign:"left",display:"flex",alignItems:"center",gap:10}} onClick={()=>{setEli(e);setPin("");setErr("");}}>
                {e.rol==="mozo"?"🧑‍🍳":"👨‍🍳"} {e.nombre}<span style={{marginLeft:"auto",color:"var(--ink-soft)",fontSize:11.5,fontWeight:700}}>{e.rol==="mozo"?"MOZO":"COCINA"}</span>
              </button>
            ))}
            {!empleados.filter(e=>e.activo).length&&<div style={{fontSize:12.5,color:"var(--ink-soft)",textAlign:"center",marginTop:8}}>El dueño puede agregar empleados desde su panel.</div>}
          </React.Fragment>
        ):(
          <React.Fragment>
            <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:18,color:"var(--primary-dark)",textAlign:"center",marginBottom:16}}>Hola, {eli.nombre} — ingresá tu PIN</div>
            <input className="field" type="password" inputMode="numeric" value={pin} onChange={e=>setPin(e.target.value)} placeholder="PIN" style={{textAlign:"center",fontSize:20,letterSpacing:4,marginBottom:12}} onKeyDown={e=>e.key==="Enter"&&confirmar()} autoFocus/>
            {err&&<div style={{color:"var(--primary)",fontSize:12.5,textAlign:"center",marginBottom:10}}>{err}</div>}
            <button className="bp" style={{width:"100%",padding:12,marginBottom:8}} onClick={confirmar}>Entrar</button>
            <button className="bg" style={{width:"100%"}} onClick={()=>setEli(null)}>Volver</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function App(){
  const[session,setSession]=useState(undefined);
  const[identidad,setIdentidad]=useState(null);
  const[data,setData]=useState({empleados:[],mesas:[],menu:[],pedidos:[],items:[],insumos:[],recetas:[],cierres:[],compras:[]});
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session));
    const{data:l}=sb.auth.onAuthStateChange((_,s)=>setSession(s));
    return()=>l.subscription.unsubscribe();
  },[]);

  const loadAll=async()=>{
    setLoading(true);
    const[e,m,mn,p,it,ins,rec,ci,cp]=await Promise.all([
      sb.from("empleados").select("*").order("created_at"),
      sb.from("mesas").select("*").order("numero"),
      sb.from("menu_items").select("*").order("categoria"),
      sb.from("pedidos").select("*").eq("estado","abierta"),
      sb.from("pedido_items").select("*").order("created_at"),
      sb.from("insumos").select("*").order("nombre"),
      sb.from("recetas").select("*"),
      sb.from("cierres_caja").select("*").order("fecha",{ascending:false}).limit(30),
      sb.from("compras").select("*").order("created_at",{ascending:false}).limit(100),
    ]);
    setData({
      empleados:e.data||[],mesas:m.data||[],menu:mn.data||[],
      pedidos:p.data||[],items:it.data||[],insumos:ins.data||[],
      recetas:rec.data||[],cierres:ci.data||[],compras:cp.data||[],
    });
    setLoading(false);
  };

  useEffect(()=>{
    if(!session)return;
    loadAll();
    const saved=localStorage.getItem("modula_id");
    if(saved)try{setIdentidad(JSON.parse(saved));}catch{}
    const canal=sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"pedido_items"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"pedidos"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"mesas"},()=>loadAll()).on("postgres_changes",{event:"*",schema:"public",table:"insumos"},()=>loadAll()).subscribe();
    return()=>sb.removeChannel(canal);
  },[session]);

  const elegir=id=>{setIdentidad(id);localStorage.setItem("modula_id",JSON.stringify(id));};
  const cambiar=()=>{localStorage.removeItem("modula_id");setIdentidad(null);};
  const logout=async()=>{localStorage.removeItem("modula_id");await sb.auth.signOut();};

  if(session===undefined)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-soft)"}}>Cargando…</div>;
  if(!session)return<Login/>;
  if(loading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--ink-soft)"}}>Cargando el negocio…</div>;
  if(!identidad)return<SelectorIdentidad empleados={data.empleados} onElegir={elegir}/>;

  const props={userId:session.user.id,identidad,...data,reload:loadAll,cambiar,logout};
  if(identidad.rol==="dueño")return<VistaDueño {...props}/>;
  if(identidad.rol==="mozo")return<VistaMozo {...props}/>;
  if(identidad.rol==="cocina")return<VistaCocina {...props}/>;
  return null;
}

function TopBar({titulo,identidad,cambiar,logout}){
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px",background:"var(--surface)",borderBottom:"1px solid var(--line)"}}>
      <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)"}}>{titulo}</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:12.5,color:"var(--ink-soft)",fontWeight:600}}>{identidad.nombre}</span>
        <button className="bg" style={{padding:"6px 10px",fontSize:12}} onClick={cambiar}>Cambiar</button>
        <button className="bg" style={{padding:"6px 10px",fontSize:12}} onClick={logout}>Salir</button>
      </div>
    </div>
  );
}

// ---- VISTA MOZO ----
function VistaMozo({userId,identidad,mesas,menu,pedidos,items,reload,cambiar,logout}){
  const[mesaId,setMesaId]=useState(()=>localStorage.getItem("modula_mesa")||null);
  const[acl,setAcl]=useState("");
  useEffect(()=>{
    if(mesaId)localStorage.setItem("modula_mesa",mesaId);
    else localStorage.removeItem("modula_mesa");
  },[mesaId]);
  useEffect(()=>{
    if(mesaId&&mesas.length){
      const m=mesas.find(mm=>mm.id===mesaId);
      if(!m||m.estado!=="ocupada"||m.mozo_id!==identidad.id)setMesaId(null);
    }
  },[mesas]);
  const misMesas=mesas.filter(m=>m.estado==="libre"||m.mozo_id===identidad.id);
  const mesaSel=mesaId?mesas.find(m=>m.id===mesaId):null;
  const pedSel=mesaSel?pedidos.find(p=>p.mesa_id===mesaSel.id):null;
  const itemsMesa=pedSel?items.filter(i=>i.pedido_id===pedSel.id):[];
  const abrirMesa=async m=>{
    if(m.estado==="libre"){
      await sb.from("mesas").update({estado:"ocupada",mozo_id:identidad.id,mozo_nombre:identidad.nombre}).eq("id",m.id);
      await sb.from("pedidos").insert({user_id:userId,mesa_id:m.id,mesa_numero:m.numero,mozo_id:identidad.id,mozo_nombre:identidad.nombre,estado:"abierta"});
      await reload();
    }
    setMesaId(m.id);
  };
  const agregarItem=async mi=>{
    if(!pedSel)return;
    await sb.from("pedido_items").insert({user_id:userId,pedido_id:pedSel.id,mesa_numero:mesaSel.numero,menu_item_id:mi.id,nombre:mi.nombre,precio:mi.precio,aclaracion:acl.trim()||null,estado:"pendiente"});
    setAcl("");reload();
  };
  const borrarItem=async i=>{if(i.estado==="pendiente"){await sb.from("pedido_items").delete().eq("id",i.id);reload();}};
  const marcarEntregado=async i=>{await sb.from("pedido_items").update({estado:"entregado"}).eq("id",i.id);reload();};
  const cerrarMesa=async()=>{
    if(!confirm("¿Cerrar la mesa?"))return;
    const total=itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
    await sb.from("pedidos").update({estado:"cerrada",total,cerrado_at:new Date().toISOString()}).eq("id",pedSel.id);
    await sb.from("mesas").update({estado:"libre",mozo_id:null,mozo_nombre:null}).eq("id",mesaSel.id);
    setMesaId(null);reload();
  };
  const cats=[...new Set(menu.filter(m=>m.activo).map(m=>m.categoria))];
  if(mesaSel){
    const total=itemsMesa.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);
    return(
      <div>
        <TopBar titulo={`Mesa ${mesaSel.numero}`} identidad={identidad} cambiar={cambiar} logout={logout}/>
        <div style={{padding:18,maxWidth:640,margin:"0 auto"}}>
          <button className="bg" style={{marginBottom:14}} onClick={()=>setMesaId(null)}>← Volver</button>
          <div className="card" style={{padding:16,marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:800,color:"var(--ink-soft)",marginBottom:10}}>PEDIDO ACTUAL</div>
            {!itemsMesa.length&&<div style={{fontSize:13.5,color:"var(--ink-soft)"}}>Todavía no agregaste nada.</div>}
            {itemsMesa.map(i=>(
              <div key={i.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderTop:"1px solid var(--line)"}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13.5}}>{i.nombre}{i.aclaracion&&<span style={{fontWeight:500,color:"var(--ink-soft)"}}> — {i.aclaracion}</span>}</div>
                  <div style={{fontSize:11,color:"var(--ink-soft)"}}>{money(i.precio)} · {hora(i.created_at)}</div>
                </div>
                <span className="tag" style={{background:i.estado==="pendiente"?"var(--warn-tint)":i.estado==="listo"?"var(--accent-tint)":"var(--surface-2)",color:i.estado==="pendiente"?"var(--warn)":i.estado==="listo"?"var(--accent)":"var(--ink-soft)"}}>{i.estado==="pendiente"?"En cocina":i.estado==="listo"?"¡Listo!":"Entregado"}</span>
                {i.estado==="listo"&&<button className="bp" style={{padding:"6px 10px",fontSize:11.5}} onClick={()=>marcarEntregado(i)}>Entregar</button>}
                {i.estado==="pendiente"&&<button className="bg" style={{padding:"6px 8px",fontSize:11.5}} onClick={()=>borrarItem(i)}>✕</button>}
              </div>
            ))}
            {itemsMesa.length>0&&<div style={{textAlign:"right",fontWeight:800,marginTop:10,fontFamily:"'Fraunces',serif",fontSize:17,color:"var(--primary-dark)"}}>Total: {money(total)}</div>}
          </div>
          <div className="card" style={{padding:16,marginBottom:16}}>
            <input className="field" placeholder="Aclaración opcional: sin sal, para llevar…" value={acl} onChange={e=>setAcl(e.target.value)} style={{marginBottom:14}}/>
            {cats.map(cat=>(
              <div key={cat} style={{marginBottom:14}}>
                <div style={{fontSize:11.5,fontWeight:800,color:"var(--primary)",marginBottom:8}}>{cat.toUpperCase()}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8}}>
                  {menu.filter(m=>m.categoria===cat&&m.activo).map(m=>(
                    <button key={m.id} className="bg" style={{padding:"12px 8px",textAlign:"center",fontWeight:700}} onClick={()=>agregarItem(m)}>
                      {m.nombre}<div style={{fontWeight:600,fontSize:11.5,color:"var(--ink-soft)",marginTop:3}}>{money(m.precio)}</div>
                    </button>
                  ))}
                </div>
              </div>
            ))}
            {!menu.length&&<div style={{fontSize:13,color:"var(--ink-soft)"}}>El dueño todavía no cargó el menú.</div>}
          </div>
          <button className="bp" style={{width:"100%",padding:14}} onClick={cerrarMesa} disabled={!itemsMesa.length}>Cerrar mesa y pedir la cuenta</button>
        </div>
      </div>
    );
  }
  return(
    <div>
      <TopBar titulo="Mis mesas" identidad={identidad} cambiar={cambiar} logout={logout}/>
      <div style={{padding:18,maxWidth:640,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(100px,1fr))",gap:12}}>
          {misMesas.map(m=>(
            <button key={m.id} className="mesabtn" style={{borderColor:m.estado==="ocupada"?"var(--primary)":"var(--line)",background:m.estado==="ocupada"?"var(--primary-tint)":"var(--surface)",color:m.estado==="ocupada"?"var(--primary-dark)":"var(--ink)"}} onClick={()=>abrirMesa(m)}>
              Mesa {m.numero}
              <span className="tag" style={{background:m.estado==="ocupada"?"var(--primary)":"var(--accent-tint)",color:m.estado==="ocupada"?"white":"var(--accent)"}}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
            </button>
          ))}
        </div>
        {!mesas.length&&<div style={{color:"var(--ink-soft)",fontSize:14,marginTop:20}}>El dueño todavía no cargó las mesas.</div>}
      </div>
    </div>
  );
}

// ---- VISTA COCINA ----
function VistaCocina({identidad,items,cambiar,logout,reload}){
  const pend=items.filter(i=>i.estado==="pendiente"||i.estado==="listo").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const porMesa={};pend.forEach(i=>{(porMesa[i.mesa_numero]=porMesa[i.mesa_numero]||[]).push(i);});
  const marcarListo=async i=>{await sb.from("pedido_items").update({estado:"listo"}).eq("id",i.id);reload();};
  return(
    <div>
      <TopBar titulo="👨‍🍳 Cocina" identidad={identidad} cambiar={cambiar} logout={logout}/>
      <div style={{padding:18}}>
        {!Object.keys(porMesa).length&&<div style={{color:"var(--ink-soft)",fontSize:15,textAlign:"center",marginTop:60}}>No hay pedidos pendientes. 🎉</div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
          {Object.entries(porMesa).map(([mesa,its])=>(
            <div key={mesa} className="card" style={{padding:16}}>
              <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)",marginBottom:10}}>Mesa {mesa}</div>
              {its.map(i=>(
                <div key={i.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderTop:"1px solid var(--line)"}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:14.5}}>{i.nombre}</div>
                    {i.aclaracion&&<div style={{fontSize:12,color:"var(--primary)",fontWeight:700}}>⚠ {i.aclaracion}</div>}
                    <div style={{fontSize:11,color:"var(--ink-soft)"}}>{hora(i.created_at)}</div>
                  </div>
                  {i.estado==="pendiente"?<button className="bp" style={{fontSize:12,padding:"7px 12px"}} onClick={()=>marcarListo(i)}>Marcar listo</button>:<span className="tag" style={{background:"var(--accent-tint)",color:"var(--accent)"}}>Listo, esperando mozo</span>}
                </div>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ---- VISTA DUEÑO ----
function VistaDueño({userId,identidad,empleados,mesas,menu,pedidos,items,insumos,recetas,cierres,compras,reload,cambiar,logout}){
  const[tab,setTabRaw]=useState(()=>localStorage.getItem("modula_tab")||"mesas");
  const setTab=t=>{setTabRaw(t);localStorage.setItem("modula_tab",t);};
  const NAV=[{id:"mesas",label:"Mesas",icon:"🍽️"},{id:"empleados",label:"Empleados",icon:"👥"},{id:"menu",label:"Menú",icon:"📋"},{id:"stock",label:"Stock",icon:"📦"},{id:"caja",label:"Caja",icon:"💰"}];
  const totalHoy=pedidos.reduce((s,p)=>{const its=items.filter(i=>i.pedido_id===p.id);return s+its.reduce((s2,i)=>s2+Number(i.precio)*i.cantidad,0);},0);
  const stockBajo=insumos.filter(i=>i.stock_actual<=i.stock_minimo);
  return(
    <div className="app-shell" style={{display:"flex",minHeight:"100vh"}}>
      <aside className="sidebar" style={{width:220,flexShrink:0,borderRight:"1px solid var(--line)",padding:"22px 14px",display:"flex",flexDirection:"column",gap:18,background:"var(--surface)"}}>
        <div style={{fontFamily:"'Fraunces',serif",fontWeight:700,fontSize:17,color:"var(--primary-dark)",padding:"0 8px 14px",borderBottom:"1px solid var(--line)"}}>MODULA <span style={{color:"var(--primary)"}}>Gastro</span></div>
        <nav style={{display:"flex",flexDirection:"column",gap:4}}>
          {NAV.map(n=>(
            <button key={n.id} onClick={()=>setTab(n.id)} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"11px 14px",borderRadius:10,border:"none",background:tab===n.id?"var(--primary)":"transparent",color:tab===n.id?"white":"var(--ink-soft)",fontSize:14,fontWeight:700,textAlign:"left",position:"relative"}}>
              {n.icon} {n.label}
              {n.id==="stock"&&stockBajo.length>0&&<span style={{marginLeft:"auto",background:"var(--warn)",color:"white",borderRadius:"999px",fontSize:11,padding:"1px 7px",fontWeight:800}}>{stockBajo.length}</span>}
            </button>
          ))}
        </nav>
        <div style={{marginTop:"auto",display:"flex",flexDirection:"column",gap:8}}>
          <button className="bg" onClick={cambiar}>Cambiar usuario</button>
          <button className="bg" onClick={logout}>Cerrar sesión</button>
        </div>
      </aside>
      <main style={{flex:1,padding:"26px 32px",maxWidth:1000}}>
        <div className="card" style={{padding:"16px 20px",marginBottom:22,background:"var(--primary-tint)",border:"none",display:"flex",flexWrap:"wrap",gap:24}}>
          <div><div style={{fontSize:11.5,fontWeight:800,color:"var(--primary-dark)"}}>VENTA DE HOY</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--primary-dark)"}}>{money(totalHoy)}</div></div>
          <div><div style={{fontSize:11.5,fontWeight:800,color:"var(--primary-dark)"}}>MESAS OCUPADAS</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--primary-dark)"}}>{mesas.filter(m=>m.estado==="ocupada").length} / {mesas.length}</div></div>
          {stockBajo.length>0&&<div><div style={{fontSize:11.5,fontWeight:800,color:"var(--warn)"}}>⚠ STOCK BAJO</div><div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,color:"var(--warn)"}}>{stockBajo.length} insumo{stockBajo.length!==1?"s":""}</div></div>}
        </div>
        {tab==="mesas"&&<PanelMesas userId={userId} mesas={mesas} pedidos={pedidos} items={items} reload={reload}/>}
        {tab==="empleados"&&<PanelEmpleados userId={userId} empleados={empleados} reload={reload}/>}
        {tab==="menu"&&<PanelMenu userId={userId} menu={menu} insumos={insumos} recetas={recetas} reload={reload}/>}
        {tab==="stock"&&<PanelStock userId={userId} insumos={insumos} compras={compras} reload={reload}/>}
        {tab==="caja"&&<PanelCaja userId={userId} pedidos={pedidos} items={items} cierres={cierres} reload={reload}/>}
      </main>
    </div>
  );
}

function PanelMesas({userId,mesas,pedidos,items,reload}){
  const[cant,setCant]=useState("");
  const crear=async()=>{const n=parseInt(cant);if(!n||n<1)return;const ex=mesas.length;const nv=Array.from({length:n},(_,i)=>({user_id:userId,numero:ex+i+1}));await sb.from("mesas").insert(nv);setCant("");reload();};
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:18,alignItems:"flex-end"}}>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Agregar mesas</label><input className="field" type="number" style={{width:100}} value={cant} onChange={e=>setCant(e.target.value)} placeholder="cant."/></div>
        <button className="bp" onClick={crear}>Agregar</button>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:12}}>
        {mesas.map(m=>{const ped=pedidos.find(p=>p.mesa_id===m.id);const its=ped?items.filter(i=>i.pedido_id===ped.id):[];const tot=its.reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);return(
          <div key={m.id} className="card" style={{padding:14,borderColor:m.estado==="ocupada"?"var(--primary)":"var(--line)"}}>
            <div style={{fontWeight:800,fontSize:15}}>Mesa {m.numero}</div>
            <span className="tag" style={{background:m.estado==="ocupada"?"var(--primary-tint)":"var(--accent-tint)",color:m.estado==="ocupada"?"var(--primary-dark)":"var(--accent)"}}>{m.estado==="ocupada"?"Ocupada":"Libre"}</span>
            {m.estado==="ocupada"&&<div style={{fontSize:12,color:"var(--ink-soft)",marginTop:8}}>Mozo: {m.mozo_nombre}<br/>Total: {money(tot)}</div>}
          </div>
        );})}
        {!mesas.length&&<div style={{color:"var(--ink-soft)",fontSize:14}}>Todavía no cargaste mesas.</div>}
      </div>
    </div>
  );
}

function PanelEmpleados({userId,empleados,reload}){
  const[form,setForm]=useState({nombre:"",rol:"mozo",pin:""});
  const[open,setOpen]=useState(false);
  const add=async()=>{if(!form.nombre||!form.pin)return;await sb.from("empleados").insert({...form,user_id:userId});setForm({nombre:"",rol:"mozo",pin:""});setOpen(false);reload();};
  const toggle=async e=>{await sb.from("empleados").update({activo:!e.activo}).eq("id",e.id);reload();};
  const del=async id=>{if(confirm("¿Eliminar este empleado?")){{await sb.from("empleados").delete().eq("id",id);reload();}}};
  const[editId,setEditId]=useState(null);
  const[editForm,setEditForm]=useState({});
  const abrirEdicion=e=>{setEditId(e.id);setEditForm({nombre:e.nombre,rol:e.rol,pin:e.pin});};
  const guardarEdicion=async()=>{await sb.from("empleados").update(editForm).eq("id",editId);setEditId(null);reload();};
  return(
    <div>
      <button className="bp" style={{marginBottom:16}} onClick={()=>setOpen(!open)}>➕ Nuevo empleado</button>
      {open&&<div className="card" style={{padding:16,marginBottom:16,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{flex:"1 1 160px"}}><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Nombre</label><input className="field" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})}/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Rol</label><select className="field" value={form.rol} onChange={e=>setForm({...form,rol:e.target.value})}><option value="mozo">Mozo</option><option value="cocina">Cocina</option></select></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>PIN</label><input className="field" style={{width:100}} value={form.pin} onChange={e=>setForm({...form,pin:e.target.value.replace(/\D/g,"")})} placeholder="1234"/></div>
        <button className="bp" onClick={add}>Guardar</button>
      </div>}
      <div className="card" style={{overflow:"hidden"}}>
        {empleados.map((e,i)=>editId===e.id?(
          <div key={e.id} style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",padding:"14px 16px",borderTop:i?"1px solid var(--line)":"none",background:"var(--surface-2)"}}>
            <div style={{flex:"1 1 140px"}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Nombre</label><input className="field" value={editForm.nombre} onChange={ev=>setEditForm({...editForm,nombre:ev.target.value})}/></div>
            <div><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Rol</label><select className="field" value={editForm.rol} onChange={ev=>setEditForm({...editForm,rol:ev.target.value})}><option value="mozo">Mozo</option><option value="cocina">Cocina</option></select></div>
            <div style={{width:100}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>PIN</label><input className="field" value={editForm.pin} onChange={ev=>setEditForm({...editForm,pin:ev.target.value.replace(/\D/g,"")})}/></div>
            <button className="bp" onClick={guardarEdicion}>Guardar</button>
            <button className="bg" onClick={()=>setEditId(null)}>Cancelar</button>
          </div>
        ):(
          <div key={e.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderTop:i?"1px solid var(--line)":"none",flexWrap:"wrap"}}>
            <div style={{flex:1}}><div style={{fontWeight:700}}>{e.nombre}</div><div style={{fontSize:11.5,color:"var(--ink-soft)"}}>{e.rol==="mozo"?"Mozo":"Cocina"} · PIN {e.pin}</div></div>
            <span className="tag" style={{background:e.activo?"var(--accent-tint)":"var(--surface-2)",color:e.activo?"var(--accent)":"var(--ink-soft)"}}>{e.activo?"Activo":"Inactivo"}</span>
            <button className="bg" style={{fontSize:11.5,padding:"5px 10px"}} onClick={()=>abrirEdicion(e)}>✏️ Editar</button>
            <button className="bg" style={{fontSize:11.5,padding:"5px 10px"}} onClick={()=>toggle(e)}>{e.activo?"Desactivar":"Activar"}</button>
            <button className="bg" style={{fontSize:11.5,padding:"5px 8px"}} onClick={()=>del(e.id)}>🗑</button>
          </div>
        ))}
        {!empleados.length&&<div style={{padding:20,color:"var(--ink-soft)",fontSize:14}}>Todavía no cargaste empleados.</div>}
      </div>
    </div>
  );
}

function PanelMenu({userId,menu,insumos,recetas,reload}){
  const[form,setForm]=useState({nombre:"",categoria:"",precio:""});
  const[open,setOpen]=useState(false);
  const[selItem,setSelItem]=useState(null);
  const[recForm,setRecForm]=useState({insumo_id:"",cantidad:""});
  const add=async()=>{if(!form.nombre||!form.categoria)return;await sb.from("menu_items").insert({...form,precio:Number(form.precio)||0,user_id:userId});setForm({nombre:"",categoria:"",precio:""});setOpen(false);reload();};
  const toggle=async m=>{await sb.from("menu_items").update({activo:!m.activo}).eq("id",m.id);reload();};
  const del=async id=>{if(confirm("¿Eliminar este ítem?")){{await sb.from("menu_items").delete().eq("id",id);reload();}}};
  const addRec=async()=>{if(!recForm.insumo_id||!recForm.cantidad||!selItem)return;await sb.from("recetas").insert({user_id:userId,menu_item_id:selItem.id,insumo_id:recForm.insumo_id,cantidad:Number(recForm.cantidad)});setRecForm({insumo_id:"",cantidad:""});reload();};
  const delRec=async id=>{await sb.from("recetas").delete().eq("id",id);reload();};
  const cats=[...new Set(menu.map(m=>m.categoria))];
  const costoItem=item=>{const recs=recetas.filter(r=>r.menu_item_id===item.id);return recs.reduce((s,r)=>{const ins=insumos.find(i=>i.id===r.insumo_id);return s+(ins?Number(ins.precio_compra)*Number(r.cantidad):0);},0);};
  return(
    <div>
      <button className="bp" style={{marginBottom:16}} onClick={()=>setOpen(!open)}>➕ Nuevo ítem del menú</button>
      {open&&<div className="card" style={{padding:16,marginBottom:16,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
        <div style={{flex:"1 1 160px"}}><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Nombre</label><input className="field" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Milanesa napolitana"/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Categoría</label><input className="field" value={form.categoria} onChange={e=>setForm({...form,categoria:e.target.value})} placeholder="Principales"/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Precio</label><input className="field" style={{width:110}} value={form.precio} onChange={e=>setForm({...form,precio:e.target.value.replace(/\D/g,"")})} placeholder="8500"/></div>
        <button className="bp" onClick={add}>Guardar</button>
      </div>}
      {selItem&&(
        <div className="card" style={{padding:16,marginBottom:16,borderColor:"var(--accent)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div style={{fontWeight:700,color:"var(--accent)"}}>📦 Receta: {selItem.nombre}</div>
            <button className="bg" style={{fontSize:11.5}} onClick={()=>setSelItem(null)}>Cerrar</button>
          </div>
          {recetas.filter(r=>r.menu_item_id===selItem.id).map(r=>{const ins=insumos.find(i=>i.id===r.insumo_id);return(
            <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0",borderTop:"1px solid var(--line)"}}>
              <div style={{flex:1,fontSize:13.5}}>{ins?.nombre||"?"} — {r.cantidad} {ins?.unidad||""}</div>
              <button className="bg" style={{padding:"4px 8px",fontSize:11}} onClick={()=>delRec(r.id)}>✕</button>
            </div>
          );})}
          <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div style={{flex:1}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Insumo</label>
              <select className="field" value={recForm.insumo_id} onChange={e=>setRecForm({...recForm,insumo_id:e.target.value})}>
                <option value="">Elegir…</option>
                {insumos.map(i=><option key={i.id} value={i.id}>{i.nombre}</option>)}
              </select>
            </div>
            <div style={{width:100}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Cantidad</label><input className="field" type="number" value={recForm.cantidad} onChange={e=>setRecForm({...recForm,cantidad:e.target.value})}/></div>
            <button className="bp" onClick={addRec}>Agregar</button>
          </div>
          {!insumos.length&&<div style={{fontSize:12,color:"var(--ink-soft)",marginTop:8}}>Primero cargá insumos en la sección "Stock".</div>}
        </div>
      )}
      {cats.map(cat=>(
        <div key={cat} style={{marginBottom:18}}>
          <div style={{fontSize:12,fontWeight:800,color:"var(--primary)",marginBottom:8}}>{cat.toUpperCase()}</div>
          <div className="card" style={{overflow:"hidden"}}>
            {menu.filter(m=>m.categoria===cat).map((m,i)=>{const costo=costoItem(m);const margen=m.precio-costo;const pct=m.precio>0?Math.round(margen/m.precio*100):0;return(
              <div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 16px",borderTop:i?"1px solid var(--line)":"none",flexWrap:"wrap"}}>
                <div style={{flex:1}}><div style={{fontWeight:700}}>{m.nombre}</div>{costo>0&&<div style={{fontSize:11.5,color:"var(--ink-soft)"}}>Costo: {money(costo)} · Margen: {money(margen)} ({pct}%)</div>}</div>
                <div style={{fontWeight:700,color:"var(--primary-dark)"}}>{money(m.precio)}</div>
                <button className="bg" style={{fontSize:11.5,padding:"5px 10px"}} onClick={()=>setSelItem(selItem?.id===m.id?null:m)}>📦 Receta</button>
                <span className="tag" style={{background:m.activo?"var(--accent-tint)":"var(--surface-2)",color:m.activo?"var(--accent)":"var(--ink-soft)"}}>{m.activo?"Activo":"Pausado"}</span>
                <button className="bg" style={{fontSize:11.5,padding:"5px 10px"}} onClick={()=>toggle(m)}>{m.activo?"Pausar":"Activar"}</button>
                <button className="bg" style={{fontSize:11.5,padding:"5px 8px"}} onClick={()=>del(m.id)}>🗑</button>
              </div>
            );})}
          </div>
        </div>
      ))}
      {!menu.length&&<div style={{color:"var(--ink-soft)",fontSize:14}}>Todavía no cargaste el menú.</div>}
    </div>
  );
}

function PanelStock({userId,insumos,compras,reload}){
  const[form,setForm]=useState({nombre:"",unidad:"unidad",stock_actual:"",stock_minimo:"1",precio_compra:""});
  const[open,setOpen]=useState(false);
  const[compra,setCompra]=useState({insumo_id:"",cantidad:"",precio_unitario:""});
  const[openC,setOpenC]=useState(false);
  const add=async()=>{if(!form.nombre)return;await sb.from("insumos").insert({...form,stock_actual:Number(form.stock_actual)||0,stock_minimo:Number(form.stock_minimo)||1,precio_compra:Number(form.precio_compra)||0,user_id:userId});setForm({nombre:"",unidad:"unidad",stock_actual:"",stock_minimo:"1",precio_compra:""});setOpen(false);reload();};
  const registrarCompra=async()=>{
    if(!compra.insumo_id||!compra.cantidad)return;
    const cant=Number(compra.cantidad);const precio=Number(compra.precio_unitario)||0;
    const ins=insumos.find(i=>i.id===compra.insumo_id);if(!ins)return;
    await sb.from("insumos").update({stock_actual:Number(ins.stock_actual)+cant,precio_compra:precio||ins.precio_compra}).eq("id",ins.id);
    await sb.from("compras").insert({user_id:userId,insumo_id:compra.insumo_id,cantidad:cant,precio_unitario:precio});
    setCompra({insumo_id:"",cantidad:"",precio_unitario:""});setOpenC(false);reload();
  };
  const del=async id=>{if(confirm("¿Eliminar este insumo?")){{await sb.from("insumos").delete().eq("id",id);reload();}}};
  const[editId,setEditId]=useState(null);
  const[editForm,setEditForm]=useState({});
  const abrirEdicion=i=>{setEditId(i.id);setEditForm({nombre:i.nombre,unidad:i.unidad,stock_actual:String(i.stock_actual),stock_minimo:String(i.stock_minimo),precio_compra:String(i.precio_compra)});};
  const guardarEdicion=async()=>{
    await sb.from("insumos").update({nombre:editForm.nombre,unidad:editForm.unidad,stock_actual:Number(editForm.stock_actual)||0,stock_minimo:Number(editForm.stock_minimo)||1,precio_compra:Number(editForm.precio_compra)||0}).eq("id",editId);
    setEditId(null);reload();
  };
  const bajos=insumos.filter(i=>i.stock_actual<=i.stock_minimo);
  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
        <button className="bp" onClick={()=>{setOpen(!open);setOpenC(false);}}>➕ Nuevo insumo</button>
        <button className="bp" style={{background:"var(--accent)"}} onClick={()=>{setOpenC(!openC);setOpen(false);}}>📥 Registrar compra</button>
      </div>
      {open&&<div className="card" style={{padding:16,marginBottom:16,display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
                <div style={{flex:"1 1 160px"}}><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Insumo</label><input className="field" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Coca-Cola 500ml"/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Unidad</label><input className="field" style={{width:110}} value={form.unidad} onChange={e=>setForm({...form,unidad:e.target.value})} placeholder="botella"/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Stock inicial</label><input className="field" type="number" style={{width:90}} value={form.stock_actual} onChange={e=>setForm({...form,stock_actual:e.target.value})}/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Stock mínimo</label><input className="field" type="number" style={{width:90}} value={form.stock_minimo} onChange={e=>setForm({...form,stock_minimo:e.target.value})}/></div>
        <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Precio compra</label><input className="field" type="number" style={{width:110}} value={form.precio_compra} onChange={e=>setForm({...form,precio_compra:e.target.value})} placeholder="500"/></div>
        <button className="bp" onClick={add}>Guardar</button>
      </div>}
      {openC&&<div className="card" style={{padding:16,marginBottom:16,borderColor:"var(--accent)"}}>
        <div style={{fontWeight:700,color:"var(--accent)",marginBottom:12}}>📥 Registrar nueva compra</div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"flex-end"}}>
          <div style={{flex:1}}><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Insumo</label>
            <select className="field" value={compra.insumo_id} onChange={e=>setCompra({...compra,insumo_id:e.target.value})}>
              <option value="">Elegir…</option>
              {insumos.map(i=><option key={i.id} value={i.id}>{i.nombre}</option>)}
            </select>
          </div>
          <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Cantidad comprada</label><input className="field" type="number" style={{width:110}} value={compra.cantidad} onChange={e=>setCompra({...compra,cantidad:e.target.value})}/></div>
          <div><label style={{fontSize:12,fontWeight:700,color:"var(--ink-soft)"}}>Precio por unidad</label><input className="field" type="number" style={{width:120}} value={compra.precio_unitario} onChange={e=>setCompra({...compra,precio_unitario:e.target.value})}/></div>
          <button className="bp" style={{background:"var(--accent)"}} onClick={registrarCompra}>Registrar</button>
        </div>
      </div>}
      {bajos.length>0&&<div className="card" style={{padding:14,marginBottom:16,background:"var(--warn-tint)",border:"1px solid var(--warn)"}}>
        <div style={{fontWeight:800,color:"var(--warn)",marginBottom:8}}>⚠ STOCK BAJO — Lista de recompra sugerida</div>
        {bajos.map(i=><div key={i.id} style={{fontSize:13.5,padding:"4px 0",borderTop:"1px solid rgba(199,154,46,0.2)"}}>• {i.nombre}: quedan {i.stock_actual} {i.unidad} (mínimo: {i.stock_minimo})</div>)}
      </div>}
      <div className="card" style={{overflow:"hidden"}}>
        {insumos.map((i,idx)=>editId===i.id?(
          <div key={i.id} style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"flex-end",padding:"14px 16px",borderTop:idx?"1px solid var(--line)":"none",background:"var(--surface-2)"}}>
            <div style={{flex:"1 1 140px"}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Nombre</label><input className="field" value={editForm.nombre} onChange={e=>setEditForm({...editForm,nombre:e.target.value})}/></div>
            <div style={{width:100}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Unidad</label><input className="field" value={editForm.unidad} onChange={e=>setEditForm({...editForm,unidad:e.target.value})}/></div>
            <div style={{width:90}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Stock</label><input className="field" type="number" value={editForm.stock_actual} onChange={e=>setEditForm({...editForm,stock_actual:e.target.value})}/></div>
            <div style={{width:90}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Mínimo</label><input className="field" type="number" value={editForm.stock_minimo} onChange={e=>setEditForm({...editForm,stock_minimo:e.target.value})}/></div>
            <div style={{width:110}}><label style={{fontSize:11,fontWeight:700,color:"var(--ink-soft)"}}>Precio</label><input className="field" type="number" value={editForm.precio_compra} onChange={e=>setEditForm({...editForm,precio_compra:e.target.value})}/></div>
            <button className="bp" onClick={guardarEdicion}>Guardar</button>
            <button className="bg" onClick={()=>setEditId(null)}>Cancelar</button>
          </div>
        ):(
          <div key={i.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderTop:idx?"1px solid var(--line)":"none",flexWrap:"wrap"}}>
            <div style={{flex:1}}><div style={{fontWeight:700}}>{i.nombre}</div><div style={{fontSize:11.5,color:"var(--ink-soft)"}}>Precio compra: {money(i.precio_compra)} / {i.unidad}</div></div>
            <div style={{textAlign:"right"}}>
              <div style={{fontWeight:800,fontSize:15,color:i.stock_actual<=i.stock_minimo?"var(--warn)":"var(--ink)"}}>{i.stock_actual} {i.unidad}</div>
              <div style={{fontSize:11,color:"var(--ink-soft)"}}>mín: {i.stock_minimo}</div>
            </div>
            <span className="tag" style={{background:i.stock_actual<=i.stock_minimo?"var(--warn-tint)":"var(--accent-tint)",color:i.stock_actual<=i.stock_minimo?"var(--warn)":"var(--accent)"}}>{i.stock_actual<=i.stock_minimo?"Stock bajo":"OK"}</span>
            <button className="bg" style={{fontSize:11.5,padding:"5px 10px"}} onClick={()=>abrirEdicion(i)}>✏️ Editar</button>
            <button className="bg" style={{fontSize:11.5,padding:"5px 8px"}} onClick={()=>del(i.id)}>🗑</button>
          </div>
        ))}
        {!insumos.length&&<div style={{padding:20,color:"var(--ink-soft)",fontSize:14}}>Todavía no cargaste insumos. Agregá los productos que comprás para el negocio.</div>}
      </div>
      <div style={{fontSize:12,fontWeight:800,color:"var(--ink-soft)",margin:"24px 0 12px"}}>HISTORIAL DE COMPRAS</div>
      {!compras.length&&<div style={{color:"var(--ink-soft)",fontSize:14}}>Todavía no registraste ninguna compra.</div>}
      <div className="card" style={{overflow:"hidden"}}>
        {compras.map((c,i)=>{const ins=insumos.find(ii=>ii.id===c.insumo_id);return(
          <div key={c.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 16px",borderTop:i?"1px solid var(--line)":"none",flexWrap:"wrap"}}>
            <div key={c.id} style={{padding:"10px 16px",borderTop:i?"1px solid var(--line)":"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
              <div style={{fontWeight:700}}>{ins?.nombre||"Insumo eliminado"}</div>
              <div style={{fontWeight:700,color:"var(--primary-dark)",whiteSpace:"nowrap"}}>{money(c.cantidad*c.precio_unitario)}</div>
            </div>
          <div style={{fontSize:12,color:"var(--ink-soft)",marginTop:2}}>{c.fecha} · {c.cantidad} {ins?.unidad||""}</div>
        </div>
        );})}
      </div>
    </div>
  );
}

function PanelCaja({userId,pedidos,items,cierres,reload}){
  const[metodo,setMetodo]=useState({});
  const pedCerradosHoy=[];
  const cerrarCaja=async()=>{
    if(!confirm("¿Cerrar la caja del día?"))return;
    let ef=0,tar=0,tr=0,mesas=0;
    pedidos.forEach(p=>{const met=metodo[p.id]||"efectivo";const tot=items.filter(i=>i.pedido_id===p.id).reduce((s,i)=>s+Number(i.precio)*i.cantidad,0);if(met==="efectivo")ef+=tot;else if(met==="tarjeta")tar+=tot;else tr+=tot;mesas++;});
    const total=ef+tar+tr;
    await sb.from("cierres_caja").insert({user_id:userId,fecha:hoy(),total_efectivo:ef,total_tarjeta:tar,total_transferencia:tr,total_general:total,cantidad_mesas:mesas});
    reload();
    alert(`Caja cerrada. Total: ${money(total)}\nEfectivo: ${money(ef)}\nTarjeta: ${money(tar)}\nTransferencia: ${money(tr)}`);
  };
  const totalGeneral=pedidos.reduce((s,p)=>s+items.filter(i=>i.pedido_id===p.id).reduce((s2,i)=>s2+Number(i.precio)*i.cantidad,0),0);
  return(
    <div>
      <div className="card" style={{padding:18,marginBottom:18}}>
        <div style={{fontSize:12,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>MESAS ABIERTAS AHORA</div>
        {!pedidos.length&&<div style={{color:"var(--ink-soft)",fontSize:14}}>No hay mesas abiertas en este momento.</div>}
        {pedidos.map((p,i)=>{const tot=items.filter(i2=>i2.pedido_id===p.id).reduce((s,i2)=>s+Number(i2.precio)*i2.cantidad,0);return(
          <div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 0",borderTop:i?"1px solid var(--line)":"none",flexWrap:"wrap"}}>
            <div style={{flex:1}}><div style={{fontWeight:700}}>Mesa {p.mesa_numero}</div><div style={{fontSize:12,color:"var(--ink-soft)"}}>Mozo: {p.mozo_nombre||"—"}</div></div>
            <div style={{fontWeight:800,fontFamily:"'Fraunces',serif",fontSize:16}}>{money(tot)}</div>
            <select className="field" style={{width:160}} value={metodo[p.id]||"efectivo"} onChange={e=>setMetodo({...metodo,[p.id]:e.target.value})}>
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
            </select>
          </div>
        );})}
        {pedidos.length>0&&(
          <div style={{marginTop:16,borderTop:"2px solid var(--line)",paddingTop:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
            <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:700,color:"var(--primary-dark)"}}>Total acumulado: {money(totalGeneral)}</div>
            <button className="bp" style={{padding:"12px 20px"}} onClick={cerrarCaja}>💰 Cerrar caja del día</button>
          </div>
        )}
      </div>
      <div style={{fontSize:12,fontWeight:800,color:"var(--ink-soft)",marginBottom:12}}>HISTORIAL DE CIERRES</div>
      {!cierres.length&&<div style={{color:"var(--ink-soft)",fontSize:14}}>Todavía no realizaste ningún cierre de caja.</div>}
      <div className="card" style={{overflow:"hidden"}}>
        {cierres.map((c,i)=>(
          <div key={c.id} style={{padding:"12px 16px",borderTop:i?"1px solid var(--line)":"none"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
              <div><div style={{fontWeight:700}}>{c.fecha}</div><div style={{fontSize:11.5,color:"var(--ink-soft)"}}>{c.cantidad_mesas} mesa{c.cantidad_mesas!==1?"s":""} atendidas</div></div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700,color:"var(--primary-dark)"}}>{money(c.total_general)}</div>
            </div>
            <div style={{fontSize:12,color:"var(--ink-soft)",marginTop:4,display:"flex",gap:16,flexWrap:"wrap"}}>
              <span>💵 Efectivo: {money(c.total_efectivo)}</span>
              <span>💳 Tarjeta: {money(c.total_tarjeta)}</span>
              <span>🏦 Transf.: {money(c.total_transferencia)}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
